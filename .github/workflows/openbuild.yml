              private fun fresh(g: GameEntry): GameEntry {
                  val f = GameEntry(g.pkg, store.title(g.pkg) ?: g.appLabel, g.appLabel, g.manual)
                  games = games.map { if (it.pkg == g.pkg) f else it }
                  return f
              }

