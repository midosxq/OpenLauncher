name: Build OpenLauncher
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cek assets/source.zip
        run: |
          if [ ! -f assets/source.zip ]; then
            echo "ERROR: assets/source.zip tidak ada di repo. Upload ke folder assets lalu jalankan ulang."
            exit 1
          fi
          ls -la assets/
      - name: Tulis source project
        run: |
          set -e
          mkdir -p proj
          cd proj
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'OLEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OpenLauncher"
          include ':app'
          OLEOF
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'OLEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          OLEOF
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'OLEOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          OLEOF
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'OLEOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.midosxq.oplx'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.midosxq.oplx'
                  minSdk 30
                  targetSdk 34
                  versionCode 5
                  versionName '0.3.0-fase3'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          OLEOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'OLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application
                  android:label="OpenLauncher"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@style/OpenLauncherTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|screenLayout|keyboard|keyboardHidden|navigation|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          OLEOF
          mkdir -p "$(dirname 'app/src/main/res/values/colors.xml')"
          cat > 'app/src/main/res/values/colors.xml' <<'OLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#000000</color>
          </resources>
          OLEOF
          mkdir -p "$(dirname 'app/src/main/res/values/themes.xml')"
          cat > 'app/src/main/res/values/themes.xml' <<'OLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="OpenLauncherTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">always</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
              </style>
          </resources>
          OLEOF
          mkdir -p "$(dirname 'app/src/main/res/mipmap-anydpi/ic_launcher.xml')"
          cat > 'app/src/main/res/mipmap-anydpi/ic_launcher.xml' <<'OLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          OLEOF
          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/Pal.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/Pal.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.graphics.drawable.GradientDrawable

          object Pal {
              // Latar utama: hitam murni (#000000). Tidak ada abu-abu gelap sebagai latar.
              val BG = 0xFF000000.toInt()
              val PANEL = 0xFF000000.toInt()
              val CARD = 0xFF000000.toInt()
              // Ungu untuk border dan aksen.
              val BORDER = 0xFF7C3AED.toInt()
              val SEP = 0xFF3B1F7A.toInt()
              val PURPLE = 0xFF8B5CF6.toInt()
              val PURPLE_LIGHT = 0xFFC4B5FD.toInt()
              // Teks: putih dan abu-abu.
              val TEXT = 0xFFFFFFFF.toInt()
              val MUTED = 0xFF9A9A9A.toInt()
              // Warna status (hanya untuk teks status).
              val GREEN = 0xFF34D399.toInt()
              val AMBER = 0xFFFBBF24.toInt()
              val RED = 0xFFF87171.toInt()
              val GREY = 0xFF9CA3AF.toInt()
          }

          fun rounded(color: Int, radiusDp: Float, density: Float, strokeColor: Int = 0, strokeDp: Float = 0f): GradientDrawable {
              val g = GradientDrawable()
              g.setColor(color)
              g.cornerRadius = radiusDp * density
              if (strokeDp > 0f) {
                  g.setStroke(maxOf(1, (strokeDp * density).toInt()), strokeColor)
              }
              return g
          }
          OLEOF
          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/Model.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/Model.kt' <<'OLEOF'
          package com.midosxq.oplx

          /** Status service mapper yang ditampilkan di sidebar. */
          enum class Svc(val label: String, val color: Int) {
              RUNNING("RUNNING", Pal.GREEN),
              STOPPED("STOPPED", Pal.AMBER),
              ERROR("ERROR", Pal.RED),
              NOT_ACTIVATED("NOT ACTIVATED", Pal.GREY)
          }

          /**
           * Fase 1: belum ada Mapper Service dan belum ada metode aktivasi,
           * jadi status yang jujur hanya NOT ACTIVATED. Fase 3 yang akan mengubah ini
           * berdasarkan keadaan service yang sebenarnya.
           */
          object StatusModel {
              var svc: Svc = Svc.NOT_ACTIVATED
              var method: String = "Not Activated"
          }

          class Page(val id: String, val title: String, val phase: String, val planned: List<String>)

          object Pages {
              val all = listOf(
                  Page(
                      "library", "Game Library", "FASE 2",
                      listOf(
                          "Deteksi game terpasang (sesuai batas visibilitas paket Android)",
                          "Add Manually untuk game yang tidak terdeteksi",
                          "Kartu cover 16:9 dari assets/source.zip dan panel detail ala Steam",
                          "Launch Type per game: Launch Only atau Launch with Mapper Services"
                      )
                  ),
                  Page(
                      "config", "Game Configuration", "FASE 4-6",
                      listOf(
                          "Editor mapper: Touch, Joystick, keyboard, tombol mouse, gamepad (melanjutkan mesin mapper XPlay: WASD joystick, kamera mouse, tap, hotkey)",
                          "Mouse Settings per game: Sensitivity X/Y, Cursor Lock, Cursor Refresh, Crazy Tap, aksi scroll",
                          "Smart Auto Text Input (diuji per game)",
                          "Export/Import keymap .xpp dengan backup dan konfirmasi"
                      )
                  ),
                  Page(
                      "devices", "Devices", "FASE 3",
                      listOf(
                          "Daftar keyboard, mouse, dan gamepad (USB, Bluetooth, hub) yang terlihat oleh Android",
                          "Nama, tipe, status koneksi, dan kemampuan input"
                      )
                  ),
                  Page(
                      "highlights", "Highlights", "FASE 7",
                      listOf(
                          "Rekam gameplay dengan izin pengguna (melanjutkan perekam XPlay: resolusi, fps, bitrate, audio internal/mic, hotkey)",
                          "Simpan klip secara lokal, lihat dan kelola"
                      )
                  ),
                  Page(
                      "settings", "Settings", "FASE 6-7",
                      listOf(
                          "Custom Cursor: impor dari galeri atau file manager, dan reset ke default",
                          "Preferensi tampilan umum"
                      )
                  ),
                  Page(
                      "activation", "Activation", "FASE 3",
                      listOf(
                          "Deteksi metode: root (MagiskSU, KernelSU, KernelSU Next, APatch), Shizuku, ADB Activator",
                          "Alur aktivasi dan aktivasi ulang yang jelas",
                          "Status service yang nyata, bukan sekadar izin"
                      )
                  )
              )
          }
          OLEOF
          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/Ui.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/Ui.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.StateListDrawable
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.io.File

          const val WRAP = -2
          const val MATCH = -1

          class Ui(val ctx: Context) {
              val dens: Float = ctx.resources.displayMetrics.density

              fun dp(v: Int): Int = (v * dens).toInt()

              fun tv(t: String, sp: Float, color: Int, bold: Boolean = false): TextView {
                  val v = TextView(ctx)
                  v.text = t
                  v.textSize = sp
                  v.setTextColor(color)
                  if (bold) v.typeface = Typeface.DEFAULT_BOLD
                  return v
              }

              fun lp(w: Int, h: Int, top: Int = 0, left: Int = 0): LinearLayout.LayoutParams {
                  val l = LinearLayout.LayoutParams(w, h)
                  l.topMargin = dp(top)
                  l.leftMargin = dp(left)
                  return l
              }

              /** Kartu hitam dengan border ungu. */
              fun card(): LinearLayout {
                  val c = LinearLayout(ctx)
                  c.orientation = LinearLayout.VERTICAL
                  c.background = rounded(Pal.CARD, 12f, dens, Pal.BORDER, 1f)
                  c.setPadding(dp(20), dp(16), dp(20), dp(16))
                  return c
              }

              fun line(text: String, color: Int = Pal.TEXT, sp: Float = 13f, top: Int = 8): TextView {
                  val t = tv(text, sp, color)
                  t.layoutParams = lp(WRAP, WRAP, top)
                  return t
              }

              /** Tombol: solid ungu (utama) atau outline ungu (sekunder). Tanpa gradient. */
              fun pill(text: String, filled: Boolean, onClick: () -> Unit): TextView {
                  val t = tv(text, 13f, Color.WHITE, true)
                  if (!filled) t.setTextColor(Pal.PURPLE_LIGHT)
                  t.setPadding(dp(16), dp(9), dp(16), dp(9))
                  t.gravity = Gravity.CENTER
                  t.isClickable = true
                  t.isFocusable = true
                  val base = if (filled) Pal.PURPLE else 0
                  val sld = StateListDrawable()
                  sld.addState(intArrayOf(android.R.attr.state_pressed), rounded(base, 8f, dens, Pal.PURPLE_LIGHT, 2f))
                  sld.addState(intArrayOf(android.R.attr.state_hovered), rounded(base, 8f, dens, Pal.PURPLE_LIGHT, 2f))
                  sld.addState(intArrayOf(android.R.attr.state_focused), rounded(base, 8f, dens, Pal.PURPLE_LIGHT, 2f))
                  sld.addState(intArrayOf(), rounded(base, 8f, dens, Pal.BORDER, 1f))
                  t.background = sld
                  t.setOnClickListener { onClick() }
                  return t
              }
          }

          /** Kartu cover 16:9. Gambar di-crop hanya di lapisan tampilan; file asli tidak diubah. */
          class GameCard(ctx: Context, private val ui: Ui, private val store: Store) : FrameLayout(ctx) {
              private val image = ImageView(ctx)
              private val ph = FrameLayout(ctx)
              private val icon = ImageView(ctx)
              private val title = TextView(ctx)
              var pkg: String = ""

              init {
                  background = ColorDrawable(Pal.BG)
                  clipToOutline = true
                  image.scaleType = ImageView.ScaleType.CENTER_CROP
                  addView(image, FrameLayout.LayoutParams(MATCH, MATCH))

                  ph.background = ColorDrawable(Pal.BG)
                  icon.scaleType = ImageView.ScaleType.FIT_CENTER
                  val ilp = FrameLayout.LayoutParams(ui.dp(56), ui.dp(56))
                  ilp.gravity = Gravity.CENTER
                  ph.addView(icon, ilp)
                  addView(ph, FrameLayout.LayoutParams(MATCH, MATCH))

                  title.setTextColor(Color.WHITE)
                  title.textSize = 13f
                  title.typeface = Typeface.DEFAULT_BOLD
                  title.maxLines = 1
                  title.setPadding(ui.dp(10), ui.dp(6), ui.dp(10), ui.dp(6))
                  title.background = ColorDrawable(0xB3000000.toInt())
                  val tlp = FrameLayout.LayoutParams(MATCH, WRAP)
                  tlp.gravity = Gravity.BOTTOM
                  addView(title, tlp)

                  foreground = rounded(0, 10f, ui.dens, Pal.BORDER, 1f)
                  setOnHoverListener { _, e ->
                      if (e.action == MotionEvent.ACTION_HOVER_ENTER) {
                          foreground = rounded(0, 10f, ui.dens, Pal.PURPLE_LIGHT, 2f)
                      } else if (e.action == MotionEvent.ACTION_HOVER_EXIT) {
                          foreground = rounded(0, 10f, ui.dens, Pal.BORDER, 1f)
                      }
                      false
                  }
              }

              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  val w = View.MeasureSpec.getSize(widthMeasureSpec)
                  super.onMeasure(
                      View.MeasureSpec.makeMeasureSpec(w, View.MeasureSpec.EXACTLY),
                      View.MeasureSpec.makeMeasureSpec((w * 9f / 16f).toInt(), View.MeasureSpec.EXACTLY)
                  )
              }

              fun bind(g: GameEntry, reqW: Int, showTitle: Boolean) {
                  pkg = g.pkg
                  title.text = g.label
                  title.visibility = if (showTitle) View.VISIBLE else View.GONE
                  image.setImageDrawable(null)
                  ph.visibility = View.VISIBLE
                  try {
                      icon.setImageDrawable(context.packageManager.getApplicationIcon(g.pkg))
                  } catch (e: Exception) {
                      icon.setImageDrawable(null)
                  }
                  val custom = store.cover(g.pkg)
                  val src: String? = if (custom != null && File(custom).exists()) {
                      "file:" + custom
                  } else {
                      val b = Covers.bundledFor(g.pkg, g.appLabel)
                      if (b != null) "asset:" + b else null
                  }
                  if (src == null) return
                  Covers.get(context, src, reqW) { bmp ->
                      if (pkg == g.pkg && bmp != null) {
                          image.setImageBitmap(bmp)
                          ph.visibility = View.GONE
                      }
                  }
              }
          }
          OLEOF
          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/Store.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/Store.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          class GameEntry(val pkg: String, val label: String, val appLabel: String, val manual: Boolean)

          /**
           * Penyimpanan lokal ringan (SharedPreferences + JSON) untuk Fase 2.
           * Kunci utama selalu package name. Room bisa dievaluasi lagi saat data mapper membesar.
           */
          class Store(ctx: Context) {
              private val sp = ctx.applicationContext.getSharedPreferences("ol_library", Context.MODE_PRIVATE)

              private fun strSet(key: String): MutableSet<String> {
                  val out = LinkedHashSet<String>()
                  try {
                      val a = JSONArray(sp.getString(key, "[]"))
                      for (i in 0 until a.length()) out.add(a.getString(i))
                  } catch (e: Exception) {
                  }
                  return out
              }

              private fun putSet(key: String, s: Set<String>) {
                  sp.edit().putString(key, JSONArray(s.toList()).toString()).apply()
              }

              fun manual(): Set<String> = strSet("manual")
              fun hidden(): Set<String> = strSet("hidden")

              fun addManual(p: String) {
                  val m = strSet("manual")
                  m.add(p)
                  putSet("manual", m)
                  val h = strSet("hidden")
                  if (h.remove(p)) putSet("hidden", h)
              }

              fun removeManual(p: String) {
                  val m = strSet("manual")
                  if (m.remove(p)) putSet("manual", m)
              }

              fun hide(p: String) {
                  val h = strSet("hidden")
                  h.add(p)
                  putSet("hidden", h)
              }

              fun clearHidden() {
                  putSet("hidden", emptySet())
              }

              private fun all(): JSONObject = try {
                  JSONObject(sp.getString("games", "{}"))
              } catch (e: Exception) {
                  JSONObject()
              }

              private fun field(pkg: String, f: String): String? {
                  val o = all().optJSONObject(pkg) ?: return null
                  return if (o.has(f)) o.getString(f) else null
              }

              private fun setField(pkg: String, f: String, v: String?) {
                  val a = all()
                  val o = a.optJSONObject(pkg) ?: JSONObject()
                  if (v == null) o.remove(f) else o.put(f, v)
                  a.put(pkg, o)
                  sp.edit().putString("games", a.toString()).apply()
              }

              fun title(pkg: String): String? = field(pkg, "title")
              fun setTitle(pkg: String, v: String?) = setField(pkg, "title", v)
              fun desc(pkg: String): String? = field(pkg, "desc")
              fun setDesc(pkg: String, v: String?) = setField(pkg, "desc", v)
              fun cover(pkg: String): String? = field(pkg, "cover")
              fun setCover(pkg: String, v: String?) = setField(pkg, "cover", v)

              /** "only" (Launch Only, default) atau "mapper" (Launch with Mapper Services). */
              fun launchType(pkg: String): String = field(pkg, "launch") ?: "only"
              fun setLaunchType(pkg: String, v: String) = setField(pkg, "launch", v)
          }
          OLEOF
          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/Covers.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/Covers.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.os.Handler
          import android.os.Looper
          import android.util.LruCache
          import java.io.File
          import java.io.InputStream
          import java.util.concurrent.Executors

          object Covers {
              private val FILES = listOf(
                  "bloodstrike.png", "callofduty.png", "com.rockstar.gta3.png",
                  "com.rockstargames.gtasa.png", "com.rockstargames.gtavc.png",
                  "deltaforce.png", "ff.png", "ffmax.png", "minecraft.png", "mlbb.png"
              )
              private val ui = Handler(Looper.getMainLooper())
              private val pool = Executors.newFixedThreadPool(2)
              private val cache = object : LruCache<String, Bitmap>((Runtime.getRuntime().maxMemory() / 8).toInt()) {
                  override fun sizeOf(key: String, value: Bitmap): Int = value.byteCount
              }

              /**
               * Cover bawaan yang cocok untuk app terpasang, atau null kalau tidak yakin.
               * 1) nama file == package name (dicocokkan persis), 2) label app dari metadata terpasang.
               * Tidak menebak package. Free Fire dan Free Fire MAX tidak pernah tertukar.
               */
              fun bundledFor(pkg: String, label: String): String? {
                  val exact = pkg + ".png"
                  if (FILES.contains(exact)) return exact
                  val l = label.lowercase().replace(Regex("[^a-z0-9]"), "")
                  return when {
                      l.contains("freefire") && l.contains("max") -> "ffmax.png"
                      l.contains("freefire") -> "ff.png"
                      l.contains("bloodstrike") -> "bloodstrike.png"
                      l.contains("callofduty") && l.contains("mobile") && !l.contains("warzone") -> "callofduty.png"
                      l.contains("deltaforce") -> "deltaforce.png"
                      l.contains("minecraft") -> "minecraft.png"
                      l.contains("mobilelegends") -> "mlbb.png"
                      else -> null
                  }
              }

              private fun decode(open: () -> InputStream?, reqW: Int): Bitmap? {
                  val o = BitmapFactory.Options()
                  o.inJustDecodeBounds = true
                  open()?.use { BitmapFactory.decodeStream(it, null, o) }
                  if (o.outWidth <= 0) return null
                  var s = 1
                  while (o.outWidth / (s * 2) >= reqW) s *= 2
                  val o2 = BitmapFactory.Options()
                  o2.inSampleSize = s
                  return open()?.use { BitmapFactory.decodeStream(it, null, o2) }
              }

              /** src: "asset:<nama file>" atau "file:<path>". Dimuat di thread latar dengan inSampleSize. */
              fun get(ctx: Context, src: String, reqW: Int, cb: (Bitmap?) -> Unit) {
                  val app = ctx.applicationContext
                  val key = src + "@" + reqW
                  val hit = cache.get(key)
                  if (hit != null) {
                      cb(hit)
                      return
                  }
                  pool.execute {
                      val bmp = try {
                          decode({
                              if (src.startsWith("asset:")) app.assets.open("covers/" + src.substring(6))
                              else File(src.substring(5)).inputStream()
                          }, reqW)
                      } catch (e: Exception) {
                          null
                      }
                      if (bmp != null) cache.put(key, bmp)
                      ui.post { cb(bmp) }
                  }
              }
          }
          OLEOF
          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/LibraryView.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/LibraryView.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.graphics.BitmapFactory
          import android.graphics.Typeface
          import android.net.Uri
          import android.text.Editable
          import android.text.InputType
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ArrayAdapter
          import android.widget.BaseAdapter
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.GridView
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.io.File

          class LibraryView(private val act: MainActivity) {
              private val ui = Ui(act)
              private val store = Store(act)
              private val root = FrameLayout(act)
              private var games: List<GameEntry> = emptyList()
              private var loaded = false
              private var loading = false
              private var detail: GameEntry? = null

              fun view(): View {
                  if (!loaded && !loading) refresh()
                  return root
              }

              fun back(): Boolean {
                  if (detail != null) {
                      detail = null
                      showGrid()
                      return true
                  }
                  return false
              }

              fun refresh() {
                  loading = true
                  root.removeAllViews()
                  val t = ui.tv("Memuat daftar game...", 15f, Pal.MUTED)
                  t.setPadding(ui.dp(36), ui.dp(30), ui.dp(36), 0)
                  root.addView(t)
                  Thread {
                      val g = detect()
                      act.runOnUiThread {
                          games = g
                          loaded = true
                          loading = false
                          detail = null
                          showGrid()
                      }
                  }.start()
              }

              private fun detect(): List<GameEntry> {
                  val pm = act.packageManager
                  val manual = store.manual()
                  val hidden = store.hidden()
                  val out = ArrayList<GameEntry>()
                  val seen = HashSet<String>()
                  for (ai in pm.getInstalledApplications(0)) {
                      val pkg = ai.packageName
                      if (pkg == act.packageName) continue
                      if (pm.getLaunchIntentForPackage(pkg) == null) continue
                      val label = pm.getApplicationLabel(ai).toString()
                      val flagged = ai.category == ApplicationInfo.CATEGORY_GAME || (ai.flags and ApplicationInfo.FLAG_IS_GAME) != 0
                      val isManual = manual.contains(pkg)
                      val auto = flagged || Covers.bundledFor(pkg, label) != null
                      if (!isManual && (!auto || hidden.contains(pkg))) continue
                      if (seen.add(pkg)) out.add(GameEntry(pkg, store.title(pkg) ?: label, label, isManual))
                  }
                  return out.sortedBy { it.label.lowercase() }
              }

