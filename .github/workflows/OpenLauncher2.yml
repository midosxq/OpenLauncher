          package com.midosxq.oplx

          import android.content.Context
          import android.hardware.input.InputManager
          import android.hardware.usb.UsbManager
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.InputDevice
          import android.view.View
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView

          /** Fase 3: daftar perangkat input yang terlihat oleh Android (live lewat InputDeviceListener). */
          class DevicesView(private val act: MainActivity) : InputManager.InputDeviceListener {
              private val ui = Ui(act)
              private val root = FrameLayout(act)
              private val im = act.getSystemService(Context.INPUT_SERVICE) as InputManager
              private var showAll = false
              private var registered = false

              fun view(): View {
                  build()
                  return root
              }

              fun start() {
                  if (!registered) {
                      im.registerInputDeviceListener(this, Handler(Looper.getMainLooper()))
                      registered = true
                  }
              }

              fun stop() {
                  if (registered) {
                      im.unregisterInputDeviceListener(this)
                      registered = false
                  }
              }

              override fun onInputDeviceAdded(deviceId: Int) { if (registered) build() }
              override fun onInputDeviceRemoved(deviceId: Int) { if (registered) build() }
              override fun onInputDeviceChanged(deviceId: Int) { if (registered) build() }

              private fun kinds(d: InputDevice): List<String> {
                  val s = d.sources
                  val out = ArrayList<String>()
                  if ((s and InputDevice.SOURCE_KEYBOARD) == InputDevice.SOURCE_KEYBOARD && d.keyboardType == InputDevice.KEYBOARD_TYPE_ALPHABETIC) out.add("Keyboard")
                  if ((s and InputDevice.SOURCE_MOUSE) == InputDevice.SOURCE_MOUSE) out.add("Mouse")
                  if ((s and InputDevice.SOURCE_GAMEPAD) == InputDevice.SOURCE_GAMEPAD || (s and InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK) out.add("Gamepad")
                  if ((s and InputDevice.SOURCE_TOUCHSCREEN) == InputDevice.SOURCE_TOUCHSCREEN) out.add("Touchscreen")
                  return out
              }

              private fun sourceNames(d: InputDevice): String {
                  val s = d.sources
                  val n = ArrayList<String>()
                  if ((s and InputDevice.SOURCE_KEYBOARD) == InputDevice.SOURCE_KEYBOARD) n.add("keyboard")
                  if ((s and InputDevice.SOURCE_MOUSE) == InputDevice.SOURCE_MOUSE) n.add("mouse")
                  if ((s and InputDevice.SOURCE_MOUSE_RELATIVE) == InputDevice.SOURCE_MOUSE_RELATIVE) n.add("mouse-relatif")
                  if ((s and InputDevice.SOURCE_GAMEPAD) == InputDevice.SOURCE_GAMEPAD) n.add("gamepad")
                  if ((s and InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK) n.add("joystick")
                  if ((s and InputDevice.SOURCE_DPAD) == InputDevice.SOURCE_DPAD) n.add("dpad")
                  if ((s and InputDevice.SOURCE_TOUCHSCREEN) == InputDevice.SOURCE_TOUCHSCREEN) n.add("touchscreen")
                  if ((s and InputDevice.SOURCE_STYLUS) == InputDevice.SOURCE_STYLUS) n.add("stylus")
                  return if (n.isEmpty()) "-" else n.joinToString(", ")
              }

              private fun usbIds(): Set<String> {
                  return try {
                      val um = act.getSystemService(Context.USB_SERVICE) as UsbManager
                      um.deviceList.values.map { it.vendorId.toString() + ":" + it.productId.toString() }.toSet()
                  } catch (e: Exception) {
                      emptySet()
                  }
              }

              private fun build() {
                  root.removeAllViews()
                  val sv = ScrollView(act)
                  val col = LinearLayout(act)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(ui.dp(32), ui.dp(24), ui.dp(32), ui.dp(24))

                  val head = LinearLayout(act)
                  head.orientation = LinearLayout.HORIZONTAL
                  head.gravity = Gravity.CENTER_VERTICAL
                  head.addView(ui.tv("Devices", 28f, Pal.TEXT, true), LinearLayout.LayoutParams(0, WRAP, 1f))
                  head.addView(ui.pill(if (showAll) "Hanya keyboard/mouse/gamepad" else "Tampilkan semua input", false) {
                      showAll = !showAll
                      build()
                  }, ui.lp(WRAP, WRAP))
                  head.addView(ui.pill("Refresh", false) { build() }, ui.lp(WRAP, WRAP, 0, 10))
                  col.addView(head)

                  val usb = usbIds()
                  val shown = ArrayList<InputDevice>()
                  var total = 0
                  for (id in InputDevice.getDeviceIds()) {
                      val d = InputDevice.getDevice(id) ?: continue
                      total++
                      if (showAll) {
                          shown.add(d)
                      } else {
                          val k = kinds(d)
                          if (!d.isVirtual && (k.contains("Keyboard") || k.contains("Mouse") || k.contains("Gamepad"))) shown.add(d)
                      }
                  }
                  col.addView(
                      ui.line(shown.size.toString() + " perangkat ditampilkan (" + total + " input terlihat oleh Android)", Pal.MUTED, 12f, 4)
                  )

                  if (shown.isEmpty()) {
                      val c = ui.card()
                      c.addView(ui.tv("Belum ada keyboard, mouse, atau gamepad terdeteksi", 15f, Pal.AMBER, true))
                      c.addView(ui.line("Colokkan lewat OTG atau sambungkan lewat Bluetooth, daftar ini akan berubah otomatis.", Pal.TEXT, 13f, 8))
                      col.addView(c, ui.lp(MATCH, WRAP, 16))
                  }
                  for (d in shown) {
                      val c = ui.card()
                      val k = kinds(d)
                      c.addView(ui.tv(d.name, 16f, Pal.TEXT, true))
                      c.addView(ui.line("Tipe: " + (if (k.isEmpty()) "lainnya" else k.joinToString(" + ")), Pal.PURPLE_LIGHT, 13f, 6))
                      c.addView(ui.line("Status: terhubung", Pal.GREEN, 13f, 4))
                      val viaUsb = d.vendorId != 0 && usb.contains(d.vendorId.toString() + ":" + d.productId.toString())
                      c.addView(
                          ui.line(
                              "Koneksi: " + (if (viaUsb) "USB (cocok dengan perangkat USB yang terlihat)" else "tidak diketahui (bisa Bluetooth, internal, atau USB tanpa info)"),
                              Pal.MUTED, 12f, 4
                          )
                      )
                      var cap = "Sumber input: " + sourceNames(d)
                      if (k.contains("Gamepad")) cap += " | sumbu: " + d.motionRanges.size
                      if (k.contains("Keyboard")) cap += " | keyboard alfabet penuh"
                      c.addView(ui.line(cap, Pal.MUTED, 12f, 4))
                      c.addView(ui.line("ID Android: " + d.id + " | vendor:product " + d.vendorId + ":" + d.productId, Pal.MUTED, 11f, 4))
                      col.addView(c, ui.lp(MATCH, WRAP, 12))
                  }

                  val note = ui.card()
                  note.addView(ui.tv("Catatan", 13f, Pal.PURPLE_LIGHT, true))
                  note.addView(
                      ui.line(
                          "Android tidak menyediakan jalur koneksi (USB, Bluetooth, hub) secara andal untuk semua perangkat. " +
                              "Perangkat di balik hub USB muncul sebagai perangkat biasa, topologi hub tidak diketahui. " +
                              "Daftar ini hanya apa yang diekspos Android; kemampuan mapper menggunakannya baru dibangun di Fase 4.",
                          Pal.MUTED, 12f, 6
                      )
                  )
                  col.addView(note, ui.lp(MATCH, WRAP, 20))

                  sv.addView(col)
                  root.addView(sv, FrameLayout.LayoutParams(MATCH, MATCH))
              }
          }
          OLEOF
          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/ActivationView.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/ActivationView.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.view.View
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView

          /** Fase 3: evaluasi jalur akses dan alur aktivasi. Hanya root yang benar-benar bisa diaktifkan. */
          class ActivationView(private val act: MainActivity) {
              private val ui = Ui(act)
              private val root = FrameLayout(act)

              fun view(): View {
                  build()
                  return root
              }

              fun rebuild() {
                  build()
              }

              private fun build() {
                  root.removeAllViews()
                  val i = AccessMgr.info
                  val activated = AccessMgr.activated(act)
                  val sv = ScrollView(act)
                  val col = LinearLayout(act)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(ui.dp(32), ui.dp(24), ui.dp(32), ui.dp(24))
                  col.addView(ui.tv("Activation", 28f, Pal.TEXT, true))

                  // Status ringkas
                  val st = ui.card()
                  st.addView(ui.tv("Status", 13f, Pal.PURPLE_LIGHT, true))
                  if (activated && i.rootGranted) {
                      st.addView(ui.line("Aktif: " + AccessMgr.methodLabel(i.manager), Pal.GREEN, 15f, 8))
                      st.addView(ui.line("Mapper Service belum ada (Fase 4), jadi status service tetap STOPPED. Akses saja bukan bukti mapper berjalan.", Pal.MUTED, 12f, 6))
                  } else if (AccessMgr.revoked) {
                      st.addView(ui.line("Akses sebelumnya tidak lagi valid", Pal.RED, 15f, 8))
                      st.addView(ui.line(i.rootDetail + " Aktifkan ulang lewat tombol di bawah.", Pal.TEXT, 13f, 6))
                  } else if (AccessMgr.busy) {
                      st.addView(ui.line("Memeriksa akses... Jika muncul permintaan dari root manager, pilih Izinkan.", Pal.AMBER, 14f, 8))
                  } else {
                      st.addView(ui.line("Belum diaktifkan", Pal.AMBER, 15f, 8))
                  }
                  col.addView(st, ui.lp(MATCH, WRAP, 16))

                  // Root
                  val rc = ui.card()
                  rc.addView(ui.tv("Root", 16f, Pal.TEXT, true))
                  val rootText = when (i.rootState) {
                      AccessInfo.ROOT_GRANTED -> "Terverifikasi (uid=0)"
                      AccessInfo.ROOT_MISSING -> "Tidak tersedia"
                      AccessInfo.ROOT_DENIED -> "Ditolak atau tidak valid"
                      else -> "Belum diperiksa"
                  }
                  val rootColor = when (i.rootState) {
                      AccessInfo.ROOT_GRANTED -> Pal.GREEN
                      AccessInfo.ROOT_MISSING, AccessInfo.ROOT_DENIED -> Pal.RED
                      else -> Pal.MUTED
                  }
                  rc.addView(ui.line("Status: " + rootText, rootColor, 13f, 6))
                  if (i.rootState != AccessInfo.ROOT_UNCHECKED) rc.addView(ui.line(i.rootDetail, Pal.TEXT, 13f, 4))
                  if (i.rootGranted) {
                      val mgr = if (i.manager == "Unknown") "Tidak dapat diidentifikasi dengan pasti (tidak ditebak)" else i.manager
                      rc.addView(ui.line("Root manager: " + mgr, Pal.PURPLE_LIGHT, 13f, 4))
                      rc.addView(ui.line("Label Running Method: " + AccessMgr.methodLabel(i.manager), Pal.TEXT, 13f, 4))
                      rc.addView(ui.line("Bukti: " + i.evidence, Pal.MUTED, 11f, 4))
                  }
                  rc.addView(
                      ui.line("Kemampuan: membaca perangkat input mentah dan menyuntik sentuhan (akan dipakai Mapper Service di Fase 4). Belum dipakai di versi ini.", Pal.MUTED, 12f, 6)
                  )
                  val btnRow = LinearLayout(act)
                  btnRow.orientation = LinearLayout.HORIZONTAL
                  val label = if (activated) "Periksa ulang akses root" else "Aktifkan via Root"
                  btnRow.addView(ui.pill(label, true) { AccessMgr.activateRoot(act) }, ui.lp(WRAP, WRAP))
                  btnRow.addView(ui.pill("Periksa ulang (tanpa root)", false) { AccessMgr.refreshPassive(act) }, ui.lp(WRAP, WRAP, 0, 10))
                  if (activated) {
                      btnRow.addView(ui.pill("Nonaktifkan", false) { AccessMgr.deactivate(act) }, ui.lp(WRAP, WRAP, 0, 10))
                  }
                  rc.addView(btnRow, ui.lp(WRAP, WRAP, 12))
                  col.addView(rc, ui.lp(MATCH, WRAP, 16))

                  // Shizuku
                  val sc = ui.card()
                  sc.addView(ui.tv("Shizuku API", 16f, Pal.TEXT, true))
                  if (i.shizukuVersion != null) {
                      sc.addView(ui.line("Aplikasi Shizuku terpasang (versi " + i.shizukuVersion + ")", Pal.GREEN, 13f, 6))
                  } else {
                      sc.addView(ui.line("Aplikasi Shizuku tidak terdeteksi", Pal.MUTED, 13f, 6))
                  }
                  sc.addView(
                      ui.line("Integrasi izin dan layanan Shizuku belum diimplementasi, jadi route ini belum bisa dipakai untuk aktivasi. Status berjalan atau izin belum diverifikasi.", Pal.MUTED, 12f, 4)
                  )
                  col.addView(sc, ui.lp(MATCH, WRAP, 16))

                  // ADB
                  val ac = ui.card()
                  ac.addView(ui.tv("ADB Activator / Wireless Debugging", 16f, Pal.TEXT, true))
                  ac.addView(ui.line("USB debugging: " + (if (i.adbUsb) "aktif" else "mati"), if (i.adbUsb) Pal.GREEN else Pal.MUTED, 13f, 6))
                  ac.addView(ui.line("Wireless debugging: " + (if (i.adbWifi) "aktif" else "mati"), if (i.adbWifi) Pal.GREEN else Pal.MUTED, 13f, 4))
                  ac.addView(
                      ui.line("Pengaturan ini hanya menunjukkan opsi sistem. Jalur aktivasi lewat ADB belum diimplementasi dan kemampuannya belum diverifikasi. Bugjaeger belum diselidiki.", Pal.MUTED, 12f, 4)
                  )
                  col.addView(ac, ui.lp(MATCH, WRAP, 16))

                  val note = ui.card()
                  note.addView(ui.tv("Catatan", 13f, Pal.PURPLE_LIGHT, true))
                  note.addView(
                      ui.line(
                          "Setiap route punya kemampuan berbeda dan tidak dianggap setara. OpenLauncher tidak berpindah route diam-diam. " +
                              "Status aktif disimpan, tetapi akses divalidasi ulang setiap app dibuka.",
                          Pal.MUTED, 12f, 6
                      )
                  )
                  col.addView(note, ui.lp(MATCH, WRAP, 16))

                  sv.addView(col)
                  root.addView(sv, FrameLayout.LayoutParams(MATCH, MATCH))
              }
          }
          OLEOF
          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/MainActivity.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/MainActivity.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Typeface
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.StateListDrawable
          import android.os.Build
          import android.os.Bundle
          import android.view.View
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private lateinit var content: FrameLayout
              private lateinit var statusText: TextView
              private lateinit var methodText: TextView
              private val navItems = LinkedHashMap<String, TextView>()
              private var current = "library"
              private lateinit var library: LibraryView
              private lateinit var devices: DevicesView
              private lateinit var activation: ActivationView
              private var lastIns: WindowInsets? = null
              private val rehide = Runnable { hideBars() }
              var selectedGame: GameEntry? = null
              private var pendingCoverPkg: String? = null

              private val dens: Float get() = resources.displayMetrics.density

              private fun dp(v: Int): Int = (v * dens).toInt()

              private fun tv(t: String, sp: Float, color: Int, bold: Boolean = false): TextView {
                  val v = TextView(this)
                  v.text = t
                  v.textSize = sp
                  v.setTextColor(color)
                  if (bold) v.typeface = Typeface.DEFAULT_BOLD
                  return v
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.setDecorFitsSystemWindows(false)
                  window.addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN)
                  val wlp = window.attributes
                  wlp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                  window.attributes = wlp
                  window.setBackgroundDrawable(ColorDrawable(Pal.BG))

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.HORIZONTAL
                  root.setBackgroundColor(Pal.BG)
                  root.addView(buildSidebar(), LinearLayout.LayoutParams(dp(250), LinearLayout.LayoutParams.MATCH_PARENT))
                  val sep = View(this)
                  sep.setBackgroundColor(Pal.BORDER)
                  root.addView(sep, LinearLayout.LayoutParams(maxOf(1, dp(1)), LinearLayout.LayoutParams.MATCH_PARENT))
                  content = FrameLayout(this)
                  root.addView(content, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1f))
                  root.setOnApplyWindowInsetsListener { v, ins ->
                      lastIns = ins
                      val i = ins.getInsets(WindowInsets.Type.displayCutout() or WindowInsets.Type.systemBars())
                      v.setPadding(i.left, i.top, i.right, i.bottom)
                      if (ins.isVisible(WindowInsets.Type.statusBars()) || ins.isVisible(WindowInsets.Type.navigationBars())) {
                          v.removeCallbacks(rehide)
                          v.postDelayed(rehide, 1200)
                      }
                      ins
                  }
                  setContentView(root)
                  library = LibraryView(this)
                  devices = DevicesView(this)
                  activation = ActivationView(this)
                  AccessMgr.onChange = { runOnUiThread { applyAccess() } }
                  applyAccess()
                  AccessMgr.startup(this)
                  show(current)
              }

              private fun applyAccess() {
                  AccessMgr.applyStatus(this)
                  refreshStatus()
                  val item = navItems["activation"]
                  if (item != null) item.visibility = if (AccessMgr.activated(this)) View.GONE else View.VISIBLE
                  if (current == "activation") activation.rebuild()
                  if (current == "settings") show("settings")
              }

              override fun onDestroy() {
                  AccessMgr.onChange = null
                  devices.stop()
                  super.onDestroy()
              }

              private fun hideBars() {
                  val c = window.insetsController
                  if (c != null) {
                      c.hide(WindowInsets.Type.systemBars())
                      c.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideBars()
              }

              override fun onResume() {
                  super.onResume()
                  hideBars()
              }

              override fun onConfigurationChanged(newConfig: android.content.res.Configuration) {
                  super.onConfigurationChanged(newConfig)
                  hideBars()
                  window.decorView.requestApplyInsets()
              }

              fun openConfig(g: GameEntry) {
                  selectedGame = g
                  show("config")
              }

              fun pickCover(pkg: String) {
                  pendingCoverPkg = pkg
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "image/*"
                  try {
                      startActivityForResult(i, 31)
                  } catch (e: Exception) {
                      Toast.makeText(this, "Tidak ada pemilih file gambar di perangkat ini", Toast.LENGTH_LONG).show()
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 31 && resultCode == RESULT_OK) {
                      val u = data?.data
                      val p = pendingCoverPkg
                      if (u != null && p != null) library.onCoverPicked(p, u)
                  }
              }

              override fun onBackPressed() {
                  if (current == "library" && library.back()) return
                  super.onBackPressed()
              }

              private fun refreshStatus() {
                  statusText.text = StatusModel.svc.label
                  statusText.setTextColor(StatusModel.svc.color)
                  methodText.text = StatusModel.method
              }

              private fun buildSidebar(): View {
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setBackgroundColor(Pal.PANEL)
                  col.setPadding(dp(16), dp(18), dp(16), dp(16))

                  // Nama aplikasi (tanpa logo)
                  val name = tv("OpenLauncher", 19f, Pal.TEXT, true)
                  col.addView(name)

                  // System Status (tepat di bawah nama, di atas navigasi)
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.background = rounded(Pal.CARD, 10f, dens, Pal.BORDER, 1f)
                  box.setPadding(dp(12), dp(10), dp(12), dp(10))
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  val lbl = tv("SYSTEM STATUS", 10f, Pal.MUTED, true)
                  lbl.letterSpacing = 0.08f
                  row.addView(lbl, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  statusText = tv("", 11f, Pal.GREY, true)
                  row.addView(statusText)
                  box.addView(row)
                  val ml = tv("Running Method", 11f, Pal.MUTED)
                  val mllp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  mllp.topMargin = dp(8)
                  box.addView(ml, mllp)
                  methodText = tv("", 13f, Pal.TEXT)
                  box.addView(methodText)
                  val blp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  blp.topMargin = dp(16)
                  blp.bottomMargin = dp(14)
                  col.addView(box, blp)

                  // Navigasi (tanpa Home). Activation tampil selama aktivasi belum selesai.
                  for (p in Pages.all) {
                      val item = navItem(p)
                      if (p.id == "activation" && AccessMgr.activated(this)) item.visibility = View.GONE
                      navItems[p.id] = item
                      col.addView(item)
                  }
                  return col
              }

              private fun navItem(p: Page): TextView {
                  val t = tv(p.title, 15f, Pal.MUTED)
                  t.setPadding(dp(14), dp(11), dp(14), dp(11))
                  t.isFocusable = true
                  t.isClickable = true
                  val sld = StateListDrawable()
                  sld.addState(intArrayOf(android.R.attr.state_selected), rounded(0, 8f, dens, Pal.PURPLE, 2f))
                  sld.addState(intArrayOf(android.R.attr.state_hovered), rounded(0, 8f, dens, Pal.SEP, 1f))
                  sld.addState(intArrayOf(android.R.attr.state_focused), rounded(0, 8f, dens, Pal.PURPLE, 1f))
                  sld.addState(intArrayOf(), ColorDrawable(0))
                  t.background = sld
                  t.setOnClickListener { show(p.id) }
                  val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  lp.topMargin = dp(4)
                  t.layoutParams = lp
                  return t
              }

              fun show(id: String) {
                  current = id
                  for ((k, v) in navItems) {
                      val sel = k == id
                      v.isSelected = sel
                      v.setTextColor(if (sel) Pal.TEXT else Pal.MUTED)
                      v.typeface = if (sel) Typeface.DEFAULT_BOLD else Typeface.DEFAULT
                  }
                  if (id == "devices") devices.start() else devices.stop()
                  content.removeAllViews()
                  when (id) {
                      "library" -> content.addView(library.view())
                      "devices" -> content.addView(devices.view())
                      "activation" -> content.addView(activation.view())
                      else -> content.addView(buildPage(Pages.all.first { it.id == id }))
                  }
              }

              private fun card(): LinearLayout {
                  val c = LinearLayout(this)
                  c.orientation = LinearLayout.VERTICAL
                  c.background = rounded(Pal.CARD, 12f, dens, Pal.BORDER, 1f)
                  c.setPadding(dp(20), dp(16), dp(20), dp(16))
                  return c
              }

              private fun lp(top: Int): LinearLayout.LayoutParams {
                  val l = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  l.topMargin = dp(top)
                  return l
              }

              private fun buildPage(p: Page): View {
                  val sv = ScrollView(this)
                  sv.isFillViewport = true
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(36), dp(28), dp(36), dp(28))
                  col.addView(tv(p.title, 28f, Pal.TEXT, true))

                  val chip = tv(p.phase, 11f, Pal.PURPLE_LIGHT, true)
                  chip.setPadding(dp(10), dp(4), dp(10), dp(4))
                  chip.background = rounded(0, 12f, dens, Pal.PURPLE, 1f)
                  val clp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  clp.topMargin = dp(8)
                  col.addView(chip, clp)

                  val line = View(this)
                  line.setBackgroundColor(Pal.SEP)
                  col.addView(line, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, maxOf(1, dp(1))).also { it.topMargin = dp(16) })

                  val plan = card()
                  plan.addView(tv("Belum diimplementasi", 15f, Pal.AMBER, true))
                  val sub = tv("Direncanakan sesuai spesifikasi:", 12f, Pal.MUTED)
                  val slp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  slp.topMargin = dp(6)
                  plan.addView(sub, slp)
                  for (item in p.planned) {
                      val b = tv("\u2022  " + item, 14f, Pal.TEXT)
                      val blp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      blp.topMargin = dp(8)
                      plan.addView(b, blp)
                  }
                  col.addView(plan, lp(20))

                  if (p.id == "config") {
                      val g = selectedGame
                      if (g != null) col.addView(selectedCard(g), lp(16))
                  }

                  if (p.id == "settings") {
                      col.addView(accessCard(), lp(16))
                      col.addView(displayCard(), lp(16))
                      col.addView(aboutCard(), lp(16))
                  }
                  sv.addView(col)
                  return sv
              }

              private fun selectedCard(g: GameEntry): View {
                  val c = card()
                  c.addView(tv("Game dipilih", 15f, Pal.PURPLE_LIGHT, true))
                  val type = if (Store(this).launchType(g.pkg) == "mapper") "Launch with Mapper Services" else "Launch Only"
                  for (l in listOf(g.label, g.pkg, "Launch Type: " + type)) {
                      val t = tv(l, 13f, Pal.TEXT)
                      val llp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      llp.topMargin = dp(8)
                      c.addView(t, llp)
                  }
                  return c
              }

              private fun accessCard(): View {
                  val u = Ui(this)
                  val c = card()
                  c.addView(tv("Akses dan Aktivasi", 15f, Pal.PURPLE_LIGHT, true))
                  c.addView(u.line("Status service: " + StatusModel.svc.label, StatusModel.svc.color, 13f, 8))
                  c.addView(u.line("Running Method: " + StatusModel.method, Pal.TEXT, 13f, 4))
                  c.addView(u.pill("Buka Activation (aktivasi ulang)", false) { show("activation") }, u.lp(WRAP, WRAP, 12))
                  return c
              }

              private fun displayCard(): View {
                  val u = Ui(this)
                  val c = card()
                  c.addView(tv("Diagnostik layar (notch dan fullscreen)", 15f, Pal.PURPLE_LIGHT, true))
                  val dm = resources.displayMetrics
                  c.addView(
                      u.line(
                          "Layar: " + dm.widthPixels + " x " + dm.heightPixels + " px, density " + dm.density +
                              " (" + (dm.widthPixels / dm.density).toInt() + " x " + (dm.heightPixels / dm.density).toInt() + " dp)",
                          Pal.TEXT, 12f, 8
                      )
                  )
                  val ins = lastIns
                  if (ins != null) {
                      val cut = ins.displayCutout
                      val rects = if (cut == null) "tidak ada" else cut.boundingRects.joinToString(" ; ") { it.toShortString() }
                      val ci = ins.getInsets(WindowInsets.Type.displayCutout())
                      c.addView(u.line("Cutout/notch: " + rects, Pal.TEXT, 12f, 4))
                      c.addView(u.line("Inset notch (kiri, atas, kanan, bawah): " + ci.left + ", " + ci.top + ", " + ci.right + ", " + ci.bottom + " px", Pal.TEXT, 12f, 4))
                      val sbv = ins.isVisible(WindowInsets.Type.statusBars())
                      val nbv = ins.isVisible(WindowInsets.Type.navigationBars())
                      c.addView(u.line("Status bar terlihat: " + (if (sbv) "ya" else "tidak") + " | Navigation bar terlihat: " + (if (nbv) "ya" else "tidak"), if (sbv || nbv) Pal.AMBER else Pal.GREEN, 12f, 4))
                  } else {
                      c.addView(u.line("Data inset belum tersedia", Pal.MUTED, 12f, 4))
                  }
                  c.addView(u.pill("Terapkan ulang fullscreen", false) { hideBars() }, u.lp(WRAP, WRAP, 12))
                  return c
              }

              private fun aboutCard(): View {
                  val vn = try {
                      packageManager.getPackageInfo(packageName, 0).versionName
                  } catch (e: Exception) {
                      "?"
                  }
                  val c = card()
                  c.addView(tv("Tentang build ini", 15f, Pal.PURPLE_LIGHT, true))
                  val lines = listOf(
                      "Versi: " + vn + " (Fase 3: Aktivasi dan Devices)",
                      "OpenLauncher melanjutkan XPlay Keymapper; mesin mapper dan perekam XPlay dimigrasikan bertahap, tidak ada yang dibuang",
                      "Package: " + packageName,
                      "Android: " + Build.VERSION.RELEASE + " (API " + Build.VERSION.SDK_INT + ")",
                      "Sudah ada: kerangka UI hitam murni dengan border ungu, sidebar, System Status, Game Library (deteksi, Add Manually, cover, detail, Launch Type), Devices, Activation (verifikasi root)",
                      "System Status: NOT ACTIVATED atau STOPPED (akses aktif tapi Mapper Service belum ada); RUNNING baru di Fase 4",
                      "Belum ada: Fase 4 sampai 7. Fase 3 belum diuji di HP."
                  )
                  for (l in lines) {
                      val t = tv(l, 13f, Pal.TEXT)
                      val llp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      llp.topMargin = dp(8)
                      c.addView(t, llp)
                  }
                  return c
              }
          }
          OLEOF
          mkdir -p "$(dirname 'tools/prep_assets.py')"
          cat > 'tools/prep_assets.py' <<'OLEOF'
          import io
          import os
          import sys
          import zipfile
          from PIL import Image, ImageDraw, ImageFilter

          EXPECTED_COVERS = [
              "bloodstrike.png", "callofduty.png", "com.rockstar.gta3.png",
              "com.rockstargames.gtasa.png", "com.rockstargames.gtavc.png",
              "deltaforce.png", "ff.png", "ffmax.png", "minecraft.png", "mlbb.png",
          ]
          MAX_ENTRY_BYTES = 64 * 1024 * 1024
          MAX_PIXELS = 4096 * 4096


          def fail(msg):
              print("ERROR: " + msg)
              sys.exit(1)


          def cutout(im):
              """Hapus latar putih yang tersambung ke tepi gambar (aset asli tidak diubah)."""
              im = im.convert("RGBA")
              w, h = im.size
              for seed in [(0, 0), (w - 1, 0), (0, h - 1), (w - 1, h - 1)]:
                  p = im.getpixel(seed)
                  if p[0] > 200 and p[1] > 200 and p[2] > 200:
                      ImageDraw.floodfill(im, seed, (255, 255, 255, 0), thresh=60)
              alpha = im.getchannel("A").filter(ImageFilter.MinFilter(3))
              im.putalpha(alpha)
              px = im.load()
              a = im.getchannel("A").load()
              for y in range(1, h - 1):
                  for x in range(1, w - 1):
                      if a[x, y] == 0:
                          continue
                      near_clear = (a[x - 1, y] == 0 or a[x + 1, y] == 0 or a[x, y - 1] == 0 or a[x, y + 1] == 0)
                      r, g, b, _ = px[x, y]
                      if near_clear and r > 215 and g > 215 and b > 215:
                          px[x, y] = (r, g, b, 0)
              bbox = im.getchannel("A").getbbox()
              if not bbox:
                  fail("logo menjadi kosong setelah latar dihapus")
              im = im.crop(bbox)
              side = max(im.size)
              sq = Image.new("RGBA", (side, side), (0, 0, 0, 0))
              sq.paste(im, ((side - im.width) // 2, (side - im.height) // 2))
              return sq


          def main():
              if len(sys.argv) != 4:
                  fail("pemakaian: prep_assets.py <source.zip> <res-dir> <assets-dir>")
              zpath, res, assets_dir = sys.argv[1], sys.argv[2], sys.argv[3]
              if not os.path.isfile(zpath):
                  fail("assets/source.zip tidak ditemukan di repo. Upload source.zip ke folder 'assets' di GitHub, lalu jalankan build lagi.")
              try:
                  z = zipfile.ZipFile(zpath)
              except zipfile.BadZipFile:
                  fail("assets/source.zip rusak atau bukan file ZIP.")

              names = []
              print("== Isi assets/source.zip ==")
              for i in z.infolist():
                  n = i.filename.replace("\\", "/")
                  if n.startswith("/") or ".." in n.split("/"):
                      fail("entri ZIP tidak aman (path traversal): " + i.filename)
                  if i.file_size > MAX_ENTRY_BYTES:
                      fail("entri ZIP terlalu besar: " + i.filename)
                  if not i.is_dir():
                      names.append(n)
                      print("  %10d  %s" % (i.file_size, n))

              logos = [n for n in names if n.startswith("applogo/")]
              cursors = [n for n in names if n.startswith("cursor/")]
              covers = [n for n in names if n.startswith("gamecover/")]
              if len(logos) != 1:
                  fail("folder applogo/ harus berisi tepat 1 gambar, ditemukan: %s" % logos)

              print("== Pemeriksaan aset ==")
              if len(cursors) != 1:
                  print("PERINGATAN: folder cursor/ berisi %d file (diharapkan 1): %s" % (len(cursors), cursors))
              else:
                  head = z.read(cursors[0])[:4]
                  if head == b"\x00\x00\x02\x00":
                      print("INFO: %s sebenarnya file kursor Windows (.cur) berekstensi .png; perlu decoder khusus (Fase 6)." % cursors[0])
                  elif head[:4] == b"\x89PNG":
                      print("INFO: %s adalah PNG biasa." % cursors[0])
                  else:
                      print("PERINGATAN: format %s tidak dikenal (header %s)" % (cursors[0], head.hex()))
              have = set(os.path.basename(c) for c in covers)
              for c in EXPECTED_COVERS:
                  print("  cover %-30s %s" % (c, "ADA" if c in have else "TIDAK ADA"))
              for c in sorted(have - set(EXPECTED_COVERS)):
                  print("  cover tidak terduga: " + c)

              # Cover bawaan: hanya nama yang diharapkan, byte asli disalin apa adanya (tanpa re-encode).
              cov_out = os.path.join(assets_dir, "covers")
              os.makedirs(cov_out, exist_ok=True)
              copied = 0
              for c in EXPECTED_COVERS:
                  entry = "gamecover/" + c
                  if entry not in names:
                      continue
                  raw = z.read(entry)
                  if raw[:8] != b"\x89PNG\r\n\x1a\n":
                      print("PERINGATAN: %s bukan PNG valid, dilewati" % entry)
                      continue
                  try:
                      cim = Image.open(io.BytesIO(raw))
                      cim.verify()
                  except Exception as e:
                      print("PERINGATAN: %s rusak (%s), dilewati" % (entry, e))
                      continue
                  if cim.width * cim.height > MAX_PIXELS:
                      print("PERINGATAN: %s terlalu besar, dilewati" % entry)
                      continue
                  with open(os.path.join(cov_out, c), "wb") as fh:
                      fh.write(raw)
                  copied += 1
                  print("  cover %-30s %dx%d disalin" % (c, cim.width, cim.height))
              print("Cover bawaan disalin: %d dari %d" % (copied, len(EXPECTED_COVERS)))

              data = z.read(logos[0])
              try:
                  im = Image.open(io.BytesIO(data))
                  im.load()
              except Exception as e:
                  fail("logo tidak bisa dibaca sebagai gambar: %s" % e)
              if im.format not in ("JPEG", "PNG"):
                  fail("format logo tidak didukung: %s" % im.format)
              if im.width * im.height > MAX_PIXELS:
                  fail("resolusi logo terlalu besar")
              print("Logo: %s %dx%d mode=%s" % (im.format, im.width, im.height, im.mode))

              logo = cutout(im)
              out = os.path.join(res, "drawable-nodpi")
              os.makedirs(out, exist_ok=True)
              fg = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
              inner = logo.resize((280, 280), Image.LANCZOS)
              fg.paste(inner, ((432 - 280) // 2, (432 - 280) // 2), inner)
              fg.save(os.path.join(out, "ic_fg.png"))
              print("OK: ic_fg.png (ikon aplikasi) dibuat dari applogo/ (aset asli tidak diubah).")


          main()
          OLEOF
      - name: Siapkan aset dari assets/source.zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          python3 proj/tools/prep_assets.py assets/source.zip proj/app/src/main/res proj/app/src/main/assets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK (debug)
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLauncher-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
