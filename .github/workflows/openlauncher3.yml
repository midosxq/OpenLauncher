          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private lateinit var content: FrameLayout
              private lateinit var statusText: TextView
              private lateinit var methodText: TextView
              private val navItems = LinkedHashMap<String, TextView>()
              private var current = "library"
              private lateinit var library: LibraryView
              private lateinit var devices: DevicesView
              private lateinit var activation: ActivationView
              var selectedGame: GameEntry? = null
              private var pendingCoverPkg: String? = null
              private var lastIns: WindowInsets? = null
              private val rehide = Runnable { hideBars() }
              private val ui by lazy { Ui(this) }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  L.init(this)
                  current = savedInstanceState?.getString("page") ?: "library"

                  window.setDecorFitsSystemWindows(false)
                  window.addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN)
                  val wlp = window.attributes
                  wlp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                  window.attributes = wlp
                  window.setBackgroundDrawable(ColorDrawable(Pal.BG))

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.HORIZONTAL
                  root.setBackgroundColor(Pal.BG)
                  root.addView(buildSidebar(), LinearLayout.LayoutParams(ui.dp(250), MATCH))
                  val sep = View(this)
                  sep.setBackgroundColor(Pal.BORDER)
                  root.addView(sep, LinearLayout.LayoutParams(maxOf(1, ui.dp(1)), MATCH))
                  content = FrameLayout(this)
                  root.addView(content, LinearLayout.LayoutParams(0, MATCH, 1f))
                  root.setOnApplyWindowInsetsListener { v, ins ->
                      lastIns = ins
                      val i = ins.getInsets(WindowInsets.Type.displayCutout() or WindowInsets.Type.systemBars())
                      v.setPadding(i.left, i.top, i.right, i.bottom)
                      if (ins.isVisible(WindowInsets.Type.statusBars()) || ins.isVisible(WindowInsets.Type.navigationBars())) {
                          v.removeCallbacks(rehide)
                          v.postDelayed(rehide, 1200)
                      }
                      ins
                  }
                  setContentView(root)

                  library = LibraryView(this)
                  devices = DevicesView(this)
                  activation = ActivationView(this)
                  AccessMgr.onChange = { runOnUiThread { applyAccess() } }
                  AccessMgr.applyStatus(this)
                  refreshStatus()
                  show(current)
                  AccessMgr.startup(this)
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  outState.putString("page", current)
              }

              private fun applyAccess() {
                  AccessMgr.applyStatus(this)
                  refreshStatus()
                  val item = navItems["activation"]
                  if (item != null) item.visibility = if (AccessMgr.activated(this)) View.GONE else View.VISIBLE
                  if (current == "activation") activation.rebuild()
                  if (current == "settings") show("settings")
              }

              override fun onDestroy() {
                  AccessMgr.onChange = null
                  devices.stop()
                  super.onDestroy()
              }

              private fun hideBars() {
                  val c = window.insetsController
                  if (c != null) {
                      c.hide(WindowInsets.Type.systemBars())
                      c.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideBars()
              }

              override fun onResume() {
                  super.onResume()
                  hideBars()
              }

              override fun onConfigurationChanged(newConfig: android.content.res.Configuration) {
                  super.onConfigurationChanged(newConfig)
                  hideBars()
                  window.decorView.requestApplyInsets()
              }

              fun openConfig(g: GameEntry) {
                  selectedGame = g
                  show("config")
              }

              fun pickCover(pkg: String) {
                  pendingCoverPkg = pkg
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "image/*"
                  try {
                      startActivityForResult(i, 31)
                  } catch (e: Exception) {
                      Toast.makeText(this, L.s("No image picker found on this device", "Tidak ada pemilih file gambar di perangkat ini"), Toast.LENGTH_LONG).show()
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 31 && resultCode == RESULT_OK) {
                      val u = data?.data
                      val p = pendingCoverPkg
                      if (u != null && p != null) library.onCoverPicked(p, u)
                  }
              }

              override fun onBackPressed() {
                  if (current == "library" && library.back()) return
                  super.onBackPressed()
              }

              private fun refreshStatus() {
                  statusText.text = StatusModel.svc.label
                  statusText.setTextColor(StatusModel.svc.color)
                  methodText.text = StatusModel.method
              }

              private fun buildSidebar(): View {
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setBackgroundColor(Pal.PANEL)
                  col.setPadding(ui.dp(16), ui.dp(18), ui.dp(16), ui.dp(16))

                  col.addView(ui.tv("OpenLauncher", 19f, Pal.TEXT, true))

                  // System Status (tepat di bawah nama, di atas navigasi)
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.background = rounded(Pal.CARD, 10f, ui.dens, Pal.BORDER, 1f)
                  box.setPadding(ui.dp(12), ui.dp(10), ui.dp(12), ui.dp(10))
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  val lbl = ui.tv(L.s("SYSTEM STATUS", "STATUS SISTEM"), 10f, Pal.MUTED, true)
                  lbl.letterSpacing = 0.08f
                  row.addView(lbl, LinearLayout.LayoutParams(0, WRAP, 1f))
                  statusText = ui.tv("", 11f, Pal.GREY, true)
                  row.addView(statusText)
                  box.addView(row)
                  box.addView(ui.tv("Running Method", 11f, Pal.MUTED), ui.lp(WRAP, WRAP, 8))
                  methodText = ui.tv("", 13f, Pal.TEXT)
                  box.addView(methodText)
                  val blp = ui.lp(MATCH, WRAP, 16)
                  blp.bottomMargin = ui.dp(14)
                  col.addView(box, blp)

                  // Navigasi (tanpa Home). Activation tampil selama aktivasi belum selesai.
                  for (p in Pages.all) {
                      val item = navItem(p)
                      if (p.id == "activation" && AccessMgr.activated(this)) item.visibility = View.GONE
                      navItems[p.id] = item
                      col.addView(item)
                  }
                  return col
              }

              private fun navItem(p: Page): TextView {
                  val t = ui.tv(p.title, 15f, Pal.MUTED)
                  t.setPadding(ui.dp(14), ui.dp(11), ui.dp(14), ui.dp(11))
                  t.isFocusable = true
                  t.isClickable = true
                  val sld = StateListDrawable()
                  sld.addState(intArrayOf(android.R.attr.state_selected), rounded(0, 8f, ui.dens, Pal.PURPLE, 2f))
                  sld.addState(intArrayOf(android.R.attr.state_hovered), rounded(0, 8f, ui.dens, Pal.SEP, 1f))
                  sld.addState(intArrayOf(android.R.attr.state_focused), rounded(0, 8f, ui.dens, Pal.PURPLE, 1f))
                  sld.addState(intArrayOf(), ColorDrawable(0))
                  t.background = sld
                  t.setOnClickListener { show(p.id) }
                  t.layoutParams = ui.lp(MATCH, WRAP, 4)
                  return t
              }

              fun show(id: String) {
                  current = id
                  for ((k, v) in navItems) {
                      val sel = k == id
                      v.isSelected = sel
                      v.setTextColor(if (sel) Pal.TEXT else Pal.MUTED)
                      v.typeface = if (sel) Typeface.DEFAULT_BOLD else Typeface.DEFAULT
                  }
                  if (id == "devices") devices.start() else devices.stop()
                  content.removeAllViews()
                  when (id) {
                      "library" -> content.addView(library.view())
                      "devices" -> content.addView(devices.view())
                      "activation" -> content.addView(activation.view())
                      "settings" -> content.addView(buildSettings())
                      else -> content.addView(buildPlaceholder(Pages.all.first { it.id == id }))
                  }
              }

              private fun pageColumn(): LinearLayout {
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(ui.dp(36), ui.dp(28), ui.dp(36), ui.dp(28))
                  return col
              }

              private fun chip(p: Page): TextView {
                  val c = ui.tv(L.s("PHASE ", "FASE ") + p.phase, 11f, Pal.PURPLE_LIGHT, true)
                  c.setPadding(ui.dp(10), ui.dp(4), ui.dp(10), ui.dp(4))
                  c.background = rounded(0, 12f, ui.dens, Pal.PURPLE, 1f)
                  return c
              }

              private fun divider(): View {
                  val line = View(this)
                  line.setBackgroundColor(Pal.SEP)
                  return line
              }

              private fun plannedCard(p: Page): View {
                  val plan = ui.card()
                  plan.addView(ui.tv(L.s("Not implemented yet", "Belum diimplementasi"), 15f, Pal.AMBER, true))
                  plan.addView(ui.line(L.s("Planned according to the spec:", "Direncanakan sesuai spesifikasi:"), Pal.MUTED, 12f, 6))
                  for (item in Pages.planned(p.id)) plan.addView(ui.line("\u2022  " + item, Pal.TEXT, 14f, 8))
                  return plan
              }

              private fun buildPlaceholder(p: Page): View {
                  val sv = ScrollView(this)
                  sv.isFillViewport = true
                  val col = pageColumn()
                  col.addView(ui.tv(p.title, 28f, Pal.TEXT, true))
                  col.addView(chip(p), ui.lp(WRAP, WRAP, 8))
                  col.addView(divider(), ui.lp(MATCH, maxOf(1, ui.dp(1)), 16))
                  col.addView(plannedCard(p), ui.lp(MATCH, WRAP, 16))
                  if (p.id == "config") {
                      val g = selectedGame
                      if (g != null) col.addView(selectedCard(g), ui.lp(MATCH, WRAP, 16))
                  }
                  sv.addView(col)
                  return sv
              }

              private fun buildSettings(): View {
                  val p = Pages.all.first { it.id == "settings" }
                  val sv = ScrollView(this)
                  sv.isFillViewport = true
                  val col = pageColumn()
                  col.addView(ui.tv(p.title, 28f, Pal.TEXT, true))
                  col.addView(divider(), ui.lp(MATCH, maxOf(1, ui.dp(1)), 14))
                  col.addView(languageCard(), ui.lp(MATCH, WRAP, 16))
                  col.addView(accessCard(), ui.lp(MATCH, WRAP, 16))
                  col.addView(displayCard(), ui.lp(MATCH, WRAP, 16))
                  col.addView(aboutCard(), ui.lp(MATCH, WRAP, 16))
                  col.addView(plannedCard(p), ui.lp(MATCH, WRAP, 16))
                  sv.addView(col)
                  return sv
              }

              private fun languageCard(): View {
                  val c = ui.card()
                  c.addView(ui.tv(L.s("Language", "Bahasa"), 15f, Pal.PURPLE_LIGHT, true))
                  c.addView(ui.line(L.s("The whole app uses one language at a time.", "Seluruh aplikasi memakai satu bahasa."), Pal.MUTED, 12f, 6))
                  val r = LinearLayout(this)
                  r.orientation = LinearLayout.HORIZONTAL
                  r.addView(ui.pill("English", L.lang == "en") { setLanguage("en") }, ui.lp(WRAP, WRAP))
                  r.addView(ui.pill("Bahasa Indonesia", L.lang == "id") { setLanguage("id") }, ui.lp(WRAP, WRAP, 0, 10))
                  c.addView(r, ui.lp(WRAP, WRAP, 12))
                  return c
              }

              private fun setLanguage(code: String) {
                  if (L.lang == code) return
                  L.set(this, code)
                  recreate()
              }

              private fun selectedCard(g: GameEntry): View {
                  val c = ui.card()
                  c.addView(ui.tv(L.s("Selected game", "Game dipilih"), 15f, Pal.PURPLE_LIGHT, true))
                  val type = if (Store(this).launchType(g.pkg) == "mapper") L.s("Launch with Mapper Services", "Luncurkan dengan Mapper Services") else L.s("Launch Only", "Luncurkan Saja")
                  for (l in listOf(g.label, g.pkg, L.s("Launch Type: ", "Tipe Luncur: ") + type)) c.addView(ui.line(l, Pal.TEXT, 13f, 8))
                  return c
              }

              private fun accessCard(): View {
                  val c = ui.card()
                  c.addView(ui.tv(L.s("Access and Activation", "Akses dan Aktivasi"), 15f, Pal.PURPLE_LIGHT, true))
                  c.addView(ui.line(L.s("Service status: ", "Status service: ") + StatusModel.svc.label, StatusModel.svc.color, 13f, 8))
                  c.addView(ui.line("Running Method: " + StatusModel.method, Pal.TEXT, 13f, 4))
                  c.addView(ui.pill(L.s("Open Activation (re-activate)", "Buka Aktivasi (aktivasi ulang)"), false) { show("activation") }, ui.lp(WRAP, WRAP, 12))
                  return c
              }

              private fun displayCard(): View {
                  val c = ui.card()
                  c.addView(ui.tv(L.s("Screen diagnostics (notch and fullscreen)", "Diagnostik layar (notch dan fullscreen)"), 15f, Pal.PURPLE_LIGHT, true))
                  val dm = resources.displayMetrics
                  c.addView(
                      ui.line(
                          L.s("Screen: ", "Layar: ") + dm.widthPixels + " x " + dm.heightPixels + " px, density " + dm.density +
                              " (" + (dm.widthPixels / dm.density).toInt() + " x " + (dm.heightPixels / dm.density).toInt() + " dp)",
                          Pal.TEXT, 12f, 8
                      )
                  )
                  val ins = lastIns
                  if (ins != null) {
                      val cut = ins.displayCutout
                      val rects = if (cut == null) L.s("none", "tidak ada") else cut.boundingRects.joinToString(" ; ") { it.toShortString() }
                      val ci = ins.getInsets(WindowInsets.Type.displayCutout())
                      c.addView(ui.line("Cutout/notch: " + rects, Pal.TEXT, 12f, 4))
                      c.addView(
                          ui.line(
                              L.s("Notch insets (left, top, right, bottom): ", "Inset notch (kiri, atas, kanan, bawah): ") +
                                  ci.left + ", " + ci.top + ", " + ci.right + ", " + ci.bottom + " px",
                              Pal.TEXT, 12f, 4
                          )
                      )
                      val sbv = ins.isVisible(WindowInsets.Type.statusBars())
                      val nbv = ins.isVisible(WindowInsets.Type.navigationBars())
                      c.addView(
                          ui.line(
                              L.s("Status bar visible: ", "Status bar terlihat: ") + (if (sbv) L.s("yes", "ya") else L.s("no", "tidak")) +
                                  L.s(" | Navigation bar visible: ", " | Navigation bar terlihat: ") + (if (nbv) L.s("yes", "ya") else L.s("no", "tidak")),
                              if (sbv || nbv) Pal.AMBER else Pal.GREEN, 12f, 4
                          )
                      )
                  } else {
                      c.addView(ui.line(L.s("Inset data not available yet", "Data inset belum tersedia"), Pal.MUTED, 12f, 4))
                  }
                  c.addView(ui.pill(L.s("Re-apply fullscreen", "Terapkan ulang fullscreen"), false) { hideBars() }, ui.lp(WRAP, WRAP, 12))
                  return c
              }

              private fun aboutCard(): View {
                  val vn = try {
                      packageManager.getPackageInfo(packageName, 0).versionName
                  } catch (e: Exception) {
                      "?"
                  }
                  val c = ui.card()
                  c.addView(ui.tv(L.s("About this build", "Tentang build ini"), 15f, Pal.PURPLE_LIGHT, true))
                  val lines = listOf(
                      L.s("Version: ", "Versi: ") + vn,
                      L.s(
                          "OpenLauncher continues XPlay Keymapper; the XPlay mapper engine and recorder will be migrated step by step, nothing is dropped",
                          "OpenLauncher melanjutkan XPlay Keymapper; mesin mapper dan perekam XPlay dimigrasikan bertahap, tidak ada yang dibuang"
                      ),
                      "Package: " + packageName,
                      "Android: " + Build.VERSION.RELEASE + " (API " + Build.VERSION.SDK_INT + ")",
                      L.s(
                          "Available: pure black UI with purple borders, sidebar, System Status, Game Library with Steam-style game page, Devices, Activation (root verification), English/Indonesian",
                          "Sudah ada: UI hitam murni dengan border ungu, sidebar, System Status, Pustaka Game dengan halaman game bergaya Steam, Perangkat, Aktivasi (verifikasi root), Inggris/Indonesia"
                      ),
                      L.s(
                          "System Status: NOT ACTIVATED or STOPPED (access active but the Mapper Service is not built yet); RUNNING arrives with the mapper service",
                          "System Status: BELUM AKTIF atau BERHENTI (akses aktif tetapi Mapper Service belum dibangun); BERJALAN baru ada bersama mapper service"
                      ),
                      L.s(
                          "Not built yet: mapper service, editor, mouse settings, keymap export/import, cursor, Highlights, welcome screen and intro. Not tested on the device yet.",
                          "Belum ada: mapper service, editor, pengaturan mouse, export/import keymap, cursor, Highlights, welcome screen dan intro. Belum diuji di perangkat."
                      )
                  )
                  for (l in lines) c.addView(ui.line(l, Pal.TEXT, 13f, 8))
                  return c
              }
          }
          OLEOF
          mkdir -p "$(dirname 'tools/prep_assets.py')"
          cat > 'tools/prep_assets.py' <<'OLEOF'
          import io
          import os
          import sys
          import zipfile
          from PIL import Image, ImageDraw, ImageFilter

          EXPECTED_COVERS = [
              "bloodstrike.png", "callofduty.png", "com.rockstar.gta3.png",
              "com.rockstargames.gtasa.png", "com.rockstargames.gtavc.png",
              "deltaforce.png", "ff.png", "ffmax.png", "minecraft.png", "mlbb.png",
          ]
          MAX_ENTRY_BYTES = 64 * 1024 * 1024
          BRAND_MAX_TOTAL = 80 * 1024 * 1024
          AUDIO_EXT = (".mp3", ".wav", ".ogg", ".m4a", ".aac", ".flac")
          MAX_PIXELS = 4096 * 4096


          def fail(msg):
              print("ERROR: " + msg)
              sys.exit(1)


          def handle_branding(path, assets_dir):
              """Salin assets/branding.zip ke assets/branding/ di dalam APK (struktur dipertahankan, file asli tidak diubah)."""
              try:
                  z = zipfile.ZipFile(path)
              except zipfile.BadZipFile:
                  fail("assets/branding.zip rusak atau bukan file ZIP.")
              entries = []
              total = 0
              for i in z.infolist():
                  n = i.filename.replace("\\", "/")
                  if n.startswith("/") or ".." in n.split("/"):
                      fail("entri tidak aman di branding.zip: " + i.filename)
                  if i.is_dir():
                      continue
                  total += i.file_size
                  entries.append((i, n))
              if total > BRAND_MAX_TOTAL:
                  fail("isi branding.zip terlalu besar")
              out_root = os.path.join(assets_dir, "branding")
              print("== assets/branding.zip ==")
              kept = 0
              for i, n in entries:
                  low = n.lower()
                  base = os.path.basename(n)
                  if low.startswith("__macosx/") or base.startswith("._") or base == ".DS_Store":
                      continue
                  if low.endswith(AUDIO_EXT):
                      print("  dilewati (UI Sound ditunda): " + n)
                      continue
                  data = z.read(i)
                  dest = os.path.join(out_root, n)
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  with open(dest, "wb") as fh:
                      fh.write(data)
                  note = ""
                  if low.endswith((".png", ".jpg", ".jpeg", ".webp")):
                      try:
                          bim = Image.open(io.BytesIO(data))
                          note = "  %s %dx%d" % (bim.format, bim.width, bim.height)
                          if low.endswith(".png") and bim.format != "PNG":
                              note += "  (isi sebenarnya %s walau berekstensi .png; file asli tidak diubah)" % bim.format
                      except Exception:
                          note = "  (gambar tidak terbaca)"
                  print("  %10d  %s%s" % (len(data), n, note))
                  kept += 1
              if kept == 0:
                  fail("branding.zip tidak berisi file yang bisa dipakai")
              print("Branding disalin: %d file ke assets/branding/ (belum dipakai UI di versi ini)." % kept)


          def cutout(im):
              """Hapus latar putih yang tersambung ke tepi gambar (aset asli tidak diubah)."""
              im = im.convert("RGBA")
              w, h = im.size
              for seed in [(0, 0), (w - 1, 0), (0, h - 1), (w - 1, h - 1)]:
                  p = im.getpixel(seed)
                  if p[0] > 200 and p[1] > 200 and p[2] > 200:
                      ImageDraw.floodfill(im, seed, (255, 255, 255, 0), thresh=60)
              alpha = im.getchannel("A").filter(ImageFilter.MinFilter(3))
              im.putalpha(alpha)
              px = im.load()
              a = im.getchannel("A").load()
              for y in range(1, h - 1):
                  for x in range(1, w - 1):
                      if a[x, y] == 0:
                          continue
                      near_clear = (a[x - 1, y] == 0 or a[x + 1, y] == 0 or a[x, y - 1] == 0 or a[x, y + 1] == 0)
                      r, g, b, _ = px[x, y]
                      if near_clear and r > 215 and g > 215 and b > 215:
                          px[x, y] = (r, g, b, 0)
              bbox = im.getchannel("A").getbbox()
              if not bbox:
                  fail("logo menjadi kosong setelah latar dihapus")
              im = im.crop(bbox)
              side = max(im.size)
              sq = Image.new("RGBA", (side, side), (0, 0, 0, 0))
              sq.paste(im, ((side - im.width) // 2, (side - im.height) // 2))
              return sq


          def main():
              if len(sys.argv) not in (4, 5):
                  fail("pemakaian: prep_assets.py <source.zip> <res-dir> <assets-dir> [branding.zip]")
              zpath, res, assets_dir = sys.argv[1], sys.argv[2], sys.argv[3]
              branding = sys.argv[4] if len(sys.argv) == 5 else None
              if not os.path.isfile(zpath):
                  fail("assets/source.zip tidak ditemukan di repo. Upload source.zip ke folder 'assets' di GitHub, lalu jalankan build lagi.")
              try:
                  z = zipfile.ZipFile(zpath)
              except zipfile.BadZipFile:
                  fail("assets/source.zip rusak atau bukan file ZIP.")

              names = []
              print("== Isi assets/source.zip ==")
              for i in z.infolist():
                  n = i.filename.replace("\\", "/")
                  if n.startswith("/") or ".." in n.split("/"):
                      fail("entri ZIP tidak aman (path traversal): " + i.filename)
                  if i.file_size > MAX_ENTRY_BYTES:
                      fail("entri ZIP terlalu besar: " + i.filename)
                  if not i.is_dir():
                      names.append(n)
                      print("  %10d  %s" % (i.file_size, n))

              logos = [n for n in names if n.startswith("applogo/")]
              cursors = [n for n in names if n.startswith("cursor/")]
              covers = [n for n in names if n.startswith("gamecover/")]
              if len(logos) != 1:
                  fail("folder applogo/ harus berisi tepat 1 gambar, ditemukan: %s" % logos)

              print("== Pemeriksaan aset ==")
              if len(cursors) != 1:
                  print("PERINGATAN: folder cursor/ berisi %d file (diharapkan 1): %s" % (len(cursors), cursors))
              else:
                  head = z.read(cursors[0])[:4]
                  if head == b"\x00\x00\x02\x00":
                      print("INFO: %s sebenarnya file kursor Windows (.cur) berekstensi .png; perlu decoder khusus (Fase 6)." % cursors[0])
                  elif head[:4] == b"\x89PNG":
                      print("INFO: %s adalah PNG biasa." % cursors[0])
                  else:
                      print("PERINGATAN: format %s tidak dikenal (header %s)" % (cursors[0], head.hex()))
              have = set(os.path.basename(c) for c in covers)
              for c in EXPECTED_COVERS:
                  print("  cover %-30s %s" % (c, "ADA" if c in have else "TIDAK ADA"))
              for c in sorted(have - set(EXPECTED_COVERS)):
                  print("  cover tidak terduga: " + c)

              # Cover bawaan: hanya nama yang diharapkan, byte asli disalin apa adanya (tanpa re-encode).
              cov_out = os.path.join(assets_dir, "covers")
              os.makedirs(cov_out, exist_ok=True)
              copied = 0
              for c in EXPECTED_COVERS:
                  entry = "gamecover/" + c
                  if entry not in names:
                      continue
                  raw = z.read(entry)
                  if raw[:8] != b"\x89PNG\r\n\x1a\n":
                      print("PERINGATAN: %s bukan PNG valid, dilewati" % entry)
                      continue
                  try:
                      cim = Image.open(io.BytesIO(raw))
                      cim.verify()
                  except Exception as e:
                      print("PERINGATAN: %s rusak (%s), dilewati" % (entry, e))
                      continue
                  if cim.width * cim.height > MAX_PIXELS:
                      print("PERINGATAN: %s terlalu besar, dilewati" % entry)
                      continue
                  with open(os.path.join(cov_out, c), "wb") as fh:
                      fh.write(raw)
                  copied += 1
                  print("  cover %-30s %dx%d disalin" % (c, cim.width, cim.height))
              print("Cover bawaan disalin: %d dari %d" % (copied, len(EXPECTED_COVERS)))

              data = z.read(logos[0])
              try:
                  im = Image.open(io.BytesIO(data))
                  im.load()
              except Exception as e:
                  fail("logo tidak bisa dibaca sebagai gambar: %s" % e)
              if im.format not in ("JPEG", "PNG"):
                  fail("format logo tidak didukung: %s" % im.format)
              if im.width * im.height > MAX_PIXELS:
                  fail("resolusi logo terlalu besar")
              print("Logo: %s %dx%d mode=%s" % (im.format, im.width, im.height, im.mode))

              logo = cutout(im)
              out = os.path.join(res, "drawable-nodpi")
              os.makedirs(out, exist_ok=True)
              fg = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
              inner = logo.resize((280, 280), Image.LANCZOS)
              fg.paste(inner, ((432 - 280) // 2, (432 - 280) // 2), inner)
              fg.save(os.path.join(out, "ic_fg.png"))
              print("OK: ic_fg.png (ikon aplikasi) dibuat dari applogo/ (aset asli tidak diubah).")
              if branding:
                  handle_branding(branding, assets_dir)


          main()
          OLEOF

      - name: Prepare assets (source.zip, branding.zip)
        run: |
          set -e
          python3 -c "import PIL" 2>/dev/null || sudo apt-get install -y -qq --no-install-recommends python3-pil || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-pil; }
          BRAND=""
          if [ -f assets/branding.zip ]; then
            BRAND="assets/branding.zip"
          else
            echo "::warning::assets/branding.zip tidak ditemukan, aset branding dilewati (belum dipakai UI)."
          fi
          python3 proj/tools/prep_assets.py assets/source.zip proj/app/src/main/res proj/app/src/main/assets $BRAND

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --console=plain --warning-mode=none

      - name: Verify APK
        run: |
          APK=proj/app/build/outputs/apk/debug/app-debug.apk
          if [ ! -s "$APK" ]; then
            echo "::error::APK tidak ditemukan di $APK"
            exit 1
          fi
          ls -la "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenLauncher-APK-debug
          path: proj/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
