name: OpenLauncher Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

# Hemat menit Actions: run lama otomatis dibatalkan kalau ada run baru di branch yang sama.
concurrency:
  group: openlauncher-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: assets
          fetch-depth: 1

      - name: Check assets
        run: |
          if [ ! -f assets/source.zip ]; then
            echo "::error::assets/source.zip tidak ada di repo. Upload ke folder assets lalu jalankan ulang."
            exit 1
          fi
          ls -la assets

      - name: Write project source
        run: |
          set -e
          mkdir -p proj
          cd proj
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'OLEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OpenLauncher"
          include ':app'
          OLEOF
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'OLEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          OLEOF
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'OLEOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          org.gradle.caching=true
          org.gradle.parallel=true
          OLEOF
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'OLEOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.midosxq.oplx'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.midosxq.oplx'
                  minSdk 30
                  targetSdk 34
                  versionCode 6
                  versionName '0.4.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          OLEOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'OLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application
                  android:label="OpenLauncher"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@style/OpenLauncherTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|screenLayout|keyboard|keyboardHidden|navigation|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          OLEOF
          mkdir -p "$(dirname 'app/src/main/res/values/colors.xml')"
          cat > 'app/src/main/res/values/colors.xml' <<'OLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#000000</color>
          </resources>
          OLEOF
          mkdir -p "$(dirname 'app/src/main/res/values/themes.xml')"
          cat > 'app/src/main/res/values/themes.xml' <<'OLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="OpenLauncherTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">always</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
              </style>
          </resources>
          OLEOF
          mkdir -p "$(dirname 'app/src/main/res/mipmap-anydpi/ic_launcher.xml')"
          cat > 'app/src/main/res/mipmap-anydpi/ic_launcher.xml' <<'OLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          OLEOF
          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/Pal.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/Pal.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.graphics.drawable.GradientDrawable

          object Pal {
              // Latar utama: hitam murni (#000000). Tidak ada abu-abu gelap sebagai latar.
              val BG = 0xFF000000.toInt()
              val PANEL = 0xFF000000.toInt()
              val CARD = 0xFF000000.toInt()
              // Ungu untuk border dan aksen.
              val BORDER = 0xFF7C3AED.toInt()
              val SEP = 0xFF3B1F7A.toInt()
              val PURPLE = 0xFF8B5CF6.toInt()
              val PURPLE_LIGHT = 0xFFC4B5FD.toInt()
              // Teks: putih dan abu-abu.
              val TEXT = 0xFFFFFFFF.toInt()
              val MUTED = 0xFF9A9A9A.toInt()
              // Warna status (hanya untuk teks status).
              val GREEN = 0xFF34D399.toInt()
              val AMBER = 0xFFFBBF24.toInt()
              val RED = 0xFFF87171.toInt()
              val GREY = 0xFF9CA3AF.toInt()
          }

          fun rounded(color: Int, radiusDp: Float, density: Float, strokeColor: Int = 0, strokeDp: Float = 0f): GradientDrawable {
              val g = GradientDrawable()
              g.setColor(color)
              g.cornerRadius = radiusDp * density
              if (strokeDp > 0f) {
                  g.setStroke(maxOf(1, (strokeDp * density).toInt()), strokeColor)
              }
              return g
          }
          OLEOF
          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/Model.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/Model.kt' <<'OLEOF'
          package com.midosxq.oplx

          /** Status service mapper yang ditampilkan di sidebar. */
          enum class Svc(private val en: String, private val id: String, val color: Int) {
              RUNNING("RUNNING", "BERJALAN", Pal.GREEN),
              STOPPED("STOPPED", "BERHENTI", Pal.AMBER),
              ERROR("ERROR", "ERROR", Pal.RED),
              NOT_ACTIVATED("NOT ACTIVATED", "BELUM AKTIF", Pal.GREY);

              val label: String get() = L.s(en, id)
          }

          /** Status nyata. Diperbarui oleh AccessMgr.applyStatus; tidak pernah RUNNING sebelum Mapper Service ada. */
          object StatusModel {
              var svc: Svc = Svc.NOT_ACTIVATED
              var method: String = ""
          }

          class Page(val id: String, private val titleEn: String, private val titleId: String, val phase: String) {
              val title: String get() = L.s(titleEn, titleId)
          }

          object Pages {
              val all = listOf(
                  Page("library", "Game Library", "Pustaka Game", "2"),
                  Page("config", "Game Configuration", "Konfigurasi Game", "4-5"),
                  Page("devices", "Devices", "Perangkat", "3"),
                  Page("highlights", "Highlights", "Sorotan", "7"),
                  Page("settings", "Settings", "Pengaturan", "6-7"),
                  Page("activation", "Activation", "Aktivasi", "3")
              )

              /** Rencana untuk halaman yang belum dibangun. */
              fun planned(id: String): List<String> = when (id) {
                  "config" -> listOf(
                      L.s("Mapper service, toolbar, and editor: Touch, Joystick, keyboard, mouse buttons, gamepad (continuing the XPlay mapper engine: WASD joystick, mouse camera, tap, hotkeys)",
                          "Mapper service, toolbar, dan editor: Touch, Joystick, keyboard, tombol mouse, gamepad (melanjutkan mesin mapper XPlay: joystick WASD, kamera mouse, tap, hotkey)"),
                      L.s("Mouse Settings per game: Sensitivity X/Y, Cursor Lock, Cursor Refresh, Crazy Tap, scroll actions",
                          "Pengaturan Mouse per game: Sensitivitas X/Y, Cursor Lock, Cursor Refresh, Crazy Tap, aksi scroll"),
                      L.s("Smart Auto Text Input (tested per game)", "Smart Auto Text Input (diuji per game)"),
                      L.s("Export/Import keymap .xpp with backup and confirmation", "Export/Import keymap .xpp dengan backup dan konfirmasi")
                  )
                  "highlights" -> listOf(
                      L.s("Record gameplay with user consent (continuing the XPlay recorder: resolution, fps, bitrate, internal/mic audio, hotkeys)",
                          "Rekam gameplay dengan izin pengguna (melanjutkan perekam XPlay: resolusi, fps, bitrate, audio internal/mic, hotkey)"),
                      L.s("Save clips locally, view and manage them", "Simpan klip secara lokal, lihat dan kelola")
                  )
                  "settings" -> listOf(
                      L.s("Custom Cursor: import from gallery or file manager, and reset to default",
                          "Custom Cursor: impor dari galeri atau file manager, dan reset ke default"),
                      L.s("More appearance preferences", "Preferensi tampilan lainnya")
                  )
                  else -> emptyList()
              }
          }
          OLEOF
          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/L.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/L.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.content.Context
          import java.util.Locale

          /** Bahasa aplikasi: "en" atau "id". Semua teks UI memakai L.s(inggris, indonesia). */
          object L {
              @Volatile var lang: String = "en"

              private fun sp(c: Context) = c.applicationContext.getSharedPreferences("ol_lang", Context.MODE_PRIVATE)

              fun init(c: Context) {
                  val saved = sp(c).getString("lang", null)
                  if (saved != null) {
                      lang = saved
                  } else {
                      val sys = Locale.getDefault().language
                      lang = if (sys == "id" || sys == "in") "id" else "en"
                  }
              }

              fun set(c: Context, l: String) {
                  lang = l
                  sp(c).edit().putString("lang", l).apply()
              }

              fun s(en: String, id: String): String = if (lang == "id") id else en
          }
          OLEOF
          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/GameInfo.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/GameInfo.kt' <<'OLEOF'
          package com.midosxq.oplx

          /** Deskripsi singkat game yang covernya dikenali (ditulis ulang dengan kata-kata sendiri). */
          object GameInfo {
              class Info(val dev: String, val en: String, val id: String)

              private val map = mapOf(
                  "bloodstrike.png" to Info(
                      "NetEase Games",
                      "A free-to-play first-person shooter built for phones. It mixes battle royale with faster, smaller modes such as Squad Fight and Hot Zone, and lets you pick a Striker with their own skills. It is designed to run smoothly even on modest hardware.",
