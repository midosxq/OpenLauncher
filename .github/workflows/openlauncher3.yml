          package com.midosxq.oplx

          import android.view.View
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView

          /** Evaluasi jalur akses dan alur aktivasi. Hanya root yang benar-benar bisa diaktifkan. */
          class ActivationView(private val act: MainActivity) {
              private val ui = Ui(act)
              private val root = FrameLayout(act)

              fun view(): View {
                  build()
                  return root
              }

              fun rebuild() {
                  build()
              }

              private fun build() {
                  root.removeAllViews()
                  val i = AccessMgr.info
                  val activated = AccessMgr.activated(act)
                  val sv = ScrollView(act)
                  val col = LinearLayout(act)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(ui.dp(32), ui.dp(24), ui.dp(32), ui.dp(24))
                  col.addView(ui.tv(L.s("Activation", "Aktivasi"), 28f, Pal.TEXT, true))

                  // Status ringkas
                  val st = ui.card()
                  st.addView(ui.tv("Status", 13f, Pal.PURPLE_LIGHT, true))
                  if (activated && i.rootGranted) {
                      st.addView(ui.line(L.s("Active: ", "Aktif: ") + AccessMgr.methodLabel(i.manager), Pal.GREEN, 15f, 8))
                      st.addView(
                          ui.line(
                              L.s(
                                  "The Mapper Service is not built yet, so the service status stays STOPPED. Access alone does not mean the mapper is running.",
                                  "Mapper Service belum ada, jadi status service tetap BERHENTI. Akses saja bukan bukti mapper berjalan."
                              ), Pal.MUTED, 12f, 6
                          )
                      )
                  } else if (AccessMgr.revoked) {
                      st.addView(ui.line(L.s("Previous access is no longer valid", "Akses sebelumnya tidak lagi valid"), Pal.RED, 15f, 8))
                      st.addView(ui.line(AccessMgr.detailText(i.rootDetail) + L.s(" Activate again with the button below.", " Aktifkan ulang lewat tombol di bawah."), Pal.TEXT, 13f, 6))
                  } else if (AccessMgr.busy) {
                      st.addView(ui.line(L.s("Checking access... If the root manager asks, choose Allow.", "Memeriksa akses... Jika muncul permintaan dari root manager, pilih Izinkan."), Pal.AMBER, 14f, 8))
                  } else {
                      st.addView(ui.line(L.s("Not activated yet", "Belum diaktifkan"), Pal.AMBER, 15f, 8))
                  }
                  col.addView(st, ui.lp(MATCH, WRAP, 16))

                  // Root
                  val rc = ui.card()
                  rc.addView(ui.tv("Root", 16f, Pal.TEXT, true))
                  val rootText = when (i.rootState) {
                      AccessInfo.ROOT_GRANTED -> L.s("Verified (uid=0)", "Terverifikasi (uid=0)")
                      AccessInfo.ROOT_MISSING -> L.s("Not available", "Tidak tersedia")
                      AccessInfo.ROOT_DENIED -> L.s("Denied or not valid", "Ditolak atau tidak valid")
                      else -> L.s("Not checked yet", "Belum diperiksa")
                  }
                  val rootColor = when (i.rootState) {
                      AccessInfo.ROOT_GRANTED -> Pal.GREEN
                      AccessInfo.ROOT_MISSING, AccessInfo.ROOT_DENIED -> Pal.RED
                      else -> Pal.MUTED
                  }
                  rc.addView(ui.line("Status: " + rootText, rootColor, 13f, 6))
                  if (i.rootState != AccessInfo.ROOT_UNCHECKED) rc.addView(ui.line(AccessMgr.detailText(i.rootDetail), Pal.TEXT, 13f, 4))
                  if (i.rootGranted) {
                      val mgr = if (i.manager == "Unknown") L.s("Cannot be identified with certainty (not guessed)", "Tidak dapat diidentifikasi dengan pasti (tidak ditebak)") else i.manager
                      rc.addView(ui.line("Root manager: " + mgr, Pal.PURPLE_LIGHT, 13f, 4))
                      rc.addView(ui.line(L.s("Running Method label: ", "Label Running Method: ") + AccessMgr.methodLabel(i.manager), Pal.TEXT, 13f, 4))
                      rc.addView(ui.line(L.s("Evidence: ", "Bukti: ") + i.evidence, Pal.MUTED, 11f, 4))
                  }
                  rc.addView(
                      ui.line(
                          L.s(
                              "Capability: reading raw input devices and injecting touches (to be used by the Mapper Service later). Not used in this version.",
                              "Kemampuan: membaca perangkat input mentah dan menyuntik sentuhan (akan dipakai Mapper Service nanti). Belum dipakai di versi ini."
                          ), Pal.MUTED, 12f, 6
                      )
                  )
                  val btnRow = LinearLayout(act)
                  btnRow.orientation = LinearLayout.HORIZONTAL
                  val label = if (activated) L.s("Re-check root access", "Periksa ulang akses root") else L.s("Activate via Root", "Aktifkan via Root")
                  btnRow.addView(ui.pill(label, true) { AccessMgr.activateRoot(act) }, ui.lp(WRAP, WRAP))
                  btnRow.addView(ui.pill(L.s("Re-check (no root)", "Periksa ulang (tanpa root)"), false) { AccessMgr.refreshPassive(act) }, ui.lp(WRAP, WRAP, 0, 10))
                  if (activated) {
                      btnRow.addView(ui.pill(L.s("Deactivate", "Nonaktifkan"), false) { AccessMgr.deactivate(act) }, ui.lp(WRAP, WRAP, 0, 10))
                  }
                  rc.addView(btnRow, ui.lp(WRAP, WRAP, 12))
                  col.addView(rc, ui.lp(MATCH, WRAP, 16))

                  // Shizuku
                  val sc = ui.card()
                  sc.addView(ui.tv("Shizuku API", 16f, Pal.TEXT, true))
                  if (i.shizukuVersion != null) {
                      sc.addView(ui.line(L.s("Shizuku app installed (version ", "Aplikasi Shizuku terpasang (versi ") + i.shizukuVersion + ")", Pal.GREEN, 13f, 6))
                  } else {
                      sc.addView(ui.line(L.s("Shizuku app not detected", "Aplikasi Shizuku tidak terdeteksi"), Pal.MUTED, 13f, 6))
                  }
                  sc.addView(
                      ui.line(
                          L.s(
                              "Shizuku permission and service integration is not implemented yet, so this route cannot be used for activation. Running state and permission are not verified.",
                              "Integrasi izin dan layanan Shizuku belum diimplementasi, jadi route ini belum bisa dipakai untuk aktivasi. Status berjalan dan izin belum diverifikasi."
                          ), Pal.MUTED, 12f, 4
                      )
                  )
                  col.addView(sc, ui.lp(MATCH, WRAP, 16))

                  // ADB
                  val ac = ui.card()
                  ac.addView(ui.tv("ADB Activator / Wireless Debugging", 16f, Pal.TEXT, true))
                  ac.addView(ui.line("USB debugging: " + (if (i.adbUsb) L.s("on", "aktif") else L.s("off", "mati")), if (i.adbUsb) Pal.GREEN else Pal.MUTED, 13f, 6))
                  ac.addView(ui.line("Wireless debugging: " + (if (i.adbWifi) L.s("on", "aktif") else L.s("off", "mati")), if (i.adbWifi) Pal.GREEN else Pal.MUTED, 13f, 4))
                  ac.addView(
                      ui.line(
                          L.s(
                              "These only show system options. The ADB activation route is not implemented and its capability is not verified.",
                              "Pengaturan ini hanya menunjukkan opsi sistem. Jalur aktivasi lewat ADB belum diimplementasi dan kemampuannya belum diverifikasi."
                          ), Pal.MUTED, 12f, 4
                      )
                  )
                  col.addView(ac, ui.lp(MATCH, WRAP, 16))

                  val note = ui.card()
                  note.addView(ui.tv(L.s("Note", "Catatan"), 13f, Pal.PURPLE_LIGHT, true))
                  note.addView(
                      ui.line(
                          L.s(
                              "Each route has different capabilities and they are not treated as equal. OpenLauncher never switches routes silently. " +
                                  "The active state is saved, but access is re-validated every time the app opens.",
                              "Setiap route punya kemampuan berbeda dan tidak dianggap setara. OpenLauncher tidak berpindah route diam-diam. " +
                                  "Status aktif disimpan, tetapi akses divalidasi ulang setiap app dibuka."
                          ), Pal.MUTED, 12f, 6
                      )
                  )
                  col.addView(note, ui.lp(MATCH, WRAP, 16))

                  sv.addView(col)
                  root.addView(sv, FrameLayout.LayoutParams(MATCH, MATCH))
              }
          }
