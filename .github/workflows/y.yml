          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/Games.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/Games.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo

          object Games {
              /** Game terdeteksi (flag/kategori game atau cover dikenal) ditambah game manual, tanpa yang disembunyikan. */
              fun detect(ctx: Context): List<GameEntry> {
                  val pm = ctx.packageManager
                  val store = Store(ctx)
                  val manual = store.manual()
                  val hidden = store.hidden()
                  val out = ArrayList<GameEntry>()
                  val seen = HashSet<String>()
                  for (ai in pm.getInstalledApplications(0)) {
                      val pkg = ai.packageName
                      if (pkg == ctx.packageName) continue
                      if (pm.getLaunchIntentForPackage(pkg) == null) continue
                      val label = pm.getApplicationLabel(ai).toString()
                      val flagged = ai.category == ApplicationInfo.CATEGORY_GAME || (ai.flags and ApplicationInfo.FLAG_IS_GAME) != 0
                      val isManual = manual.contains(pkg)
                      val auto = flagged || Covers.bundledFor(pkg, label) != null
                      if (!isManual && (!auto || hidden.contains(pkg))) continue
                      if (seen.add(pkg)) out.add(GameEntry(pkg, label, label, isManual))
                  }
                  return out.sortedBy { it.label.lowercase() }
              }
          }

          object Launch {
              /** Meluncurkan game. Untuk Launch Type "mapper", Mapper Service dimulai lebih dulu bila akses root aktif. */
              fun go(ctx: Context, pkg: String, edit: Boolean): Boolean {
                  val store = Store(ctx)
                  if (store.launchType(pkg) == "mapper") {
                      if (AccessMgr.activated(ctx)) {
                          MapperService.start(ctx, pkg, edit)
                      } else {
                          android.widget.Toast.makeText(
                              ctx,
                              L.s("Mapper Services need activation first. Opening the game without the mapper.", "Mapper Services perlu diaktifkan dulu. Game dibuka tanpa mapper."),
                              android.widget.Toast.LENGTH_LONG
                          ).show()
                      }
                  }
                  val i = ctx.packageManager.getLaunchIntentForPackage(pkg)
                  if (i == null) {
                      android.widget.Toast.makeText(ctx, L.s("Cannot open the game (app not installed?)", "Game tidak bisa dibuka (app tidak terpasang?)"), android.widget.Toast.LENGTH_LONG).show()
                      return false
                  }
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  return try {
                      ctx.startActivity(i)
                      store.setLastLaunch(pkg, System.currentTimeMillis())
                      true
                  } catch (e: Exception) {
                      android.widget.Toast.makeText(ctx, L.s("Failed to open the game: ", "Gagal membuka game: ") + e.message, android.widget.Toast.LENGTH_LONG).show()
                      false
                  }
              }
          }
