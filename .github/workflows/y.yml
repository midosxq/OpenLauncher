              fun rebuild() { build() }

              private fun reload() {
                  loading = true
                  Thread {
                      val g = Games.detect(act)
                      act.runOnUiThread {
                          games = g
                          loading = false
                          val s = sel
                          sel = if (s != null) g.firstOrNull { it.pkg == s.pkg } else g.firstOrNull()
