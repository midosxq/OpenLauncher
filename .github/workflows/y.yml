          cat > 'app/src/main/java/com/midosxq/oplx/MapStore.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.content.Context
          import org.json.JSONObject

          /** Konfigurasi mapper per game (package name sebagai kunci) dan hotkey global. */
          object MapStore {
              const val DEF_MAPS = "JOY 0.18 0.70 0.17 17 30 31 32\nCAM 0.72 0.50\nTAP 272 0.88 0.72\nTAP 57 0.93 0.55"
              private val DEF_HK = mapOf("edit" to "67", "tog" to "66", "ref" to "68", "ptr" to "56")
              const val FORMAT = "OpenLauncher keymap"

              private fun sp(c: Context) = c.applicationContext.getSharedPreferences("ol_mapper", Context.MODE_PRIVATE)

              fun maps(c: Context, pkg: String): String = sp(c).getString("maps_" + pkg, DEF_MAPS) ?: DEF_MAPS
              fun setMaps(c: Context, pkg: String, s: String) { sp(c).edit().putString("maps_" + pkg, s).apply() }
              fun hasCustom(c: Context, pkg: String): Boolean = sp(c).contains("maps_" + pkg)

              private fun clamp(v: Float): Float = Math.round(v.coerceIn(0f, 100f) * 10f) / 10f
              fun camX(c: Context, pkg: String): Float = sp(c).getFloat("camx_" + pkg, 20f)
              fun camY(c: Context, pkg: String): Float = sp(c).getFloat("camy_" + pkg, 20f)
              fun setCam(c: Context, pkg: String, x: Float, y: Float) {
                  sp(c).edit().putFloat("camx_" + pkg, clamp(x)).putFloat("camy_" + pkg, clamp(y)).apply()
              }
              fun lock(c: Context, pkg: String): Boolean = sp(c).getBoolean("lock_" + pkg, true)
              fun setLock(c: Context, pkg: String, v: Boolean) { sp(c).edit().putBoolean("lock_" + pkg, v).apply() }
              fun crazyHz(c: Context, pkg: String): Float = sp(c).getFloat("hz_" + pkg, 15f)
              fun setCrazyHz(c: Context, pkg: String, v: Float) { sp(c).edit().putFloat("hz_" + pkg, v.coerceIn(1f, 40f)).apply() }

              fun hk(c: Context, n: String): String = sp(c).getString("hk_" + n, DEF_HK[n] ?: "") ?: ""
              fun setHk(c: Context, n: String, v: String) { sp(c).edit().putString("hk_" + n, v).apply() }

              fun reset(c: Context, pkg: String) {
                  sp(c).edit().remove("maps_" + pkg).remove("camx_" + pkg).remove("camy_" + pkg).remove("lock_" + pkg).remove("hz_" + pkg).apply()
              }

              fun summary(c: Context, pkg: String): String {
                  var joy = 0; var cam = 0; var key = 0; var rapid = 0; var pad = 0
                  for (l in maps(c, pkg).split("\n")) {
                      when (l.trim().split(" ")[0]) {
                          "JOY" -> joy++
                          "CAM" -> cam++
                          "TAP" -> key++
                          "RAPID" -> rapid++
                          "PADJOY", "PADCAM" -> pad++
                      }
                  }
                  return L.s("Joystick: ", "Joystick: ") + joy + " | " + L.s("Camera: ", "Kamera: ") + cam + " | " +
                      L.s("Keys/buttons: ", "Tombol: ") + key + " | Crazy Tap: " + rapid + " | Pad: " + pad
              }

              /** Ekspor ke format .xpp (JSON). */
              fun export(c: Context, pkg: String, game: String): String {
                  val o = JSONObject()
                  o.put("format", FORMAT)
                  o.put("version", 1)
                  o.put("package", pkg)
                  o.put("game", game)
                  o.put("camX", camX(c, pkg).toDouble())
                  o.put("camY", camY(c, pkg).toDouble())
                  o.put("lockCursor", lock(c, pkg))
                  o.put("crazyHz", crazyHz(c, pkg).toDouble())
                  o.put("maps", maps(c, pkg))
                  return o.toString(2)
              }

              class Parsed(val pkg: String, val game: String, val camX: Float, val camY: Float, val lock: Boolean, val hz: Float, val maps: String)

              /** Parse dan validasi; mengembalikan null bila bukan file keymap OpenLauncher yang valid. */
              fun parse(text: String): Parsed? = try {
                  val o = JSONObject(text)
                  if (o.optString("format") != FORMAT || o.optInt("version", 0) != 1) null
                  else {
                      val maps = o.getString("maps")
                      val ok = maps.split("\n").all { l -> l.isBlank() || l.trim().split(" ")[0] in listOf("JOY", "CAM", "TAP", "RAPID", "PADJOY", "PADCAM") }
                      if (!ok) null
                      else Parsed(
                          o.getString("package"), o.optString("game"),
                          o.optDouble("camX", 20.0).toFloat(), o.optDouble("camY", 20.0).toFloat(),
                          o.optBoolean("lockCursor", true), o.optDouble("crazyHz", 15.0).toFloat(), maps
                      )
                  }
              } catch (e: Exception) {
                  null
              }

              /** Simpan cadangan sebelum Replace. */
              fun backup(c: Context, pkg: String) {
                  sp(c).edit().putString("backup_" + pkg, export(c, pkg, pkg)).apply()
              }

              fun apply(c: Context, p: Parsed) {
                  backup(c, p.pkg)
                  setMaps(c, p.pkg, p.maps)
                  setCam(c, p.pkg, p.camX, p.camY)
                  setLock(c, p.pkg, p.lock)
                  setCrazyHz(c, p.pkg, p.hz)
              }
          }
          OLEOF
          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/MapperService.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/MapperService.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Point
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock
          import android.provider.Settings
          import android.view.WindowManager
          import android.widget.Toast
          import java.io.OutputStreamWriter
          import java.util.Locale

          /**
           * Mapper Service: hanya berjalan untuk game dengan Launch Type "Launch with Mapper Services".
           * Membutuhkan root: mesin native membaca keyboard/mouse/gamepad dan menyuntik sentuhan.
           */
          class MapperService : Service() {
              companion object {
                  @Volatile var state = 0 // 0 berhenti, 1 berjalan, 2 error
                  @Volatile var message = ""
                  @Volatile var gamePkg = ""
                  @Volatile var instance: MapperService? = null
                  @Volatile var onChange: (() -> Unit)? = null

                  fun start(c: Context, pkg: String, edit: Boolean) {
                      val i = Intent(c, MapperService::class.java)
                      i.putExtra("pkg", pkg)
                      i.putExtra("edit", edit)
                      c.startForegroundService(i)
                  }

                  fun stop(c: Context) {
                      c.stopService(Intent(c, MapperService::class.java))
                  }
              }

              private val main = Handler(Looper.getMainLooper())
              private val shell = RootShell()
              private var engine: Process? = null
              private var eout: OutputStreamWriter? = null
              private var running = false
              @Volatile private var alive = false
              @Volatile private var fg = ""
              @Volatile private var typing = false
              @Volatile private var enabled = true
              @Volatile private var panelOpen = false
              @Volatile private var lastMode = ""
              @Volatile private var lastView = ""
              @Volatile private var capCb: ((String) -> Unit)? = null
              @Volatile private var pendingEdit = false
              private var seenGame = false
              private var lastGameSeen = 0L
              private var startedAt = 0L
              private var devK = 0
              private var devM = 0
              private var devP = 0
              private var panel: MapperPanel? = null
              private var pointer: PointerOverlay? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  instance = this
              }

              fun runMain(f: () -> Unit) { main.post { f() } }

              private fun toast(s: String) { main.post { Toast.makeText(this, s, Toast.LENGTH_SHORT).show() } }

              private fun setState(s: Int, msg: String) {
                  state = s
                  message = msg
                  onChange?.invoke()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "stop") {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val pkg = intent?.getStringExtra("pkg")
                  if (pkg == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel("mapper", "Mapper Services", NotificationManager.IMPORTANCE_LOW))
                  val stopPi = PendingIntent.getService(this, 1, Intent(this, MapperService::class.java).setAction("stop"), PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  val n = Notification.Builder(this, "mapper")
                      .setContentTitle(L.s("Mapper Services running", "Mapper Services berjalan"))
                      .setContentText(pkg)
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .addAction(Notification.Action.Builder(android.graphics.drawable.Icon.createWithResource(this, android.R.drawable.ic_delete), L.s("Stop", "Hentikan"), stopPi).build())
                      .build()
                  startForeground(1, n)

                  if (intent?.getBooleanExtra("edit", false) == true) pendingEdit = true
                  if (running) {
                      if (gamePkg != pkg) {
                          gamePkg = pkg
                          seenGame = false
                          startedAt = SystemClock.elapsedRealtime()
                          sendConfig()
                      }
                      return START_NOT_STICKY
                  }
                  gamePkg = pkg
                  running = true
                  alive = true
                  seenGame = false
                  startedAt = SystemClock.elapsedRealtime()
                  Thread { boot() }.start()
                  return START_NOT_STICKY
              }

              private fun boot() {
                  setState(0, L.s("Checking root...", "Memeriksa root..."))
                  if (!shell.run("id").contains("uid=0")) {
                      setState(2, L.s("Root access is not available. Activate root first.", "Akses root tidak tersedia. Aktifkan root dulu."))
                      stopLater()
                      return
                  }
                  shell.run("appops set " + packageName + " SYSTEM_ALERT_WINDOW allow")
                  val lib = applicationInfo.nativeLibraryDir + "/libxeng.so"
                  shell.run("cp '" + lib + "' /data/local/tmp/ol_eng && chmod 755 /data/local/tmp/ol_eng")
                  try {
                      val p = ProcessBuilder("su").redirectErrorStream(true).start()
                      engine = p
                      eout = OutputStreamWriter(p.outputStream)
                      send("exec /data/local/tmp/ol_eng")
                  } catch (e: Exception) {
                      setState(2, L.s("Engine failed to start: ", "Engine gagal dimulai: ") + e.message)
                      stopLater()
                      return
                  }
                  Thread {
                      try {
                          val r = engine!!.inputStream.bufferedReader()
                          while (true) {
                              val l = r.readLine() ?: break
                              onEngine(l.trim())
                          }
                      } catch (e: Exception) {
                      }
                      if (alive) {
                          setState(2, L.s("The engine stopped unexpectedly.", "Engine berhenti tiba-tiba."))
                          stopLater()
                      }
                  }.start()
                  Thread.sleep(400)
                  sendConfig()
                  while (alive) {
                      try { poll() } catch (e: Exception) { }
                      try { Thread.sleep(Perf.pollMs(this)) } catch (e: Exception) { }
                  }
              }

              private fun stopLater() { main.postDelayed({ stopSelf() }, 4000) }

              @Synchronized
              private fun send(s: String) {
                  try {
                      eout?.write(s + "\n")
                      eout?.flush()
                  } catch (e: Exception) {
                  }
              }

              private fun f1(v: Float): String = String.format(Locale.US, "%.1f", v)

              fun sendSens() { send("SENS " + f1(MapStore.camX(this, gamePkg)) + " " + f1(MapStore.camY(this, gamePkg))) }

              fun applyLock() {
                  send("LOCK " + (if (MapStore.lock(this, gamePkg)) 1 else 0))
                  main.post { updatePointer() }
              }

              fun refreshCursor() { send("REFRESH") }

              fun sendConfig() {
                  send("CLR")
                  for (l in MapStore.maps(this, gamePkg).split("\n")) if (l.isNotBlank()) send(l.trim())
                  sendSens()
                  send("LOCK " + (if (MapStore.lock(this, gamePkg)) 1 else 0))
                  for (n in listOf("edit", "tog", "ref", "ptr")) send("HK " + n + " " + MapStore.hk(this, n).replace(',', ' '))
                  lastMode = ""
                  lastView = ""
              }

              fun capture(cb: (String) -> Unit) {
                  capCb = cb
                  send("CAP")
              }

              private fun onEngine(l: String) {
                  val p = l.split(" ")
                  if (p.size < 2 || p[0] != "EV") return
                  when (p[1]) {
                      "READY" -> setState(1, "")
                      "DEV" -> if (p.size >= 5) {
                          devK = p[2].toIntOrNull() ?: 0
                          devM = p[3].toIntOrNull() ?: 0
                          devP = p[4].toIntOrNull() ?: 0
                      }
                      "HK" -> if (p.size >= 3) {
                          when (p[2]) {
                              "edit" -> main.post { if (fg == gamePkg) togglePanel() }
                              "tog" -> {
                                  enabled = !enabled
                                  toast(if (enabled) L.s("Mapper ON", "Mapper AKTIF") else L.s("Mapper OFF", "Mapper MATI"))
                              }
                          }
                      }
                      "REFRESHED" -> toast(L.s("Cursor refreshed", "Cursor di-refresh"))
                      "PTRMODE" -> if (p.size >= 3) {
                          MapStore.setLock(this, gamePkg, p[2] == "1")
                          main.post { updatePointer() }
                      }
                      "PTR" -> if (p.size >= 4) {
                          val u = p[2].toFloatOrNull()
                          val v = p[3].toFloatOrNull()
                          if (u != null && v != null) main.post { pointer?.move(u, v) }
                      }
                      "COMBO" -> if (p.size >= 3) {
                          val cb = capCb
                          capCb = null
                          cb?.invoke(p[2])
                      }
                  }
              }

              private fun updatePointer() {
                  val want = lastMode == "G" && !MapStore.lock(this, gamePkg) && Settings.canDrawOverlays(this)
                  if (want) {
                      if (pointer == null) pointer = PointerOverlay(this)
                      pointer?.show()
                  } else {
                      pointer?.hide()
                  }
              }

              private fun poll() {
                  val out = shell.run("dumpsys window | grep -E 'mCurrentFocus|mFocusedApp'; dumpsys input_method | grep -E 'mInputShown|mShowRequested'")
                  val rx = Regex("u\\d+ ([\\w.]+)/")
                  var pkg = ""
                  for (l in out.split("\n")) {
                      if (l.contains("mCurrentFocus")) {
                          val m = rx.find(l)
                          if (m != null) { pkg = m.groupValues[1]; break }
                      }
                  }
                  if (pkg.isEmpty()) {
                      for (l in out.split("\n")) {
                          if (l.contains("mFocusedApp")) {
                              val m = rx.find(l)
                              if (m != null) { pkg = m.groupValues[1]; break }
                          }
                      }
                  }
                  if (pkg.isNotEmpty()) fg = pkg
                  typing = out.contains("mInputShown=true") || out.contains("mShowRequested=true")

                  val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val rot = wm.defaultDisplay.rotation
                  val pt = Point()
                  wm.defaultDisplay.getRealSize(pt)
                  val view = "VIEW " + rot + " " + pt.x + " " + pt.y
                  if (view != lastView) {
                      lastView = view
                      send(view)
                  }

                  val now = SystemClock.elapsedRealtime()
                  val inGame = fg == gamePkg
                  if (inGame) {
                      seenGame = true
                      lastGameSeen = now
                      if (pendingEdit && Settings.canDrawOverlays(this)) {
                          pendingEdit = false
                          main.post { togglePanel() }
                      }
                  }
                  val mode = when {
                      panelOpen || !enabled || !inGame -> "O"
                      typing -> "T"
                      else -> "G"
                  }
                  if (mode != lastMode) {
                      lastMode = mode
                      send("MODE " + mode)
                      main.post { updatePointer() }
                  }

                  if (!seenGame && now - startedAt > 90000L) {
                      main.post { stopSelf() }
                  } else if (seenGame && !inGame) {
                      val limit = if (fg == packageName) 90000L else 20000L
                      if (now - lastGameSeen > limit) main.post { stopSelf() }
                  }
              }

              private fun togglePanel() {
                  val p = panel
                  if (p != null && p.showing) {
                      p.close()
                      return
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      toast(L.s("Overlay permission is missing", "Izin tampil di atas app lain belum ada"))
                      return
                  }
                  var label = gamePkg
                  try { label = packageManager.getApplicationLabel(packageManager.getApplicationInfo(gamePkg, 0)).toString() } catch (e: Exception) {}
                  panelOpen = true
                  send("MODE O")
                  lastMode = "O"
                  pointer?.hide()
                  val np = MapperPanel(this, gamePkg, label) {
                      panelOpen = false
                      lastMode = ""
                  }
                  panel = np
                  np.show()
                  if (!np.showing) {
                      panelOpen = false
                      lastMode = ""
                  }
              }

              override fun onDestroy() {
                  alive = false
                  running = false
                  try { send("QUIT") } catch (e: Exception) {}
                  try { engine?.destroy() } catch (e: Exception) {}
                  try { panel?.close() } catch (e: Exception) {}
                  try { pointer?.hide() } catch (e: Exception) {}
                  shell.close()
                  state = 0
                  message = ""
                  instance = null
                  onChange?.invoke()
                  super.onDestroy()
              }
          }
          OLEOF
          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/MapperUi.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/MapperUi.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.content.Context
          import android.content.res.ColorStateList
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import java.util.Locale

          /** Overlay kursor mouse (mode pointer). Tidak menerima sentuhan. */
          class PointerOverlay(private val ctx: Context) {
              private val wm = ctx.getSystemService(Context.WINDOW_SERVICE) as WindowManager
              private var root: FrameLayout? = null
              private var cursor: ImageView? = null
              private var hotX = 0f
              private var hotY = 0f

              private fun makeBitmap(h: Int): Bitmap {
                  try {
                      val bmp = BitmapFactory.decodeStream(ctx.assets.open("cursor/default.png"))
                      if (bmp != null) {
                          val hs = try {
                              ctx.assets.open("cursor/hotspot.txt").bufferedReader().use { it.readText() }.trim().split(" ")
                          } catch (e: Exception) {
                              listOf("0", "0")
                          }
                          val sc = h.toFloat() / bmp.height
                          hotX = (hs.getOrNull(0)?.toFloatOrNull() ?: 0f) * sc
                          hotY = (hs.getOrNull(1)?.toFloatOrNull() ?: 0f) * sc
                          return Bitmap.createScaledBitmap(bmp, (bmp.width * sc).toInt().coerceAtLeast(1), h, true)
                      }
                  } catch (e: Exception) {
                  }
                  // Cadangan: panah putih berkontur hitam.
                  val b = Bitmap.createBitmap(h * 2 / 3, h, Bitmap.Config.ARGB_8888)
                  val c = Canvas(b)
                  val s = h / 20f
                  val p = Path()
                  p.moveTo(1f * s, 1f * s); p.lineTo(1f * s, 16f * s); p.lineTo(5f * s, 12f * s); p.lineTo(8f * s, 19f * s)
                  p.lineTo(10.5f * s, 18f * s); p.lineTo(7.5f * s, 11f * s); p.lineTo(12.5f * s, 11f * s); p.close()
                  val f = Paint(Paint.ANTI_ALIAS_FLAG)
                  f.color = Color.WHITE
                  c.drawPath(p, f)
                  f.style = Paint.Style.STROKE
                  f.color = Color.BLACK
                  f.strokeWidth = 1.5f * s
                  c.drawPath(p, f)
                  hotX = s; hotY = s
                  return b
              }

              fun show() {
                  if (root != null) return
                  val fl = FrameLayout(ctx)
                  val iv = ImageView(ctx)
                  iv.setImageBitmap(makeBitmap((28 * ctx.resources.displayMetrics.density).toInt()))
                  fl.addView(iv, FrameLayout.LayoutParams(-2, -2))
                  val lp = WindowManager.LayoutParams(
                      -1, -1, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                  try {
                      wm.addView(fl, lp)
                      root = fl
                      cursor = iv
                      fl.post { move(0.5f, 0.5f) }
                  } catch (e: Exception) {
                  }
              }

              fun move(u: Float, v: Float) {
                  val r = root ?: return
                  val c = cursor ?: return
                  c.x = u * r.width - hotX
                  c.y = v * r.height - hotY
              }

              fun hide() {
                  val r = root ?: return
                  try { wm.removeView(r) } catch (e: Exception) {}
                  root = null
                  cursor = null
              }
          }

          /**
           * Panel mapper: jendela persegi gaya Windows di tengah-bawah layar, bisa digeser lewat title bar,
           * tanpa tombol maximize, dengan tombol X bulat kecil. Dibuka lewat shortcut keyboard (bukan floating ball).
           */
          class MapperPanel(private val svc: MapperService, private val pkg: String, private val gameLabel: String, private val onClose: () -> Unit) {
              class M(var t: String, var keys: IntArray, var u: Double, var v: Double, var r: Double)

              private val ui = Ui(svc)
              private val wm = svc.getSystemService(Context.WINDOW_SERVICE) as WindowManager
              private val uiH = Handler(Looper.getMainLooper())
              private val list = ArrayList<M>()
              private var panel: LinearLayout? = null
              private var panelLp: WindowManager.LayoutParams? = null
              private var body: LinearLayout? = null
              private var boardRoot: FrameLayout? = null
              private var board: Board? = null
              private var hint: TextView? = null

              val showing: Boolean get() = panel != null

              private fun load() {
                  list.clear()
                  for (line in MapStore.maps(svc, pkg).split("\n")) {
                      val p = line.trim().split(" ")
                      try {
                          when (p[0]) {
                              "JOY" -> list.add(M("JOY", intArrayOf(p[4].toInt(), p[5].toInt(), p[6].toInt(), p[7].toInt()), p[1].toDouble(), p[2].toDouble(), p[3].toDouble()))
                              "CAM" -> list.add(M("CAM", IntArray(0), p[1].toDouble(), p[2].toDouble(), 0.0))
                              "TAP" -> list.add(M("TAP", intArrayOf(p[1].toInt()), p[2].toDouble(), p[3].toDouble(), 0.0))
                              "RAPID" -> list.add(M("RAPID", intArrayOf(p[1].toInt()), p[2].toDouble(), p[3].toDouble(), p[4].toDouble()))
                              "PADJOY" -> list.add(M("PADJOY", IntArray(0), p[1].toDouble(), p[2].toDouble(), p[3].toDouble()))
                              "PADCAM" -> list.add(M("PADCAM", IntArray(0), p[1].toDouble(), p[2].toDouble(), p[3].toDouble()))
                          }
                      } catch (e: Exception) {
                      }
                  }
              }

              private fun f4(d: Double): String = String.format(Locale.US, "%.4f", d)

              private fun serialize(): String {
                  val sb = StringBuilder()
                  for (m in list) {
                      when (m.t) {
                          "JOY" -> sb.append("JOY ${f4(m.u)} ${f4(m.v)} ${String.format(Locale.US, "%.3f", m.r)} ${m.keys[0]} ${m.keys[1]} ${m.keys[2]} ${m.keys[3]}\n")
                          "CAM" -> sb.append("CAM ${f4(m.u)} ${f4(m.v)}\n")
                          "TAP" -> sb.append("TAP ${m.keys[0]} ${f4(m.u)} ${f4(m.v)}\n")
                          "RAPID" -> sb.append("RAPID ${m.keys[0]} ${f4(m.u)} ${f4(m.v)} ${String.format(Locale.US, "%.1f", m.r)}\n")
                          "PADJOY" -> sb.append("PADJOY ${f4(m.u)} ${f4(m.v)} ${String.format(Locale.US, "%.3f", m.r)}\n")
                          "PADCAM" -> sb.append("PADCAM ${f4(m.u)} ${f4(m.v)} ${String.format(Locale.US, "%.2f", m.r)}\n")
                      }
                  }
                  return sb.toString().trim()
              }

              fun show() {
                  if (panel != null) return
                  load()
                  val p = LinearLayout(svc)
                  p.orientation = LinearLayout.VERTICAL
                  p.background = rounded(Pal.BG, 3f, ui.dens, Pal.BORDER, 1f)

                  val bar = LinearLayout(svc)
                  bar.orientation = LinearLayout.HORIZONTAL
                  bar.gravity = Gravity.CENTER_VERTICAL
                  bar.setPadding(ui.dp(12), ui.dp(6), ui.dp(8), ui.dp(6))
                  val title = ui.tv("Mapper  \u00B7  " + gameLabel, 13f, Color.WHITE, true)
                  title.maxLines = 1
                  bar.addView(title, LinearLayout.LayoutParams(0, WRAP, 1f))
                  val x = ui.tv("X", 11f, Color.WHITE, true)
                  x.gravity = Gravity.CENTER
                  val oval = GradientDrawable()
                  oval.shape = GradientDrawable.OVAL
                  oval.setColor(0)
                  oval.setStroke(maxOf(1, ui.dp(1)), Pal.PURPLE)
                  x.background = oval
                  x.isClickable = true
                  x.setOnClickListener { close() }
                  bar.addView(x, LinearLayout.LayoutParams(ui.dp(24), ui.dp(24)))
                  p.addView(bar)
                  val div = View(svc)
                  div.setBackgroundColor(Pal.SEP)
                  p.addView(div, LinearLayout.LayoutParams(MATCH, maxOf(1, ui.dp(1))))
                  val b = LinearLayout(svc)
                  b.orientation = LinearLayout.VERTICAL
                  b.setPadding(ui.dp(12), ui.dp(10), ui.dp(12), ui.dp(12))
                  p.addView(b)
                  body = b
                  panel = p

                  val dm = svc.resources.displayMetrics
                  val lp = WindowManager.LayoutParams(
                      minOf(ui.dp(440), dm.widthPixels - ui.dp(32)), WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                  lp.y = ui.dp(16)
                  panelLp = lp

                  var dx0 = 0f
                  var dy0 = 0f
                  var x0 = 0
                  var y0 = 0
                  bar.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              dx0 = e.rawX; dy0 = e.rawY; x0 = lp.x; y0 = lp.y
                          }
                          MotionEvent.ACTION_MOVE -> {
                              lp.x = x0 + (e.rawX - dx0).toInt()
                              lp.y = y0 - (e.rawY - dy0).toInt()
                              try { wm.updateViewLayout(p, lp) } catch (ex: Exception) {}
                          }
                      }
                      true
                  }
                  try {
                      wm.addView(p, lp)
                  } catch (e: Exception) {
                      panel = null
                      return
                  }
                  renderMenu()
              }

              private fun clearBody() {
                  body?.removeAllViews()
              }

              private fun slider(label: String, max: Int, progress: Int, onChange: (Int) -> String): LinearLayout {
                  val c = LinearLayout(svc)
                  c.orientation = LinearLayout.VERTICAL
                  val l = ui.tv(label, 12f, Pal.TEXT)
                  c.addView(l)
                  val sb = SeekBar(svc)
                  sb.max = max
                  sb.progress = progress
                  sb.progressTintList = ColorStateList.valueOf(Pal.PURPLE)
                  sb.thumbTintList = ColorStateList.valueOf(Pal.PURPLE_LIGHT)
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, v: Int, fromUser: Boolean) {
                          l.text = onChange(v)
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  c.addView(sb, LinearLayout.LayoutParams(MATCH, WRAP))
                  l.text = onChange(progress)
                  return c
              }

              private fun row(vararg v: View): LinearLayout {
                  val r = LinearLayout(svc)
                  r.orientation = LinearLayout.HORIZONTAL
                  for ((i, x) in v.withIndex()) r.addView(x, ui.lp(WRAP, WRAP, 0, if (i == 0) 0 else 8))
                  return r
              }

              private fun lockLabel(): String = L.s("Lock Cursor: ", "Lock Cursor: ") + (if (MapStore.lock(svc, pkg)) "ON" else "OFF")

              private fun renderMenu() {
                  clearBody()
                  val b = body ?: return
                  b.addView(ui.tv(L.s("Menu", "Menu"), 12f, Pal.MUTED, true))
                  val lockBtn = ui.pill(lockLabel(), false) {}
                  lockBtn.setOnClickListener {
                      MapStore.setLock(svc, pkg, !MapStore.lock(svc, pkg))
                      svc.applyLock()
                      lockBtn.text = lockLabel()
                  }
                  b.addView(row(ui.pill(L.s("Edit Keymap", "Edit Keymap"), true) { renderEdit() }, ui.pill(L.s("Mouse Settings", "Pengaturan Mouse"), false) { renderMouse() }), ui.lp(WRAP, WRAP, 8))
                  b.addView(row(ui.pill(L.s("Cursor Refresh", "Cursor Refresh"), false) { svc.refreshCursor() }, lockBtn), ui.lp(WRAP, WRAP, 8))
                  b.addView(row(ui.pill(L.s("Close", "Tutup"), false) { close() }), ui.lp(WRAP, WRAP, 8))
              }

              private fun renderMouse() {
                  clearBody()
                  val b = body ?: return
                  b.addView(ui.tv(L.s("Mouse Settings", "Pengaturan Mouse"), 12f, Pal.MUTED, true))
                  b.addView(slider("", 1000, (MapStore.camX(svc, pkg) * 10f).toInt()) { v ->
                      MapStore.setCam(svc, pkg, v / 10f, MapStore.camY(svc, pkg)); svc.sendSens()
                      "camX: " + String.format(Locale.US, "%.1f", v / 10f) + " / 100.0"
                  }, ui.lp(MATCH, WRAP, 8))
                  b.addView(slider("", 1000, (MapStore.camY(svc, pkg) * 10f).toInt()) { v ->
                      MapStore.setCam(svc, pkg, MapStore.camX(svc, pkg), v / 10f); svc.sendSens()
                      "camY: " + String.format(Locale.US, "%.1f", v / 10f) + " / 100.0"
                  }, ui.lp(MATCH, WRAP, 6))
                  b.addView(slider("", 39, (MapStore.crazyHz(svc, pkg) - 1f).toInt()) { v ->
                      MapStore.setCrazyHz(svc, pkg, (v + 1).toFloat())
                      L.s("Crazy Tap rate: ", "Kecepatan Crazy Tap: ") + (v + 1) + L.s(" taps/s (for new Crazy Taps)", " tap/dtk (untuk Crazy Tap baru)")
                  }, ui.lp(MATCH, WRAP, 6))
                  b.addView(row(ui.pill(L.s("Back", "Kembali"), false) { renderMenu() }), ui.lp(WRAP, WRAP, 10))
              }

              private fun renderEdit() {
                  clearBody()
                  val b = body ?: return
                  load()
                  val h = ui.tv(L.s("Drag circles to the button positions in the game. Long press a circle to delete.", "Geser lingkaran ke posisi tombol di game. Tahan lama untuk menghapus."), 11f, Pal.MUTED)
                  hint = h
                  b.addView(h)
                  showBoard()
                  val addKey = ui.pill("+Key", false) {
                      setHint(L.s("Press a keyboard key, mouse button, scroll, or pad button...", "Tekan tombol keyboard, tombol mouse, scroll, atau tombol pad..."))
                      svc.capture { combo ->
                          val code = combo.split("+")[0].toIntOrNull()
                          if (code != null) svc.runMain {
                              list.add(M("TAP", intArrayOf(code), 0.5, 0.5, 0.0)); board?.invalidate()
                              setHint(Keys.name(code) + L.s(" added in the center. Drag it into place.", " ditambah di tengah. Geser ke posisinya."))
                          }
                      }
                  }
                  val addRapid = ui.pill("+Crazy Tap", false) {
                      setHint(L.s("Press the key or mouse button for Crazy Tap...", "Tekan tombol atau klik mouse untuk Crazy Tap..."))
                      svc.capture { combo ->
                          val code = combo.split("+")[0].toIntOrNull()
                          if (code != null) svc.runMain {
                              list.add(M("RAPID", intArrayOf(code), 0.5, 0.5, MapStore.crazyHz(svc, pkg).toDouble())); board?.invalidate()
                              setHint("Crazy Tap " + Keys.name(code) + L.s(" added. Hold the key to tap rapidly.", " ditambah. Tahan tombol untuk tap cepat."))
                          }
                      }
                  }
                  val addJoy = ui.pill("+Joystick", false) {
                      if (list.none { it.t == "JOY" }) list.add(M("JOY", intArrayOf(17, 30, 31, 32), 0.18, 0.70, 0.17)); board?.invalidate()
                  }
                  val addCam = ui.pill("+" + L.s("Camera", "Kamera"), false) {
                      if (list.none { it.t == "CAM" }) list.add(M("CAM", IntArray(0), 0.72, 0.50, 0.0)); board?.invalidate()
                  }
                  val addPj = ui.pill("+Pad L", false) {
                      if (list.none { it.t == "PADJOY" }) list.add(M("PADJOY", IntArray(0), 0.18, 0.70, 0.17)); board?.invalidate()
                  }
                  val addPc = ui.pill("+Pad R", false) {
                      if (list.none { it.t == "PADCAM" }) list.add(M("PADCAM", IntArray(0), 0.72, 0.50, 0.5)); board?.invalidate()
                  }
                  val rm = ui.pill("Rad -", false) { adjust(-0.02) }
                  val rp = ui.pill("Rad +", false) { adjust(0.02) }
                  val save = ui.pill(L.s("Save", "Simpan"), true) {
                      MapStore.setMaps(svc, pkg, serialize())
                      svc.sendConfig()
                      hideBoard()
                      renderMenu()
                  }
                  val cancel = ui.pill(L.s("Cancel", "Batal"), false) {
                      hideBoard()
                      renderMenu()
                  }
                  b.addView(row(addKey, addRapid, addJoy, addCam), ui.lp(WRAP, WRAP, 8))
                  b.addView(row(addPj, addPc, rm, rp), ui.lp(WRAP, WRAP, 6))
                  b.addView(row(save, cancel), ui.lp(WRAP, WRAP, 8))
              }

              private fun setHint(s: String) { hint?.text = s }

              private fun adjust(dv: Double) {
                  for (m in list) if (m.t == "JOY" || m.t == "PADJOY") m.r = (m.r + dv).coerceIn(0.05, 0.40)
                  board?.invalidate()
              }

              private fun showBoard() {
                  if (boardRoot != null) return
                  val fl = FrameLayout(svc)
                  fl.setBackgroundColor(0x66000000)
                  val bd = Board()
                  board = bd
                  fl.addView(bd, FrameLayout.LayoutParams(-1, -1))
                  val lp = WindowManager.LayoutParams(
                      -1, -1, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                  try {
                      wm.addView(fl, lp)
                      boardRoot = fl
                      // panel harus tetap di atas board
                      val p = panel
                      val plp = panelLp
                      if (p != null && plp != null) {
                          wm.removeView(p)
                          wm.addView(p, plp)
                      }
                  } catch (e: Exception) {
                      board = null
                  }
              }

              private fun hideBoard() {
                  val r = boardRoot ?: return
                  try { wm.removeView(r) } catch (e: Exception) {}
                  boardRoot = null
                  board = null
              }

              fun close() {
                  hideBoard()
                  val p = panel ?: return
                  try { wm.removeView(p) } catch (e: Exception) {}
                  panel = null
                  body = null
                  onClose()
              }

              inner class Board : View(svc) {
                  private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val stroke = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val txt = Paint(Paint.ANTI_ALIAS_FLAG)
                  private var drag: M? = null
                  private var sx = 0f
                  private var sy = 0f
                  private var moved = false
                  private val del = Runnable {
                      val m = drag
                      if (m != null && !moved) {
                          list.remove(m)
                          drag = null
                          invalidate()
                      }
                  }

                  init {
                      fill.color = 0x338B5CF6
                      stroke.style = Paint.Style.STROKE
                      stroke.strokeWidth = 3 * ui.dens
                      stroke.color = Pal.PURPLE
                      txt.color = Color.WHITE
                      txt.textSize = 12 * ui.dens
                      txt.textAlign = Paint.Align.CENTER
                  }

                  private fun rad(m: M): Float = when (m.t) {
                      "JOY", "PADJOY" -> (m.r * height).toFloat()
                      "CAM", "PADCAM" -> 55 * ui.dens
                      else -> 28 * ui.dens
                  }

                  private fun label(m: M): String = when (m.t) {
                      "JOY" -> "WASD"
                      "CAM" -> "CAM"
                      "PADJOY" -> "L-STICK"
                      "PADCAM" -> "R-STICK"
                      "RAPID" -> Keys.name(m.keys[0]) + " x"
                      else -> Keys.name(m.keys[0])
                  }

                  override fun onDraw(c: Canvas) {
                      for (m in list) {
                          val cx = (m.u * width).toFloat()
                          val cy = (m.v * height).toFloat()
                          c.drawCircle(cx, cy, rad(m), fill)
                          c.drawCircle(cx, cy, rad(m), stroke)
                          c.drawText(label(m), cx, cy + 4 * ui.dens, txt)
                      }
                  }

                  override fun onTouchEvent(e: MotionEvent): Boolean {
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              var best: M? = null
                              var bd = Float.MAX_VALUE
                              for (m in list) {
                                  val dx = (m.u * width).toFloat() - e.x
                                  val dy = (m.v * height).toFloat() - e.y
                                  val dist = Math.sqrt((dx * dx + dy * dy).toDouble()).toFloat()
                                  if (dist < maxOf(rad(m), 40 * ui.dens) && dist < bd) {
                                      bd = dist
                                      best = m
                                  }
                              }
                              drag = best
                              sx = e.x
                              sy = e.y
                              moved = false
                              if (best != null) uiH.postDelayed(del, 800)
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val m = drag
                              if (m != null) {
                                  if (Math.abs(e.x - sx) > 12 * ui.dens || Math.abs(e.y - sy) > 12 * ui.dens) {
                                      moved = true
                                      uiH.removeCallbacks(del)
                                  }
                                  if (moved) {
                                      m.u = (e.x / width).toDouble().coerceIn(0.0, 1.0)
                                      m.v = (e.y / height).toDouble().coerceIn(0.0, 1.0)
                                      invalidate()
                                  }
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              uiH.removeCallbacks(del)
                              drag = null
                          }
                      }
                      return true
                  }
              }
          }
          OLEOF
