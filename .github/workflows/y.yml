          package com.midosxq.oplx

          /** Nama tombol dari kode scancode Linux (evdev) dan kode virtual engine. */
          object Keys {
              private val names = HashMap<Int, String>().apply {
                  val row = "QWERTYUIOP"
                  for (i in row.indices) put(16 + i, row[i].toString())
                  val r2 = "ASDFGHJKL"
                  for (i in r2.indices) put(30 + i, r2[i].toString())
                  val r3 = "ZXCVBNM"
                  for (i in r3.indices) put(44 + i, r3[i].toString())
                  for (i in 1..9) put(1 + i, i.toString())
                  put(11, "0")
                  for (i in 0..9) put(59 + i, "F" + (i + 1))
                  put(87, "F11"); put(88, "F12")
                  put(1, "Esc"); put(15, "Tab"); put(28, "Enter"); put(57, "Space")
                  put(42, "Shift"); put(54, "RShift"); put(29, "Ctrl"); put(97, "RCtrl")
                  put(56, "Alt"); put(100, "RAlt"); put(58, "Caps"); put(14, "Bksp")
                  put(125, "Win"); put(126, "RWin")
                  put(103, "Up"); put(108, "Down"); put(105, "Left"); put(106, "Right")
                  put(41, "`"); put(12, "-"); put(13, "="); put(51, ","); put(52, "."); put(53, "/")
                  put(272, "M-Left"); put(273, "M-Right"); put(274, "M-Mid"); put(275, "M-4"); put(276, "M-5")
                  put(10001, "Wheel Up"); put(10002, "Wheel Down")
                  put(304, "Pad A"); put(305, "Pad B"); put(307, "Pad X"); put(308, "Pad Y")
                  put(310, "LB"); put(311, "RB"); put(314, "Select"); put(315, "Start"); put(316, "Mode")
                  put(317, "L3"); put(318, "R3")
                  put(11001, "D-Left"); put(11002, "D-Right"); put(11003, "D-Up"); put(11004, "D-Down")
                  put(11005, "LT"); put(11006, "RT")
              }

              fun name(code: Int): String = names[code] ?: ("K" + code)

              fun combo(s: String): String {
                  if (s.isBlank()) return "-"
                  return s.split(",", "+").filter { it.isNotBlank() }.joinToString("+") { name(it.trim().toIntOrNull() ?: 0) }
              }
          }
