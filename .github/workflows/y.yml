          /** Halaman Game Configuration: pengaturan mapper per game. Mapper hanya aktif untuk Launch Type "Launch with Mapper Services". */
          class ConfigView(private val act: MainActivity) {
              private val ui = Ui(act)
              private val store = Store(act)
              private val root = FrameLayout(act)
              private var games: List<GameEntry> = emptyList()
              private var sel: GameEntry? = null
              private var loading = false
              private var pendingExport: GameEntry? = null
              private var pendingImport: GameEntry? = null

              fun view(): View {
                  val want = act.selectedGame
                  if (want != null) sel = want
                  if (games.isEmpty() && !loading) reload() else build()
                  return root
              }

              fun rebuild() { build() }

              private fun reload() {
                  loading = true
                  Thread {
                      val g = Games.detect(act)
                      act.runOnUiThread {
                          games = g
                          loading = false
                          val s = sel
                          sel = if (s != null) g.firstOrNull { it.pkg == s.pkg } else g.firstOrNull()
                          build()
                      }
                  }.start()
              }

              private fun typeName(t: String): String =
                  if (t == "mapper") L.s("Launch with Mapper Services", "Luncurkan dengan Mapper Services") else L.s("Launch Only", "Luncurkan Saja")

              private fun slider(max: Int, progress: Int, text: (Int) -> String, onChange: (Int) -> Unit): LinearLayout {
                  val c = LinearLayout(act)
                  c.orientation = LinearLayout.VERTICAL
                  val l = ui.tv("", 13f, Pal.TEXT)
                  c.addView(l)
                  val sb = SeekBar(act)
                  sb.max = max
                  sb.progress = progress
                  sb.progressTintList = ColorStateList.valueOf(Pal.PURPLE)
                  sb.thumbTintList = ColorStateList.valueOf(Pal.PURPLE_LIGHT)
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, v: Int, fromUser: Boolean) {
                          l.text = text(v)
                          if (fromUser) onChange(v)
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  c.addView(sb, LinearLayout.LayoutParams(MATCH, WRAP))
                  l.text = text(progress)
                  return c
              }

              private fun build() {
                  root.removeAllViews()
                  val sv = ScrollView(act)
                  val col = LinearLayout(act)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(ui.dp(32), ui.dp(24), ui.dp(32), ui.dp(24))
                  col.addView(ui.tv(L.s("Game Configuration", "Konfigurasi Game"), 28f, Pal.TEXT, true))

                  if (loading && games.isEmpty()) {
                      col.addView(ui.line(L.s("Loading games...", "Memuat daftar game..."), Pal.MUTED, 14f, 12))
                  } else if (games.isEmpty()) {
