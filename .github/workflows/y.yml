                      }
                  }
                  val addRapid = ui.pill("+Crazy Tap", false) {
                      setHint(L.s("Press the key or mouse button for Crazy Tap...", "Tekan tombol atau klik mouse untuk Crazy Tap..."))
                      svc.capture { combo ->
                          val code = combo.split("+")[0].toIntOrNull()
                          if (code != null) svc.runMain {
                              list.add(M("RAPID", intArrayOf(code), 0.5, 0.5, MapStore.crazyHz(svc, pkg).toDouble())); board?.invalidate()
                              setHint("Crazy Tap " + Keys.name(code) + L.s(" added. Hold the key to tap rapidly.", " ditambah. Tahan tombol untuk tap cepat."))
                          }
                      }
                  }
                  val addJoy = ui.pill("+Joystick", false) {
                      if (list.none { it.t == "JOY" }) list.add(M("JOY", intArrayOf(17, 30, 31, 32), 0.18, 0.70, 0.17)); board?.invalidate()
                  }
                  val addCam = ui.pill("+" + L.s("Camera", "Kamera"), false) {
                      if (list.none { it.t == "CAM" }) list.add(M("CAM", IntArray(0), 0.72, 0.50, 0.0)); board?.invalidate()
                  }
                  val addPj = ui.pill("+Pad L", false) {
                      if (list.none { it.t == "PADJOY" }) list.add(M("PADJOY", IntArray(0), 0.18, 0.70, 0.17)); board?.invalidate()
                  }
                  val addPc = ui.pill("+Pad R", false) {
                      if (list.none { it.t == "PADCAM" }) list.add(M("PADCAM", IntArray(0), 0.72, 0.50, 0.5)); board?.invalidate()
                  }
                  val rm = ui.pill("Size -", false) { adjust(-0.01) }
                  val rp = ui.pill("Size +", false) { adjust(0.01) }
                  val rs = ui.pill(L.s("Reset Sizes", "Reset Ukuran"), false) { resetSizes() }
                  val save = ui.pill(L.s("Save", "Simpan"), true) {
                      MapStore.setMaps(svc, pkg, serialize())
                      svc.sendConfig()
                      hideBoard()
                      renderMenu()
                  }
                  val cancel = ui.pill(L.s("Cancel", "Batal"), false) {
                      hideBoard()
                      renderMenu()
                  }
                  b.addView(row(addKey, addRapid, addJoy, addCam), ui.lp(WRAP, WRAP, 8))
                  b.addView(row(addPj, addPc, rm, rp), ui.lp(WRAP, WRAP, 6))
                  b.addView(row(rs), ui.lp(WRAP, WRAP, 6))
                  val box = LinearLayout(svc)
                  box.orientation = LinearLayout.VERTICAL
                  rapidBox = box
                  box.addView(ui.tv(L.s("Tap a Crazy Tap circle to set its speed and press time. Drag the dot on any circle to resize only that control; tap a circle to select it for Size -/+.", "Ketuk lingkaran Crazy Tap untuk atur kecepatan dan lama tekan. Geser titik di lingkaran mana pun untuk mengubah ukuran kontrol itu saja; ketuk lingkaran untuk memilihnya lalu Size -/+."), 11f, Pal.MUTED))
                  b.addView(box, ui.lp(MATCH, WRAP, 6))
                  b.addView(row(save, cancel), ui.lp(WRAP, WRAP, 8))
              }

              /** Pengaturan satu Crazy Tap: ketukan per detik (interval mengikuti) dan lama jari menekan. */
              private fun showRapid(m: M) {
                  val box = rapidBox ?: return
                  box.removeAllViews()
                  box.addView(ui.tv("Crazy Tap " + Keys.name(m.keys[0]), 12f, Pal.TEXT, true))
                  box.addView(slider("", 39, (m.r.toInt() - 1).coerceIn(0, 39)) { v ->
                      m.r = (v + 1).toDouble()
                      L.s("Rate: ", "Kecepatan: ") + (v + 1) + L.s(" taps/s (interval ", " tap/dtk (interval ") + (1000 / (v + 1)) + " ms)"
                  }, ui.lp(MATCH, WRAP, 4))
                  box.addView(slider("", 195, (m.h.toInt() - 5).coerceIn(0, 195)) { v ->
                      m.h = (v + 5).toDouble()
                      L.s("Press time: ", "Lama tekan: ") + (v + 5) + " ms"
                  }, ui.lp(MATCH, WRAP, 4))
              }

              private fun setHint(s: String) { hint?.text = s }

              /** Size -/+ hanya mengubah kontrol yang dipilih (bukan semua). */
              private fun adjust(dv: Double) {
                  val m = sel
                  if (m == null || !list.contains(m)) { setHint(L.s("Tap a circle first to select it.", "Ketuk sebuah lingkaran dulu untuk memilihnya.")); return }
                  val step = if (m.t == "JOY" || m.t == "PADJOY" || m.t == "CAM") dv * 2 else dv
                  setSizeOf(m, sizeOf(m) + step)
                  board?.invalidate()
              }

              private fun resetSizes() {
                  for (m in list) { m.sz = 0.0; if (m.t == "JOY" || m.t == "PADJOY") m.r = 0.17 }
                  board?.invalidate()
              }

              private fun showBoard() {
                  if (boardRoot != null) return
                  val fl = FrameLayout(svc)
                  fl.setBackgroundColor(0x66000000)
                  val bd = Board()
                  board = bd
                  fl.addView(bd, FrameLayout.LayoutParams(-1, -1))
                  val lp = WindowManager.LayoutParams(
                      -1, -1, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                  try {
                      wm.addView(fl, lp)
                      boardRoot = fl
                      // panel harus tetap di atas board
                      val p = panel
                      val plp = panelLp
                      if (p != null && plp != null) {
                          wm.removeView(p)
                          wm.addView(p, plp)
                      }
                  } catch (e: Exception) {
                      board = null
                  }
              }

              private fun hideBoard() {
                  val r = boardRoot ?: return
                  try { wm.removeView(r) } catch (e: Exception) {}
                  boardRoot = null
                  board = null
              }

              fun close() {
                  hideBoard()
                  val p = panel ?: return
                  try { wm.removeView(p) } catch (e: Exception) {}
                  panel = null
                  body = null
                  onClose()
              }

              inner class Board : View(svc) {
                  private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val stroke = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val txt = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val handle = Paint(Paint.ANTI_ALIAS_FLAG)
                  private var resizing: M? = null
                  private var drag: M? = null
                  private var sx = 0f
                  private var sy = 0f
                  private var moved = false
                  private val del = Runnable {
                      val m = drag
                      if (m != null && !moved) {
                          list.remove(m)
                          drag = null
                          invalidate()
                      }
                  }

                  init {
                      fill.color = 0x338B5CF6
                      stroke.style = Paint.Style.STROKE
                      stroke.strokeWidth = 3 * ui.dens
                      stroke.color = Pal.PURPLE
                      handle.color = Pal.PURPLE_LIGHT
                      txt.color = Color.WHITE
                      txt.textSize = 12 * ui.dens
                      txt.textAlign = Paint.Align.CENTER
                  }

                  private fun rad(m: M): Float = (sizeOf(m) * height).toFloat()

                  /** Peringatan bila dua kontrol kecil saling tumpang tindih (bisa membuat tap ganda). */
                  private fun overlaps(m: M): Boolean {
                      if (m.t == "JOY" || m.t == "PADJOY" || m.t == "CAM" || m.t == "PADCAM") return false
                      for (o in list) {
                          if (o === m || o.t == "JOY" || o.t == "PADJOY" || o.t == "CAM" || o.t == "PADCAM") continue
                          val d = Math.hypot((m.u - o.u) * width, (m.v - o.v) * height)
                          if (d < rad(m) + rad(o)) return true
                      }
                      return false
                  }

                  private fun label(m: M): String = when (m.t) {
                      "JOY" -> "WASD"
                      "CAM" -> "CAM"
                      "PADJOY" -> "L-STICK"
                      "PADCAM" -> "R-STICK"
                      "RAPID" -> Keys.name(m.keys[0]) + " x"
                      else -> Keys.name(m.keys[0])
                  }

                  override fun onDraw(c: Canvas) {
                      for (m in list) {
                          val cx = (m.u * width).toFloat()
                          val cy = (m.v * height).toFloat()
                          val ov = overlaps(m)
                          val old = stroke.color
                          if (ov) stroke.color = Pal.AMBER else if (m === sel) stroke.color = Pal.PURPLE_LIGHT
                          c.drawCircle(cx, cy, rad(m), fill)
                          c.drawCircle(cx, cy, rad(m), stroke)
                          stroke.color = old
                          c.drawText(label(m), cx, cy + 4 * ui.dens, txt)
                          c.drawCircle(cx + rad(m), cy, (if (m === sel) 9 else 7) * ui.dens, handle)
                      }
                  }

                  override fun onTouchEvent(e: MotionEvent): Boolean {
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              // Pegangan resize: pilih yang terdekat agar kontrol kecil yang berdekatan tidak tertukar.
                              var hb: M? = null
                              var hd = 30 * ui.dens.toDouble()
                              for (m in list) {
                                  val hx2 = (m.u * width).toFloat() + rad(m)
                                  val hy2 = (m.v * height).toFloat()
                                  val dd = Math.hypot((hx2 - e.x).toDouble(), (hy2 - e.y).toDouble())
                                  if (dd < hd) { hd = dd; hb = m }
                              }
                              if (hb != null) {
                                  resizing = hb
                                  sel = hb
                                  drag = null
                                  return true
                              }
                              var best: M? = null
                              var bd = Float.MAX_VALUE
                              var br = Float.MAX_VALUE
                              for (m in list) {
                                  val dx = (m.u * width).toFloat() - e.x
                                  val dy = (m.v * height).toFloat() - e.y
                                  val dist = Math.sqrt((dx * dx + dy * dy).toDouble()).toFloat()
                                  val r = rad(m)
                                  if (dist < maxOf(r, 28 * ui.dens)) {
                                      // Lingkaran terkecil yang memuat titik sentuh menang, supaya kontrol kecil di dalam yang besar tetap bisa dipilih.
                                      if (r < br - 0.5f || (Math.abs(r - br) <= 0.5f && dist < bd)) {
                                          br = r
                                          bd = dist
                                          best = m
                                      }
                                  }
                              }
                              drag = best
                              if (best != null) sel = best
                              sx = e.x
                              sy = e.y
                              moved = false
                              if (best != null) uiH.postDelayed(del, 800)
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val rs = resizing
                              if (rs != null) {
                                  val dx = e.x - (rs.u * width).toFloat()
                                  val dy = e.y - (rs.v * height).toFloat()
                                  setSizeOf(rs, Math.hypot(dx.toDouble(), dy.toDouble()) / height)
                                  invalidate()
                                  return true
                              }
                              val m = drag
                              if (m != null) {
                                  if (Math.abs(e.x - sx) > 12 * ui.dens || Math.abs(e.y - sy) > 12 * ui.dens) {
                                      moved = true
                                      uiH.removeCallbacks(del)
                                  }
                                  if (moved) {
                                      m.u = (e.x / width).toDouble().coerceIn(0.0, 1.0)
                                      m.v = (e.y / height).toDouble().coerceIn(0.0, 1.0)
                                      invalidate()
                                  }
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              uiH.removeCallbacks(del)
                              val d = drag
                              if (resizing == null && d != null && !moved && d.t == "RAPID" && list.contains(d)) showRapid(d)
                              resizing = null
                              drag = null
                          }
                      }
                      return true
                  }
              }
          }
          OLEOF
