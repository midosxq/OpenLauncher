                      print("PERINGATAN: format %s tidak dikenal (header %s)" % (cursors[0], head.hex()))
              have = set(os.path.basename(c) for c in covers)
              for c in EXPECTED_COVERS:
                  print("  cover %-30s %s" % (c, "ADA" if c in have else "TIDAK ADA"))
              for c in sorted(have - set(EXPECTED_COVERS)):
                  print("  cover tidak terduga: " + c)

              # Cover bawaan: hanya nama yang diharapkan, byte asli disalin apa adanya (tanpa re-encode).
              cov_out = os.path.join(assets_dir, "covers")
              os.makedirs(cov_out, exist_ok=True)
              copied = 0
              for c in EXPECTED_COVERS:
                  entry = "gamecover/" + c
                  if entry not in names:
                      continue
                  raw = z.read(entry)
                  if raw[:8] != b"\x89PNG\r\n\x1a\n":
                      print("PERINGATAN: %s bukan PNG valid, dilewati" % entry)
                      continue
                  try:
                      cim = Image.open(io.BytesIO(raw))
                      cim.verify()
                  except Exception as e:
                      print("PERINGATAN: %s rusak (%s), dilewati" % (entry, e))
                      continue
                  if cim.width * cim.height > MAX_PIXELS:
                      print("PERINGATAN: %s terlalu besar, dilewati" % entry)
                      continue
                  with open(os.path.join(cov_out, c), "wb") as fh:
                      fh.write(raw)
                  copied += 1
                  print("  cover %-30s %dx%d disalin" % (c, cim.width, cim.height))
              print("Cover bawaan disalin: %d dari %d" % (copied, len(EXPECTED_COVERS)))

              bz = None
              bnames = {}
              if branding:
                  bz, bnames = handle_branding(branding, res, assets_dir)
              if bz is not None and "app_icon_android_bot.png" in bnames:
                  data = bz.read(bnames["app_icon_android_bot.png"])
                  print("Ikon aplikasi: app_icon_android_bot.png (branding.zip)")
                  icon_from_brand = True
              else:
                  data = z.read(logos[0])
                  icon_from_brand = False
              try:
                  im = Image.open(io.BytesIO(data))
                  im.load()
              except Exception as e:
                  fail("logo tidak bisa dibaca sebagai gambar: %s" % e)
              if im.format not in ("JPEG", "PNG"):
                  fail("format logo tidak didukung: %s" % im.format)
              if im.width * im.height > MAX_PIXELS:
                  fail("resolusi logo terlalu besar")
              print("Logo: %s %dx%d mode=%s" % (im.format, im.width, im.height, im.mode))

              logo = im.convert("RGBA") if icon_from_brand else cutout(im)
              if icon_from_brand:
                  side = max(logo.size)
                  sq = Image.new("RGBA", (side, side), (0, 0, 0, 255))
                  sq.paste(logo, ((side - logo.width) // 2, (side - logo.height) // 2))
                  logo = sq
              out = os.path.join(res, "drawable-nodpi")
              os.makedirs(out, exist_ok=True)
              fg = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
              inner = logo.resize((280, 280), Image.LANCZOS)
              fg.paste(inner, ((432 - 280) // 2, (432 - 280) // 2), inner)
              fg.save(os.path.join(out, "ic_fg.png"))
              print("OK: ic_fg.png (ikon aplikasi) dibuat dari applogo/ (aset asli tidak diubah).")
              convert_cursor(z, names_cursor=cursors, assets_dir=assets_dir)


          main()
          OLEOF

      - name: Prepare assets (source.zip, branding.zip)
        run: |
          set -e
          python3 -c "import PIL" 2>/dev/null || sudo apt-get install -y -qq --no-install-recommends python3-pil || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-pil; }
          BRAND=""
          if [ -f assets/branding.zip ]; then
            BRAND="assets/branding.zip"
          else
            echo "::warning::assets/branding.zip tidak ditemukan: tanpa ikon branding, intro, Welcome wordmark, dan info developer."
          fi
          python3 proj/tools/prep_assets.py assets/source.zip proj/app/src/main/res proj/app/src/main/assets $BRAND

      - name: Compile mapper engine (NDK)
        working-directory: proj
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          "$BIN/aarch64-linux-android30-clang" -O2 -s -fPIE -pie -o app/src/main/jniLibs/arm64-v8a/libxeng.so native/xeng.c -lm
          "$BIN/armv7a-linux-androideabi30-clang" -O2 -s -fPIE -pie -o app/src/main/jniLibs/armeabi-v7a/libxeng.so native/xeng.c -lm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: proj
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain --warning-mode=none 2>&1 | tee ../build.log

      - name: Show compile errors
        if: failure()
        run: |
          echo "===== ERROR KOMPILASI (baris 'e:') ====="
          grep -E '^e: ' build.log | head -40 || true
          grep -E '^e: ' build.log | head -20 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          { echo '### Build errors'; echo '```'; grep -E '^e: ' build.log | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify APK
        run: |
          APK=proj/app/build/outputs/apk/debug/app-debug.apk
          if [ ! -s "$APK" ]; then
            echo "::error::APK tidak ditemukan di $APK"
            exit 1
          fi
          ls -la "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenLauncher-APK-debug
          path: proj/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
