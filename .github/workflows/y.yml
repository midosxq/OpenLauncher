          /** Nama tombol dari kode scancode Linux (evdev) dan kode virtual engine. */
          object Keys {
              private val names = HashMap<Int, String>().apply {
                  val row = "QWERTYUIOP"
                  for (i in row.indices) put(16 + i, row[i].toString())
                  val r2 = "ASDFGHJKL"
