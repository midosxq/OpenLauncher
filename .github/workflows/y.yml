          /** Pengaturan FPS Monitor (Settings -> Overlay -> Selected UI for Monitoring). Semua disimpan permanen. */
          object MonSettings {
              val ALL = listOf("FPS", "RAM", "CPU load", "CPU clock", "GPU load", "GPU clock", "CPU temp", "GPU temp", "Swap")
              private fun sp(c: Context) = c.applicationContext.getSharedPreferences("ol_mon", Context.MODE_PRIVATE)

              fun enabled(c: Context) = sp(c).getBoolean("enabled", false)
              fun setEnabled(c: Context, v: Boolean) { sp(c).edit().putBoolean("enabled", v).apply() }
