          class SetupView(private val act: MainActivity, private val onFinish: () -> Unit) : FrameLayout(act) {
              private val ui = Ui(act)
              private var step = 0

              init {
                  setBackgroundColor(Pal.BG)
                  build()
              }

              fun refresh() { build() }

              private fun overlayOk(): Boolean = Settings.canDrawOverlays(act)

              private fun build() {
                  removeAllViews()
                  val sv = ScrollView(act)
                  sv.isFillViewport = true
                  val col = LinearLayout(act)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(ui.dp(48), ui.dp(32), ui.dp(48), ui.dp(32))
                  col.gravity = Gravity.CENTER_HORIZONTAL
                  col.addView(ui.tv(L.s("Setup", "Pengaturan Awal") + "  " + (step + 1) + " / 3", 12f, Pal.PURPLE_LIGHT, true))
                  val box = ui.card()
                  when (step) {
                      0 -> {
                          box.addView(ui.tv(L.s("Permissions", "Izin"), 22f, Pal.TEXT, true))
                          box.addView(
                              ui.line(
                                  L.s(
                                      "OpenLauncher needs to draw over other apps for the mapper panel and the mouse cursor. Games open fine without it, but the mapper panel will not show.",
                                      "OpenLauncher perlu tampil di atas app lain untuk panel mapper dan cursor mouse. Game tetap bisa dibuka tanpa izin ini, tetapi panel mapper tidak akan muncul."
                                  ), Pal.MUTED, 13f, 8
                              )
                          )
                          val ok = overlayOk()
                          box.addView(ui.line(L.s("Display over other apps: ", "Tampil di atas app lain: ") + (if (ok) L.s("granted", "diberikan") else L.s("not granted", "belum diberikan")), if (ok) Pal.GREEN else Pal.AMBER, 14f, 12))
                          if (!ok) {
                              box.addView(ui.pill(L.s("Open settings", "Buka pengaturan"), true) {
                                  try {
                                      act.startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + act.packageName)))
                                  } catch (e: Exception) {
                                  }
                              }, ui.lp(WRAP, WRAP, 10))
                              box.addView(ui.line(L.s("Rooted devices can skip this: it is granted automatically when the mapper starts.", "Perangkat root bisa melewati ini: izin diberikan otomatis saat mapper dimulai."), Pal.MUTED, 12f, 6))
                          }
                          if (Build.VERSION.SDK_INT >= 33) {
                              val n = act.checkSelfPermission("android.permission.POST_NOTIFICATIONS") == android.content.pm.PackageManager.PERMISSION_GRANTED
                              box.addView(ui.line(L.s("Notifications: ", "Notifikasi: ") + (if (n) L.s("granted", "diberikan") else L.s("not granted", "belum diberikan")), if (n) Pal.GREEN else Pal.AMBER, 14f, 14))
                              if (!n) box.addView(ui.pill(L.s("Allow notifications", "Izinkan notifikasi"), false) {
                                  act.requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 5)
                              }, ui.lp(WRAP, WRAP, 8))
                          }
                      }
                      1 -> {
                          val i = AccessMgr.info
                          box.addView(ui.tv(L.s("Activation", "Aktivasi"), 22f, Pal.TEXT, true))
                          box.addView(
                              ui.line(
                                  L.s(
                                      "The mapper reads keyboard, mouse, and gamepad input and sends touches to the game. In this version that needs root. You can skip this and activate later from the Activation page; Launch Only works without it.",
                                      "Mapper membaca input keyboard, mouse, dan gamepad lalu mengirim sentuhan ke game. Di versi ini itu membutuhkan root. Boleh dilewati dan diaktifkan nanti lewat halaman Aktivasi; Luncurkan Saja tetap jalan tanpa ini."
                                  ), Pal.MUTED, 13f, 8
                              )
                          )
                          val active = AccessMgr.activated(act) && i.rootGranted
                          val txt = when {
                              active -> L.s("Active: ", "Aktif: ") + AccessMgr.methodLabel(i.manager)
                              AccessMgr.busy -> L.s("Checking access... allow the root request if it appears.", "Memeriksa akses... izinkan permintaan root jika muncul.")
                              i.rootState == AccessInfo.ROOT_MISSING || i.rootState == AccessInfo.ROOT_DENIED -> AccessMgr.detailText(i.rootDetail)
                              else -> L.s("Not activated yet", "Belum diaktifkan")
                          }
                          box.addView(ui.line(txt, if (active) Pal.GREEN else Pal.AMBER, 14f, 12))
                          if (!active) box.addView(ui.pill(L.s("Activate via Root", "Aktifkan via Root"), true) { AccessMgr.activateRoot(act) }, ui.lp(WRAP, WRAP, 10))
                      }
                      else -> {
                          box.addView(ui.tv(L.s("All set", "Semua siap"), 22f, Pal.TEXT, true))
                          box.addView(
                              ui.line(
                                  L.s("Setup is complete. Your Game Library is next. You can change everything later in Settings.", "Pengaturan awal selesai. Selanjutnya Pustaka Game kamu. Semuanya bisa diubah nanti di Pengaturan."),
                                  Pal.MUTED, 14f, 8
                              )
                          )
                      }
                  }
                  col.addView(box, ui.lp(MATCH, WRAP, 14))
                  val nav = LinearLayout(act)
                  nav.orientation = LinearLayout.HORIZONTAL
                  if (step > 0) nav.addView(ui.pill(L.s("Back", "Kembali"), false) { step--; build() }, ui.lp(WRAP, WRAP))
                  val label = when (step) {
                      1 -> if (AccessMgr.activated(act)) L.s("Next", "Lanjut") else L.s("Skip for now", "Lewati dulu")
                      2 -> L.s("Finish", "Selesai")
                      else -> L.s("Next", "Lanjut")
                  }
                  nav.addView(ui.pill(label, true) {
                      if (step >= 2) {
                          Flow.setSetupDone(act)
                          onFinish()
                      } else {
                          step++
                          build()
                      }
                  }, ui.lp(WRAP, WRAP, 0, if (step > 0) 10 else 0))
                  col.addView(nav, ui.lp(WRAP, WRAP, 16))
                  sv.addView(col)
                  addView(sv, FrameLayout.LayoutParams(MATCH, MATCH))
              }
          }

          /** Intro 5 detik (app-startup.mp4 dari branding.zip). Jika tidak ada atau gagal diputar, langsung lanjut. */
          class IntroView(private val act: MainActivity, private val onDone: () -> Unit) : FrameLayout(act) {
              private var finished = false
              private val h = Handler(Looper.getMainLooper())
              private val guard = Runnable { done() }

              private fun done() {
                  if (finished) return
                  finished = true
                  h.removeCallbacks(guard)
                  onDone()
              }

              init {
                  setBackgroundColor(Pal.BG)
                  val resId = act.resources.getIdentifier("app_startup", "raw", act.packageName)
                  if (resId == 0) {
                      post { done() }
                  } else {
                      val vv = VideoView(act)
                      vv.setVideoURI(Uri.parse("android.resource://" + act.packageName + "/" + resId))
                      vv.setOnPreparedListener { it.isLooping = false; vv.start() }
                      vv.setOnCompletionListener { done() }
                      vv.setOnErrorListener { _, _, _ -> done(); true }
                      val lp = FrameLayout.LayoutParams(MATCH, MATCH)
                      lp.gravity = Gravity.CENTER
                      addView(vv, lp)
                      h.postDelayed(guard, 6500)
                  }
              }

              override fun onDetachedFromWindow() {
                  h.removeCallbacks(guard)
                  super.onDetachedFromWindow()
              }
          }

