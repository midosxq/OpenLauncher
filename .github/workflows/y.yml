          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /** Activity transparan hanya untuk meminta izin MediaProjection (dialog sistem). */
          class CaptureActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  try {
                      val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      startActivityForResult(mpm.createScreenCaptureIntent(), 77)
                  } catch (e: Exception) {
                      HlNotify.show(this, HlNotify.REC_FAILED, e.javaClass.simpleName, true)
                      finish()
                  }
              }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == 77) {
                      if (res == RESULT_OK && data != null) {
                          val i = Intent(this, HighlightsService::class.java).setAction("start")
                          i.putExtra("code", res)
                          i.putExtra("data", data)
                          startForegroundService(i)
                      } else {
                          HlNotify.show(this, L.s("Capture permission denied", "Izin tangkap layar ditolak"), "", true)
                      }
                  }
                  finish()
              }
          }

          /**
           * Highlights: screenshot dan rekam layar lewat MediaProjection. Berdiri sendiri (tidak butuh Mapper Services).
           * Satu VirtualDisplay dipertahankan; surface-nya dialihkan antara ImageReader (screenshot) dan MediaRecorder (rekam),
           * karena token MediaProjection di Android 14 hanya sekali pakai. Hasil disimpan lewat MediaStore, tidak pernah dihapus otomatis.
           */
          class HighlightsService : Service() {
              private val h = Handler(Looper.getMainLooper())
              private var proj: MediaProjection? = null
              private var vd: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private var rec: MediaRecorder? = null
              private var recUri: Uri? = null
              private var recPfd: android.os.ParcelFileDescriptor? = null
              private var w = 0
              private var hh = 0
              private var dpi = 0

              override fun onBind(i: Intent?): IBinder? = null

              private fun fgNotif(): Notification {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel("highlights", "Highlights", NotificationManager.IMPORTANCE_LOW))
                  fun act(code: Int, a: String) = PendingIntent.getService(this, code, Intent(this, HighlightsService::class.java).setAction(a), PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  fun ic(r: Int) = android.graphics.drawable.Icon.createWithResource(this, r)
                  val b = Notification.Builder(this, "highlights")
                      .setContentTitle("Highlights")
                      .setContentText(if (recording) L.s("Recording...", "Merekam...") else L.s("Ready", "Siap"))
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .addAction(Notification.Action.Builder(ic(android.R.drawable.ic_menu_camera), L.s("Screenshot", "Screenshot"), act(10, "shot")).build())
                  if (recording) b.addAction(Notification.Action.Builder(ic(android.R.drawable.ic_media_pause), L.s("Stop REC", "Stop REC"), act(11, "recstop")).build())
                  else b.addAction(Notification.Action.Builder(ic(android.R.drawable.ic_media_play), L.s("Start REC", "Mulai REC"), act(12, "recstart")).build())
                  b.addAction(Notification.Action.Builder(ic(android.R.drawable.ic_delete), L.s("End", "Akhiri"), act(13, "end")).build())
                  return b.build()
              }

              private fun fg() {
                  val n = fgNotif()
                  if (android.os.Build.VERSION.SDK_INT >= 29) startForeground(4, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  else startForeground(4, n)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      "start" -> {
                          fg()
                          @Suppress("DEPRECATION")
                          val data: Intent? = intent.getParcelableExtra("data")
                          if (data == null || !begin(intent.getIntExtra("code", 0), data)) endSession()
                      }
                      "shot" -> { fg(); screenshot() }
                      "recstart" -> { fg(); startRec() }
                      "recstop" -> { fg(); stopRec(true) }
                      "end", "stop" -> endSession()
                  }
                  return START_NOT_STICKY
              }

              private fun begin(code: Int, data: Intent): Boolean {
                  return try {
                      val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      val p = mpm.getMediaProjection(code, data)
                      // Callback wajib didaftarkan sebelum VirtualDisplay dibuat (Android 14).
                      p.registerCallback(object : MediaProjection.Callback() {
                          override fun onStop() {
                              h.post {
                                  if (recording) HlNotify.show(this@HighlightsService, HlNotify.REC_STOPPED, L.s("Capture session ended", "Sesi tangkap layar berakhir"))
                                  stopRec(false)
                                  endSession()
                              }
                          }
                      }, h)
                      proj = p
                      val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                      val b = wm.currentWindowMetrics.bounds
                      w = b.width() and 1.inv()
                      hh = b.height() and 1.inv()
                      dpi = resources.displayMetrics.densityDpi
                      val r = ImageReader.newInstance(w, hh, PixelFormat.RGBA_8888, 2)
                      reader = r
                      vd = p.createVirtualDisplay("OpenLauncherCapture", w, hh, dpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, r.surface, null, h)
                      active = true
                      updateNotif()
                      HlNotify.show(this, L.s("Capture ready", "Tangkap layar siap"), "")
                      true
                  } catch (e: Exception) {
                      HlNotify.show(this, HlNotify.REC_FAILED, e.javaClass.simpleName, true)
                      false
                  }
              }

              private fun updateNotif() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.notify(4, fgNotif())
              }

              private fun stamp(): String = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())

              private fun screenshot() {
                  val r = reader
                  if (!active || r == null || recording) {
                      HlNotify.show(this, HlNotify.SHOT_FAILED, if (recording) L.s("Not available while recording", "Tidak tersedia saat merekam") else L.s("No capture session", "Tidak ada sesi"), true)
                      return
                  }
                  // Beri waktu satu frame baru supaya ImageReader punya gambar terbaru.
                  h.postDelayed({
                      var img: android.media.Image? = null
                      try {
                          img = r.acquireLatestImage()
                          if (img == null) throw IllegalStateException(L.s("No frame yet", "Belum ada frame"))
                          val pl = img.planes[0]
                          val rowPad = pl.rowStride - pl.pixelStride * w
                          val bmp = Bitmap.createBitmap(w + rowPad / pl.pixelStride, hh, Bitmap.Config.ARGB_8888)
                          bmp.copyPixelsFromBuffer(pl.buffer)
                          val out = Bitmap.createBitmap(bmp, 0, 0, w, hh)
                          val cv = ContentValues()
                          cv.put(MediaStore.MediaColumns.DISPLAY_NAME, "OpenShot_" + stamp() + ".png")
                          cv.put(MediaStore.MediaColumns.MIME_TYPE, "image/png")
                          cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Pictures/OpenPictures")
                          cv.put(MediaStore.MediaColumns.IS_PENDING, 1)
                          val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv) ?: throw IllegalStateException("MediaStore insert failed")
                          try {
                              contentResolver.openOutputStream(uri)?.use { out.compress(Bitmap.CompressFormat.PNG, 100, it) } ?: throw IllegalStateException("open failed")
                              val done = ContentValues()
                              done.put(MediaStore.MediaColumns.IS_PENDING, 0)
                              contentResolver.update(uri, done, null, null)
                          } catch (e: Exception) {
                              try { contentResolver.delete(uri, null, null) } catch (x: Exception) {}
                              throw e
                          }
                          HlNotify.show(this, HlNotify.SHOT_SAVED, "Pictures/OpenPictures")
                      } catch (e: Exception) {
                          val full = e is java.io.IOException && (e.message ?: "").contains("ENOSPC")
                          HlNotify.show(this, HlNotify.SHOT_FAILED, if (full) L.s("Storage full", "Penyimpanan penuh") else (e.message ?: e.javaClass.simpleName), true)
                      } finally {
                          try { img?.close() } catch (e: Exception) {}
                      }
                  }, 150)
              }

              private fun startRec() {
                  val p = proj
                  val v = vd
                  if (!active || p == null || v == null || recording) {
                      HlNotify.show(this, HlNotify.REC_FAILED, if (recording) L.s("Already recording", "Sudah merekam") else L.s("No capture session", "Tidak ada sesi"), true)
                      return
                  }
                  try {
                      val cv = ContentValues()
                      cv.put(MediaStore.MediaColumns.DISPLAY_NAME, "OpenRec_" + stamp() + ".mp4")
                      cv.put(MediaStore.MediaColumns.MIME_TYPE, "video/mp4")
                      cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Movies/OpenRec")
                      cv.put(MediaStore.MediaColumns.IS_PENDING, 1)
                      val uri = contentResolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, cv) ?: throw IllegalStateException("MediaStore insert failed")
                      val pfd = contentResolver.openFileDescriptor(uri, "w") ?: throw IllegalStateException("open failed")
                      val mr = MediaRecorder(this)
                      try {
                          // Catatan: tanpa audio (belum ada izin mikrofon/audio internal di Fase 6).
                          mr.setVideoSource(MediaRecorder.VideoSource.SURFACE)
                          mr.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                          mr.setVideoEncoder(MediaRecorder.VideoEncoder.H264)
                          mr.setVideoSize(w, hh)
                          mr.setVideoFrameRate(30)
                          mr.setVideoEncodingBitRate(12_000_000)
                          mr.setOutputFile(pfd.fileDescriptor)
                          mr.prepare()
                          v.surface = mr.surface
                          mr.start()
                      } catch (e: Exception) {
                          try { mr.release() } catch (x: Exception) {}
                          try { pfd.close() } catch (x: Exception) {}
                          try { contentResolver.delete(uri, null, null) } catch (x: Exception) {}
                          try { v.surface = reader?.surface } catch (x: Exception) {}
                          throw e
                      }
                      rec = mr
                      recUri = uri
                      recPfd = pfd
                      recording = true
                      updateNotif()
                      HlNotify.show(this, HlNotify.REC_STARTED, "")
                  } catch (e: Exception) {
                      HlNotify.show(this, HlNotify.REC_FAILED, e.message ?: e.javaClass.simpleName, true)
                  }
              }

              private fun stopRec(notify: Boolean) {
                  val mr = rec ?: return
                  val uri = recUri
                  var ok = true
                  try { mr.stop() } catch (e: Exception) { ok = false }
                  try { mr.release() } catch (e: Exception) {}
                  try { vd?.surface = reader?.surface } catch (e: Exception) {}
                  try { recPfd?.close() } catch (e: Exception) {}
                  rec = null
                  recPfd = null
                  recUri = null
                  recording = false
                  if (uri != null) {
                      if (ok) {
                          try {
                              val done = ContentValues()
                              done.put(MediaStore.MediaColumns.IS_PENDING, 0)
                              contentResolver.update(uri, done, null, null)
                          } catch (e: Exception) { ok = false }
                      } else {
                          // Rekaman terlalu pendek/rusak: hapus berkas setengah jadi milik kita sendiri.
                          try { contentResolver.delete(uri, null, null) } catch (e: Exception) {}
                      }
                  }
                  if (notify) {
                      HlNotify.show(this, HlNotify.REC_STOPPED, "")
                      if (ok) HlNotify.show(this, HlNotify.REC_SAVED, "Movies/OpenRec")
                      else HlNotify.show(this, HlNotify.REC_FAILED, L.s("Recording too short or invalid", "Rekaman terlalu pendek atau tidak valid"), true)
                  }
                  try { updateNotif() } catch (e: Exception) {}
              }

              private fun endSession() {
                  stopRec(true)
                  try { vd?.release() } catch (e: Exception) {}
                  try { reader?.close() } catch (e: Exception) {}
                  try { proj?.stop() } catch (e: Exception) {}
                  vd = null; reader = null; proj = null
                  active = false
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              override fun onDestroy() {
                  active = false
                  recording = false
                  super.onDestroy()
              }

              companion object {
                  @Volatile var active = false
                  @Volatile var recording = false

                  fun cmd(c: Context, a: String) {
                      c.startForegroundService(Intent(c, HighlightsService::class.java).setAction(a))
                  }
              }
          }

          /** Halaman Highlights: kontrol sesi, screenshot/rekam, sisi notifikasi, dan daftar hasil terbaru. */
          class HighlightsView(private val act: MainActivity) {
              private val ui = Ui(act)

              private class Item(val uri: Uri, val name: String)

              private fun recent(): List<Item> {
                  val out = ArrayList<Item>()
                  val srcs = listOf(
                      Triple(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, "Pictures/OpenPictures/", MediaStore.Images.Media._ID),
                      Triple(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, "Movies/OpenRec/", MediaStore.Video.Media._ID)
                  )
                  for ((base, path, idCol) in srcs) {
                      try {
                          act.contentResolver.query(
                              base, arrayOf(idCol, MediaStore.MediaColumns.DISPLAY_NAME),
                              MediaStore.MediaColumns.RELATIVE_PATH + "=?", arrayOf(path),
                              MediaStore.MediaColumns.DATE_ADDED + " DESC"
                          )?.use { c ->
                              var n = 0
                              while (c.moveToNext() && n < 10) {
                                  out.add(Item(android.content.ContentUris.withAppendedId(base, c.getLong(0)), c.getString(1) ?: ""))
                                  n++
                              }
                          }
                      } catch (e: Exception) {
                      }
                  }
                  return out
              }

              fun view(): android.view.View {
                  val sv = ScrollView(act)
                  sv.isFillViewport = true
                  val col = LinearLayout(act)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(ui.dp(36), ui.dp(28), ui.dp(36), ui.dp(28))
                  col.addView(ui.tv("Highlights", 28f, Pal.TEXT, true))

                  val s = ui.card()
                  s.addView(ui.tv(L.s("Capture session", "Sesi tangkap layar"), 15f, Pal.PURPLE_LIGHT, true))
                  val st = if (HighlightsService.active) (if (HighlightsService.recording) L.s("Recording", "Merekam") else L.s("Ready", "Siap")) else L.s("Not started", "Belum dimulai")
                  s.addView(ui.line(L.s("Status: ", "Status: ") + st, Pal.TEXT, 13f, 8))
                  s.addView(ui.line(L.s("Android asks for permission each time a session starts. Screenshots and recordings never need Mapper Services. Recording has no audio yet.", "Android meminta izin setiap sesi dimulai. Screenshot dan rekaman tidak butuh Mapper Services. Rekaman belum berisi audio."), Pal.MUTED, 11f, 6))
                  val r1 = LinearLayout(act)
                  r1.orientation = LinearLayout.HORIZONTAL
                  if (!HighlightsService.active) {
                      r1.addView(ui.pill(L.s("Start session", "Mulai sesi"), true) { act.startActivity(Intent(act, CaptureActivity::class.java)); act.show("highlights") })
                  } else {
                      r1.addView(ui.pill("Screenshot", true) { HighlightsService.cmd(act, "shot") }, ui.lp(WRAP, WRAP))
                      if (HighlightsService.recording) r1.addView(ui.pill("Stop REC", false) { HighlightsService.cmd(act, "recstop"); act.show("highlights") }, ui.lp(WRAP, WRAP, 0, 8))
                      else r1.addView(ui.pill("Start REC", false) { HighlightsService.cmd(act, "recstart"); act.show("highlights") }, ui.lp(WRAP, WRAP, 0, 8))
                      r1.addView(ui.pill(L.s("End session", "Akhiri sesi"), false) { HighlightsService.cmd(act, "end"); act.show("highlights") }, ui.lp(WRAP, WRAP, 0, 8))
                  }
                  s.addView(r1, ui.lp(WRAP, WRAP, 12))
                  s.addView(ui.line(L.s("Saved to Pictures/OpenPictures and Movies/OpenRec. Files are never deleted automatically.", "Disimpan di Pictures/OpenPictures dan Movies/OpenRec. Berkas tidak pernah dihapus otomatis."), Pal.MUTED, 11f, 10))
                  col.addView(s, ui.lp(MATCH, WRAP, 16))

                  val n = ui.card()
                  n.addView(ui.tv(L.s("Notifications", "Notifikasi"), 15f, Pal.PURPLE_LIGHT, true))
                  n.addView(ui.line(L.s("Slide-in side", "Sisi munculnya notifikasi"), Pal.MUTED, 12f, 6))
                  val r2 = LinearLayout(act)
                  r2.orientation = LinearLayout.HORIZONTAL
                  r2.addView(ui.pill(L.s("Left", "Kiri"), HlSettings.side(act) == "left") { HlSettings.setSide(act, "left"); act.show("highlights") }, ui.lp(WRAP, WRAP))
                  r2.addView(ui.pill(L.s("Right", "Kanan"), HlSettings.side(act) == "right") { HlSettings.setSide(act, "right"); act.show("highlights") }, ui.lp(WRAP, WRAP, 0, 8))
                  r2.addView(ui.pill(L.s("Test", "Tes"), false) { HlNotify.show(act, HlNotify.SHOT_SAVED, "Pictures/OpenPictures") }, ui.lp(WRAP, WRAP, 0, 8))
                  n.addView(r2, ui.lp(WRAP, WRAP, 8))
                  n.addView(ui.line(L.s("Whether these overlays appear inside recordings has not been verified on a device.", "Apakah overlay ini ikut terekam belum diverifikasi di perangkat."), Pal.AMBER, 11f, 8))
                  col.addView(n, ui.lp(MATCH, WRAP, 16))

                  val l = ui.card()
                  l.addView(ui.tv(L.s("Recent captures", "Hasil terbaru"), 15f, Pal.PURPLE_LIGHT, true))
                  val items = recent()
                  if (items.isEmpty()) l.addView(ui.line(L.s("Nothing yet.", "Belum ada."), Pal.MUTED, 12f, 8))
                  for (it in items) {
                      l.addView(ui.pill(it.name, false) {
                          try {
                              val i = Intent(Intent.ACTION_VIEW)
                              i.setDataAndType(it.uri, if (it.name.endsWith(".mp4")) "video/mp4" else "image/png")
                              i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              act.startActivity(i)
                          } catch (e: Exception) {
                              HlNotify.show(act, L.s("No app to open this file", "Tidak ada aplikasi untuk membuka berkas"), it.name, true)
                          }
                      }, ui.lp(WRAP, WRAP, 6))
                  }
                  col.addView(l, ui.lp(MATCH, WRAP, 16))
                  sv.addView(col)
                  return sv
              }
          }
