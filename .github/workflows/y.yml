          class LibraryView(private val act: MainActivity) {
              private val ui = Ui(act)
              private val store = Store(act)
              private val root = FrameLayout(act)
              private var games: List<GameEntry> = emptyList()
              private var loaded = false
              private var loading = false
              private var detail: GameEntry? = null

              fun view(): View {
                  if (!loaded && !loading) refresh()
                  return root
              }

              fun back(): Boolean {
                  if (detail != null) {
                      detail = null
                      showGrid()
                      return true
                  }
                  return false
              }

              fun refresh() {
                  loading = true
                  root.removeAllViews()
                  val t = ui.tv(L.s("Loading games...", "Memuat daftar game..."), 15f, Pal.MUTED)
                  t.setPadding(ui.dp(36), ui.dp(30), ui.dp(36), 0)
                  root.addView(t)
                  Thread {
                      val g = detect()
                      act.runOnUiThread {
                          games = g
                          loaded = true
                          loading = false
                          detail = null
                          showGrid()
                      }
                  }.start()
              }

              private fun detect(): List<GameEntry> = Games.detect(act)

              private fun showGrid() {
                  root.removeAllViews()
                  val col = LinearLayout(act)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(ui.dp(32), ui.dp(24), ui.dp(32), 0)

                  val head = LinearLayout(act)
