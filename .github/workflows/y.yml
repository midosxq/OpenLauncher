          /** Pengaturan Highlights yang dipakai bersama (sisi notifikasi). */
          object HlSettings {
              private fun sp(c: Context) = c.applicationContext.getSharedPreferences("ol_hl", Context.MODE_PRIVATE)
              fun side(c: Context): String = sp(c).getString("side", "left") ?: "left"
              fun setSide(c: Context, v: String) { sp(c).edit().putString("side", v).apply() }
          }

          /**
           * Notifikasi overlay bergaya ShadowPlay: kartu gelap tembus pandang dengan aksen, ikon OpenLauncher,
           * meluncur dari kiri atau kanan (dipilih di Highlights). Notifikasi diantre satu per satu.
           */
          object HlNotify {
              const val REC_STARTED = "Recording Started"
              const val SHOT_SAVED = "Screenshot Saved"
              const val SHOT_CAPTURED = "Screenshot Captured"
              const val REC_STOPPED = "Recording Stopped"
              const val REC_SAVED = "Recording Saved"
              const val SHOT_FAILED = "Screenshot Failed"
              const val REC_FAILED = "Recording Failed"

              private class Item(val title: String, val sub: String, val bad: Boolean)

              private val main = Handler(Looper.getMainLooper())
              private val queue = ArrayDeque<Item>()
              private var busy = false

              /** Aman dipanggil dari thread mana pun. */
              fun show(ctx: Context, title: String, sub: String = "", bad: Boolean = false) {
                  val app = ctx.applicationContext
                  main.post {
                      queue.addLast(Item(title, sub, bad))
                      if (!busy) next(app)
                  }
              }

              private fun next(ctx: Context) {
                  val it = queue.removeFirstOrNull()
                  if (it == null) {
                      busy = false
                      return
                  }
                  busy = true
                  if (!Settings.canDrawOverlays(ctx)) {
                      // Tanpa izin overlay: pakai Toast biasa, jangan gagal diam-diam.
                      try { Toast.makeText(ctx, it.title + (if (it.sub.isNotEmpty()) " - " + it.sub else ""), Toast.LENGTH_SHORT).show() } catch (e: Exception) {}
                      main.postDelayed({ next(ctx) }, 1500)
                      return
                  }
                  val ui = Ui(ctx)
                  val wm = ctx.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val left = HlSettings.side(ctx) == "left"
                  val card = LinearLayout(ctx)
                  card.orientation = LinearLayout.HORIZONTAL
                  card.gravity = Gravity.CENTER_VERTICAL
                  card.setPadding(ui.dp(12), ui.dp(10), ui.dp(16), ui.dp(10))
                  card.background = rounded(0xD9101018.toInt(), 10f, ui.dens, if (it.bad) Pal.RED else Pal.PURPLE, 2f)
                  val icon = ImageView(ctx)
                  try {
                      icon.setImageDrawable(ctx.packageManager.getApplicationIcon(ctx.packageName))
                  } catch (e: Exception) {
                  }
                  card.addView(icon, LinearLayout.LayoutParams(ui.dp(36), ui.dp(36)))
                  val col = LinearLayout(ctx)
                  col.orientation = LinearLayout.VERTICAL
                  val t = TextView(ctx)
                  t.text = it.title
                  t.textSize = 14f
                  t.typeface = Typeface.DEFAULT_BOLD
                  t.setTextColor(if (it.bad) Pal.RED else Pal.PURPLE_LIGHT)
                  col.addView(t)
                  if (it.sub.isNotEmpty()) {
                      val s = TextView(ctx)
                      s.text = it.sub
                      s.textSize = 11f
                      s.setTextColor(Pal.TEXT)
                      s.maxLines = 1
                      col.addView(s)
                  }
                  card.addView(col, ui.lp(WRAP, WRAP, 0, 10))
                  val root = FrameLayout(ctx)
                  root.addView(card, FrameLayout.LayoutParams(WRAP, WRAP))
                  val lp = WindowManager.LayoutParams(
                      WRAP, WRAP, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or (if (left) Gravity.START else Gravity.END)
                  lp.x = ui.dp(16)
                  lp.y = ui.dp(20)
                  try {
                      wm.addView(root, lp)
                  } catch (e: Exception) {
                      main.post { next(ctx) }
                      return
                  }
                  root.visibility = View.INVISIBLE
                  root.post {
                      val w = root.width.toFloat() + ui.dp(32)
                      val from = if (left) -w else w
                      root.translationX = from
                      root.visibility = View.VISIBLE
                      root.animate().translationX(0f).setDuration(260).withEndAction {
                          main.postDelayed({
                              root.animate().translationX(from).setDuration(240).withEndAction {
                                  try { wm.removeView(root) } catch (e: Exception) {}
                                  next(ctx)
                              }.start()
                          }, 2200)
                      }.start()
                  }
              }
          }
