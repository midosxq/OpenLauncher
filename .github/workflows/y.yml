          package com.midosxq.oplx

          import android.content.Context
          import android.graphics.Color

          /**
           * Tema global: warna aksen UI, warna Purple Wave (pengaturan terpisah dari aksen), dan transparansi panel.
           * Nilai default sama persis dengan tampilan sebelumnya (ungu). Disimpan di SharedPreferences "ol_theme".
           */
          object Theme {
              val DEF_ACCENT: Int = 0xFF8B5CF6.toInt()
              const val DEF_PANEL_ALPHA = 184 // ~72%: tembus pandang tapi teks tetap terbaca

              @Volatile var accent: Int = DEF_ACCENT
              @Volatile var wave: Int = DEF_ACCENT
              @Volatile var panelAlpha: Int = DEF_PANEL_ALPHA

              val presets: List<Pair<String, Int>> = listOf(
                  "Purple" to 0xFF8B5CF6.toInt(),
                  "Blue" to 0xFF3B82F6.toInt(),
                  "Cyan" to 0xFF06B6D4.toInt(),
                  "Green" to 0xFF22C55E.toInt(),
                  "Orange" to 0xFFF97316.toInt(),
                  "Red" to 0xFFEF4444.toInt(),
                  "Pink" to 0xFFEC4899.toInt()
              )

              private fun sp(c: Context) = c.applicationContext.getSharedPreferences("ol_theme", Context.MODE_PRIVATE)

              fun load(c: Context) {
                  try {
                      val s = sp(c)
                      accent = s.getInt("accent", DEF_ACCENT)
                      wave = s.getInt("wave", DEF_ACCENT)
                      panelAlpha = s.getInt("panel_alpha", DEF_PANEL_ALPHA).coerceIn(80, 255)
                  } catch (e: Exception) {
                  }
              }

              fun setAccent(c: Context, v: Int) { accent = v; sp(c).edit().putInt("accent", v).apply() }
              fun setWave(c: Context, v: Int) { wave = v; sp(c).edit().putInt("wave", v).apply() }
              fun setPanelAlpha(c: Context, v: Int) { panelAlpha = v.coerceIn(80, 255); sp(c).edit().putInt("panel_alpha", panelAlpha).apply() }
              fun reset(c: Context) {
                  accent = DEF_ACCENT; wave = DEF_ACCENT; panelAlpha = DEF_PANEL_ALPHA
                  sp(c).edit().clear().apply()
              }

              fun mix(a: Int, b: Int, t: Float): Int {
                  val k = t.coerceIn(0f, 1f)
                  val r = (Color.red(a) * (1f - k) + Color.red(b) * k).toInt()
                  val g = (Color.green(a) * (1f - k) + Color.green(b) * k).toInt()
                  val bl = (Color.blue(a) * (1f - k) + Color.blue(b) * k).toInt()
                  return Color.rgb(r, g, bl)
              }

              val light: Int get() = mix(accent, Color.WHITE, 0.55f)
              val dim: Int get() = mix(accent, Color.BLACK, 0.62f)
              val border: Int get() = mix(accent, Color.BLACK, 0.12f)

              /** Latar panel hitam semi-transparan. */
              fun panel(): Int = Color.argb(panelAlpha, 0, 0, 0)
          }
