          cat > 'app/src/main/java/com/midosxq/oplx/Ui.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.content.Context
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.Typeface
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.StateListDrawable
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewOutlineProvider
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.io.File

          const val WRAP = -2
          const val MATCH = -1

          class Ui(val ctx: Context) {
              val dens: Float = ctx.resources.displayMetrics.density

              fun dp(v: Int): Int = (v * dens).toInt()

              fun tv(t: String, sp: Float, color: Int, bold: Boolean = false): TextView {
                  val v = TextView(ctx)
                  v.text = t
                  v.textSize = sp
                  v.setTextColor(color)
                  if (bold) v.typeface = Typeface.DEFAULT_BOLD
                  return v
              }

              fun lp(w: Int, h: Int, top: Int = 0, left: Int = 0): LinearLayout.LayoutParams {
                  val l = LinearLayout.LayoutParams(w, h)
                  l.topMargin = dp(top)
                  l.leftMargin = dp(left)
                  return l
              }

              /** Kartu hitam dengan border ungu. */
              fun card(): LinearLayout {
                  val c = LinearLayout(ctx)
                  c.orientation = LinearLayout.VERTICAL
                  c.background = rounded(Pal.CARD, 12f, dens, Pal.BORDER, 1f)
                  c.setPadding(dp(20), dp(16), dp(20), dp(16))
                  return c
              }

              fun line(text: String, color: Int = Pal.TEXT, sp: Float = 13f, top: Int = 8): TextView {
                  val t = tv(text, sp, color)
                  t.layoutParams = lp(WRAP, WRAP, top)
                  return t
              }

              /** Tombol: solid ungu (utama) atau outline ungu (sekunder). Tanpa gradient. */
              fun pill(text: String, filled: Boolean, onClick: () -> Unit): TextView {
                  val t = tv(text, 13f, Color.WHITE, true)
                  if (!filled) t.setTextColor(Pal.PURPLE_LIGHT)
                  t.setPadding(dp(16), dp(9), dp(16), dp(9))
                  t.gravity = Gravity.CENTER
                  t.isClickable = true
                  t.isFocusable = true
                  val base = if (filled) Pal.PURPLE else 0
                  val sld = StateListDrawable()
                  sld.addState(intArrayOf(android.R.attr.state_pressed), rounded(base, 8f, dens, Pal.PURPLE_LIGHT, 2f))
                  sld.addState(intArrayOf(android.R.attr.state_hovered), rounded(base, 8f, dens, Pal.PURPLE_LIGHT, 2f))
                  sld.addState(intArrayOf(android.R.attr.state_focused), rounded(base, 8f, dens, Pal.PURPLE_LIGHT, 2f))
                  sld.addState(intArrayOf(), rounded(base, 8f, dens, Pal.BORDER, 1f))
                  t.background = sld
                  t.setOnClickListener { onClick() }
                  return t
              }
          }

          /** Kartu cover 16:9. Gambar di-crop hanya di lapisan tampilan; file asli tidak diubah. */
          class GameCard(ctx: Context, private val ui: Ui, private val store: Store, private val aspect: Float = 9f / 16f) : FrameLayout(ctx) {
              private val image = ImageView(ctx)
              private val ph = FrameLayout(ctx)
              private val icon = ImageView(ctx)
              private val title = TextView(ctx)
              var pkg: String = ""

              init {
                  background = ColorDrawable(Pal.BG)
                  // Pojok gambar ikut membulat mengikuti border ungu (outline bulat, bukan persegi).
                  outlineProvider = object : ViewOutlineProvider() {
                      override fun getOutline(view: View, outline: Outline) {
                          outline.setRoundRect(0, 0, view.width, view.height, 10f * ui.dens)
                      }
                  }
                  clipToOutline = true
                  image.scaleType = ImageView.ScaleType.CENTER_CROP
                  addView(image, FrameLayout.LayoutParams(MATCH, MATCH))

                  ph.background = ColorDrawable(Pal.BG)
                  icon.scaleType = ImageView.ScaleType.FIT_CENTER
                  val ilp = FrameLayout.LayoutParams(ui.dp(56), ui.dp(56))
                  ilp.gravity = Gravity.CENTER
                  ph.addView(icon, ilp)
                  addView(ph, FrameLayout.LayoutParams(MATCH, MATCH))

                  title.setTextColor(Color.WHITE)
                  title.textSize = 13f
                  title.typeface = Typeface.DEFAULT_BOLD
                  title.maxLines = 1
                  title.setPadding(ui.dp(10), ui.dp(6), ui.dp(10), ui.dp(6))
                  title.background = ColorDrawable(0xB3000000.toInt())
                  val tlp = FrameLayout.LayoutParams(MATCH, WRAP)
                  tlp.gravity = Gravity.BOTTOM
                  addView(title, tlp)

                  foreground = rounded(0, 10f, ui.dens, Pal.BORDER, 1f)
                  setOnHoverListener { _, e ->
                      if (e.action == MotionEvent.ACTION_HOVER_ENTER) {
                          foreground = rounded(0, 10f, ui.dens, Pal.PURPLE_LIGHT, 2f)
                          animate().scaleX(1.03f).scaleY(1.03f).setDuration(120).start()
                      } else if (e.action == MotionEvent.ACTION_HOVER_EXIT) {
                          foreground = rounded(0, 10f, ui.dens, Pal.BORDER, 1f)
                          animate().scaleX(1f).scaleY(1f).setDuration(120).start()
                      }
                      false
                  }
              }

              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  val w = View.MeasureSpec.getSize(widthMeasureSpec)
                  super.onMeasure(
                      View.MeasureSpec.makeMeasureSpec(w, View.MeasureSpec.EXACTLY),
                      View.MeasureSpec.makeMeasureSpec((w * aspect).toInt(), View.MeasureSpec.EXACTLY)
                  )
              }

              fun bind(g: GameEntry, reqW: Int, showTitle: Boolean) {
                  pkg = g.pkg
                  title.text = g.label
                  title.visibility = if (showTitle) View.VISIBLE else View.GONE
                  image.setImageDrawable(null)
                  ph.visibility = View.VISIBLE
                  try {
                      icon.setImageDrawable(context.packageManager.getApplicationIcon(g.pkg))
                  } catch (e: Exception) {
                      icon.setImageDrawable(null)
                  }
                  val custom = store.cover(g.pkg)
                  val src: String? = if (custom != null && File(custom).exists()) {
                      "file:" + custom
                  } else {
                      val b = Covers.bundledFor(g.pkg, g.appLabel)
                      if (b != null) "asset:" + b else null
                  }
                  if (src == null) return
                  Covers.get(context, src, reqW) { bmp ->
                      if (pkg == g.pkg && bmp != null) {
                          image.setImageBitmap(bmp)
                          ph.visibility = View.GONE
                      }
                  }
              }
          }

          /** Ombak ungu animasi untuk Welcome Screen. FPS dibatasi agar hemat baterai. */
          class WaveView(ctx: android.content.Context, private val fps: Int) : View(ctx) {
              private val p = android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG)
              private val path = android.graphics.Path()
              private var phase = 0f
              private var last = 0L
              private var running = false
              private val dens = ctx.resources.displayMetrics.density

              init {
                  p.style = android.graphics.Paint.Style.STROKE
                  p.strokeWidth = 2f * dens
                  p.color = Theme.wave // warna wave terpisah dari warna aksen UI
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  running = true
                  invalidate()
              }

              override fun onDetachedFromWindow() {
                  running = false
                  super.onDetachedFromWindow()
              }

              /** Berhenti menggambar saat jendela tidak terlihat (mis. game sedang berjalan di depan) supaya tidak memakan CPU/baterai. */
              override fun onWindowVisibilityChanged(visibility: Int) {
                  super.onWindowVisibilityChanged(visibility)
                  val vis = visibility == View.VISIBLE
                  if (vis && !running && isAttachedToWindow) {
                      running = true
                      last = 0L
                      invalidate()
                  } else if (!vis) {
                      running = false
                  }
              }

              override fun onDraw(c: android.graphics.Canvas) {
                  val now = android.os.SystemClock.uptimeMillis()
                  val step = 1000L / maxOf(5, fps)
                  if (last != 0L) phase += 0.0012f * (now - last)
                  last = now
                  val w = width.toFloat()
                  val h = height.toFloat()
                  // Satu Purple Wave saja (lima garis rapat), di bagian bawah layar.
                  for (k in 0..4) {
                      val base = h * 0.88f - k * 9f * dens
                      val amp = (14f + k * 5f) * dens
                      p.alpha = 170 - k * 30
                      path.reset()
                      var x = 0f
                      while (x <= w) {
                          val y = base + amp * Math.sin((x / w * 4.2 + phase * (1.0 + k * 0.15) + k * 0.7)).toFloat()
                          if (x == 0f) path.moveTo(x, y) else path.lineTo(x, y)
                          x += 14f * dens
                      }
                      c.drawPath(path, p)
                  }
                  if (running) postInvalidateDelayed(step)
              }
          }

          /** Ledakan partikel kecil saat game diluncurkan. */
          class ParticleView(ctx: android.content.Context, private val cx: Float, private val cy: Float) : View(ctx) {
              private val rnd = java.util.Random()
              private val n = 16
              private val ang = FloatArray(n) { rnd.nextFloat() * 6.2832f }
              private val spd = FloatArray(n) { 80f + rnd.nextFloat() * 160f }
              private val paint = android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG)
              private val dens = ctx.resources.displayMetrics.density
              private var t = 0f

              init {
                  paint.color = Pal.PURPLE_LIGHT
                  val a = android.animation.ValueAnimator.ofFloat(0f, 1f)
                  a.duration = 600
                  a.addUpdateListener {
                      t = it.animatedValue as Float
                      invalidate()
                  }
                  a.addListener(object : android.animation.AnimatorListenerAdapter() {
                      override fun onAnimationEnd(animation: android.animation.Animator) {
                          (parent as? android.view.ViewGroup)?.removeView(this@ParticleView)
                      }
                  })
                  a.start()
              }

              override fun onDraw(c: android.graphics.Canvas) {
                  paint.alpha = ((1f - t) * 255f).toInt().coerceIn(0, 255)
                  for (i in 0 until n) {
                      val d = spd[i] * t * dens
                      c.drawCircle(cx + Math.cos(ang[i].toDouble()).toFloat() * d, cy + Math.sin(ang[i].toDouble()).toFloat() * d, (3f * (1f - t) + 1f) * dens, paint)
                  }
              }
          }
