                              "Lock Cursor ON: mouse mengendalikan kamera. OFF: kursor mouse muncul dan klik kiri mengetuk di posisinya. Cursor Refresh memulihkan kursor bidik yang macet dan terpisah dari Lock Cursor."
                          ), Pal.MUTED, 11f, 8
                      )
                  )
