                  if ((maps[i].type == M_CAM || maps[i].type == M_PADCAM) && maps[i].down) return 1;
                  if (maps[i].type == M_PADCAM && (fabs(pad_ax[3]) >= 0.2 || fabs(pad_ax[4]) >= 0.2)) return 1;
              }
