          package com.midosxq.oplx

          import android.app.ActivityManager
          import android.content.Context

          /** Pengaturan performa: Adaptive (default) dan prioritas baterai Balanced (default). */
          object Perf {
              private fun sp(c: Context) = c.applicationContext.getSharedPreferences("ol_perf", Context.MODE_PRIVATE)

              fun mode(c: Context): String = sp(c).getString("mode", "adaptive") ?: "adaptive"
              fun setMode(c: Context, v: String) { sp(c).edit().putString("mode", v).apply() }
              fun battery(c: Context): String = sp(c).getString("battery", "balanced") ?: "balanced"
              fun setBattery(c: Context, v: String) { sp(c).edit().putString("battery", v).apply() }

              private fun lowRam(c: Context): Boolean {
                  val am = c.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  return am.isLowRamDevice || am.memoryClass <= 128
              }

              /** Batas FPS animasi latar (Welcome Screen). */
              fun animFps(c: Context): Int = when (mode(c)) {
                  "performance" -> 45
                  "saver" -> 15
                  else -> if (lowRam(c) || battery(c) == "battery") 20 else 30
              }

              fun particles(c: Context): Boolean = mode(c) != "saver"

              /** Interval pemantauan app depan oleh Mapper Service (ms). */
              fun pollMs(c: Context): Long = when (battery(c)) {
                  "battery" -> 1000L
                  "performance" -> 300L
                  else -> 500L
              }
          }
