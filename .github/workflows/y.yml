          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/Xrm.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/Xrm.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Handler
          import android.os.Looper
          import android.util.Log
          import java.io.InputStream
          import java.security.MessageDigest

          /**
           * XRM (Xtreme Resource Modifier): pemeriksaan integritas, sepenuhnya offline.
           *
           * Yang diperiksa:
           *  1. Aset di assets/ dan res/raw (termasuk video intro) dibandingkan dengan daftar SHA-256 yang dibuat saat build
           *     (assets/xrm/manifest.txt).
           *  2. Sertifikat penanda tangan APK dicatat pada peluncuran pertama; bila berubah pada instalasi yang sama, ditandai.
           *
           * Batas yang jujur: ini mendeteksi perubahan biasa dan APK yang dipasang ulang dengan tanda tangan lain.
           * Ini BUKAN perlindungan 100% terhadap reverse engineering atau repackaging oleh orang yang menguasai Android:
           * daftar hash ikut berada di dalam APK, jadi penyerang yang teliti bisa memperbaruinya.
           * Aset belum dienkripsi. Kegagalan verifikasi (bukan ketidakcocokan) hanya dicatat di log, tanpa peringatan palsu.
           * Tidak ada akses jaringan, tidak ada data pengguna yang dihapus, dan pengguna tetap bisa melanjutkan.
           */
          object Xrm {
              private const val TAG = "OL/XRM"
              const val ALERT_TITLE = "OpenLauncher Security Alert \u2014 APK Integrity Check Failed"

              @Volatile private var started = false
              @Volatile var failed: List<String>? = null
                  private set

              /** Dijalankan sekali per proses, di thread terpisah; hasil disimpan selama proses berjalan. */
              fun verifyAsync(act: Activity) {
                  if (started) return
                  started = true
                  Thread {
                      val bad = try {
                          runChecks(act.applicationContext)
                      } catch (e: Throwable) {
                          Log.w(TAG, "verification could not run: " + e)
                          null
                      }
                      if (bad != null && bad.isNotEmpty()) {
                          failed = bad
                          Log.w(TAG, "integrity check failed: " + bad.joinToString(","))
                          Handler(Looper.getMainLooper()).post { if (!act.isFinishing) alert(act) }
                      } else if (bad != null) {
                          Log.i(TAG, "integrity check passed")
                      }
                  }.start()
              }

              private fun hex(b: ByteArray): String {
                  val sb = StringBuilder()
                  for (x in b) sb.append(String.format("%02x", x.toInt() and 0xff))
                  return sb.toString()
              }

              private fun sha256(ins: InputStream): String {
                  val md = MessageDigest.getInstance("SHA-256")
                  val buf = ByteArray(16384)
                  ins.use {
                      while (true) {
                          val n = it.read(buf)
                          if (n < 0) break
                          md.update(buf, 0, n)
                      }
                  }
                  return hex(md.digest())
              }

              private fun signerHash(c: Context): String? {
                  val pi = c.packageManager.getPackageInfo(c.packageName, PackageManager.GET_SIGNING_CERTIFICATES)
                  val signers = pi.signingInfo?.apkContentsSigners ?: return null
                  if (signers.isEmpty()) return null
                  val md = MessageDigest.getInstance("SHA-256")
                  for (s in signers) md.update(s.toByteArray())
                  return hex(md.digest())
              }

              private fun open(c: Context, name: String): InputStream? {
                  if (name.startsWith("raw/")) {
                      val base = name.substring(4).substringBeforeLast('.')
                      val id = c.resources.getIdentifier(base, "raw", c.packageName)
                      return if (id == 0) null else c.resources.openRawResource(id)
                  }
                  return c.assets.open(name)
              }

              /** Mengembalikan daftar item yang tidak cocok (kosong = lolos). */
              private fun runChecks(c: Context): List<String> {
                  val bad = ArrayList<String>()

                  val sig = signerHash(c)
                  if (sig != null) {
                      val sp = c.getSharedPreferences("ol_xrm", Context.MODE_PRIVATE)
                      val saved = sp.getString("signer", null)
                      if (saved == null) sp.edit().putString("signer", sig).apply()
                      else if (saved != sig) bad.add("signer")
                  }

                  val mf = try {
                      c.assets.open("xrm/manifest.txt").bufferedReader().use { it.readText() }
                  } catch (e: Exception) {
                      null
                  }
                  if (mf == null) {
                      bad.add("manifest")
                      return bad
                  }
                  for (raw in mf.split("\n")) {
                      val l = raw.trim()
                      if (l.length < 67 || l[64] != ' ') continue
                      val want = l.substring(0, 64)
                      val name = l.substring(66)
                      val got = try {
                          val s = open(c, name)
                          if (s == null) null else sha256(s)
                      } catch (e: Exception) {
                          null
                      }
                      if (got == null || got != want) bad.add(name)
                  }
                  return bad
              }

              private fun alert(act: Activity) {
                  try {
                      AlertDialog.Builder(act)
                          .setTitle(ALERT_TITLE)
                          .setMessage(
                              L.s(
                                  "An integrity check failed. Some app files do not match what was expected. This copy may not be an original, unmodified build, or the files may be damaged. Your data was not touched. If you did not modify the app yourself, reinstall OpenLauncher from a source you trust.",
                                  "Pemeriksaan integritas gagal. Sebagian file aplikasi tidak sesuai dengan yang diharapkan. Salinan ini mungkin bukan build asli yang belum diubah, atau filenya rusak. Datamu tidak disentuh. Jika kamu tidak mengubah aplikasi ini sendiri, pasang ulang OpenLauncher dari sumber yang kamu percaya."
                              )
                          )
                          .setCancelable(false)
                          .setPositiveButton(L.s("Continue", "Lanjut")) { d, _ -> d.dismiss() }
                          .setNegativeButton(L.s("Close app", "Tutup app")) { _, _ -> act.finishAffinity() }
                          .show()
                  } catch (e: Exception) {
                      Log.w(TAG, "alert could not be shown: " + e)
                  }
              }
          }
          OLEOF
          mkdir -p "$(dirname 'native/xeng.c')"
          cat > 'native/xeng.c' <<'OLEOF'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdarg.h>
          #include <string.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <errno.h>
          #include <poll.h>
          #include <time.h>
          #include <math.h>
          #include <signal.h>
          #include <sys/ioctl.h>
          #include <linux/input.h>
          #include <linux/uinput.h>

          #define MAXDEV 16
          #define MAXMAP 64
          #define NKEY 768
          #define KDSZ 12100
          #define NSMAX 16
          #define CAM_DEF_R 0.25
          enum { T_KBD = 0, T_MOUSE = 1, T_TOUCH = 2, T_PAD = 3 };
          enum { M_JOY = 1, M_CAM = 2, M_TAP = 3, M_RAPID = 4, M_PADJOY = 5, M_PADCAM = 6 };

          typedef struct { int fd; int type; int grabbed; int num; int amin[24]; int amax[24]; int rsx, rsy, ltr, rtr; } Dev;
          /* slot: slot sentuh logis yang sedang dipakai map ini, -1 = jari tidak sedang turun. down: tombol/stik map sedang aktif. */
          typedef struct { int type; int key[4]; double u, v, r; int slot; int down; long next; int hold; } Map;
          typedef struct { int n; int k[6]; } Hk;

          static Dev devs[MAXDEV];
          static int ndev = 0;
          static char rejected[64];
          static int mode = 0; /* 0 off, 1 game, 2 type */
          static int rot = 1;
          static double vw = 2400, vh = 1080;
          static double pw_r = 0, ph_r = 0; /* ukuran fisik panel pada orientasi sekarang; 0 = tidak diketahui */
          static long last_mv = 0;
          static double cacc = 0; /* counter acceleration 0..100: meredam gain saat mouse bergerak cepat (0 = mati) */
          static int oob = 0; /* 1 = koordinat boleh keluar layar (tidak dipakai kamera lagi: kamera di-loop di dalam layar) */
          static int susp = 0, ref_held = 0; /* Reset View: susp = kursor sementara muncul (tahan), ref_held = tombol sedang ditekan */
          static long ref_t = 0, ref_last = 0;
          static int frame_ok = 0; /* frame viewport asli dari sistem (dumpsys input), pada orientasi sekarang */
          static double fr_l = 0, fr_t = 0, fr_r = 0, fr_b = 0, fr_dw = 0, fr_dh = 0;
          static Map maps[MAXMAP];
          static int nmap = 0;
          static Hk hks[4];
          static const char *hk_name[4] = { "edit", "tog", "ref", "ptr" };
          static char kd[KDSZ];
          static int mdx = 0, mdy = 0;
          static long cam_last = 0;
          static double cam_u = 0, cam_v = 0, pcam_u = 0, pcam_v = 0;
          static int cap = 0, cap_n = 0, cap_keys[8];
          static double sensx = 20.0, sensy = 20.0;
          static double psens = 20.0; /* sensitivitas kursor (mode kursor / tahan Reset View), terpisah dari kamera */
          static int lockc = 1;
          static double pu = 0.5, pv = 0.5;
          static long last_ptr = 0, last_tick = 0;
          static double pad_ax[24];
          static struct { int code; long due; } pend[8];

          static int touch_fd = -1, tmaxx = 1, tmaxy = 1, tslotmax = 9;
          static int t_press = 0, t_major = 0, press_val = 1;
          static int nslots = 8; /* jumlah slot logis yang boleh dipakai mapper (dari ujung atas slot perangkat; bawah disisakan untuk jari asli) */
          static int slot_on[NSMAX];
          static int ptr_s = -1; /* slot jari kursor (klik/drag di mode kursor) */
          static int idc = 20000, ntouch_on = 0;
          static struct input_event ob[24];
          static int on_cnt = 0;
          static long wfail = 0, cam_loops = 0, noslot = 0;

          /* tombol Back (emulasi): salah satu tombol di back_k menekan Android Back. */
          static int back_on = 0, back_n = 0, back_k[4];
          static int ufd = -1; /* perangkat uinput virtual (KEY_BACK, KEY_LEFTMETA, KEY_RIGHTMETA) */

          /* scroll mouse di mode kursor: disuntik sebagai geseran jari singkat di posisi kursor */
          static int wh_s = -1;
          static double wh_u = 0, wh_v = 0, wh_cur = 0, wh_tgt = 0;
          static long wh_t = 0;

          static long now_ms(void) {
              struct timespec ts;
              clock_gettime(CLOCK_MONOTONIC, &ts);
              return ts.tv_sec * 1000L + ts.tv_nsec / 1000000L;
          }

          /* ---- diagnostik: ring buffer kejadian input (timestamp ms, monotonic) ---- */
          #define DLN 240
          #define DLL 120
          static char dlb[DLN][DLL];
          static unsigned long dl_n = 0;
          static void dlog(const char *fmt, ...) {
              va_list ap;
              char *b = dlb[dl_n % DLN];
              int k = snprintf(b, DLL, "%ld ", now_ms());
              va_start(ap, fmt);
              vsnprintf(b + k, DLL - k, fmt, ap);
              va_end(ap);
              dl_n++;
          }

          static int tb(const unsigned char *a, int b) { return (a[b / 8] >> (b % 8)) & 1; }
          static void pe(int t, int c, int v) {
              if (on_cnt < 23) {
                  memset(&ob[on_cnt], 0, sizeof(ob[0]));
                  ob[on_cnt].type = t; ob[on_cnt].code = c; ob[on_cnt].value = v;
                  on_cnt++;
              }
          }
          /* Tulis satu batch event ke layar sentuh. Kegagalan tulis dicoba ulang, dihitung, dan dicatat (tidak lagi diabaikan diam-diam). */
          static void flush_ev(void) {
              int tries;
              size_t want, done = 0;
              pe(EV_SYN, SYN_REPORT, 0);
              want = (size_t)on_cnt * sizeof(ob[0]);
              if (touch_fd >= 0) {
                  for (tries = 0; tries < 4 && done < want; tries++) {
                      ssize_t w = write(touch_fd, (char *)ob + done, want - done);
                      if (w > 0) { done += (size_t)w; continue; }
                      if (w < 0 && (errno == EAGAIN || errno == EINTR)) {
                          struct pollfd pf; pf.fd = touch_fd; pf.events = POLLOUT; pf.revents = 0;
                          poll(&pf, 1, 5);
                          continue;
                      }
                      break;
                  }
                  if (done < want) { wfail++; dlog("WRITE FAIL done=%zu/%zu errno=%d", done, want, errno); }
              }
              on_cnt = 0;
          }
          static int devslot(int s) {
              if (s < 0) s = 0;
              if (s > tslotmax) s = tslotmax;
              return tslotmax - s;
          }
          static int slot_alloc(void) {
              int i;
              for (i = 0; i < nslots; i++) if (!slot_on[i]) return i;
              return -1;
          }
          static void conv(double u, double v, double *nx, double *ny) {
              switch (rot) {
                  case 1: *nx = 1 - v; *ny = u; break;
                  case 2: *nx = 1 - u; *ny = 1 - v; break;
                  case 3: *nx = v; *ny = 1 - u; break;
                  default: *nx = u; *ny = v; break;
              }
              {
                  double lo = oob ? -500.0 : 0.0, hi = oob ? 501.0 : 1.0;
                  if (*nx < lo) *nx = lo; if (*nx > hi) *nx = hi;
                  if (*ny < lo) *ny = lo; if (*ny > hi) *ny = hi;
              }
          }
          /* wm size dengan rasio beda: layar logis di-letterbox di tengah panel fisik, sedangkan koordinat sentuh mentah mencakup seluruh panel. */
          static void lbox(double *u, double *v) {
              double s, w, h;
              if (frame_ok) {
                  *u = (fr_l + *u * (fr_r - fr_l)) / fr_dw;
                  *v = (fr_t + *v * (fr_b - fr_t)) / fr_dh;
                  return;
              }
              if (pw_r < 1 || ph_r < 1 || vw < 1 || vh < 1) return;
              s = (pw_r / vw < ph_r / vh) ? pw_r / vw : ph_r / vh;
              w = vw * s; h = vh * s;
              if (fabs(w - pw_r) < 1.5 && fabs(h - ph_r) < 1.5) return;
              *u = ((pw_r - w) / 2 + *u * w) / pw_r;
              *v = ((ph_r - h) / 2 + *v * h) / ph_r;
          }
          static void tpos(double u, double v) {
              double nx, ny;
              lbox(&u, &v);
              conv(u, v, &nx, &ny);
              pe(EV_ABS, ABS_MT_POSITION_X, (int)(nx * tmaxx));
              pe(EV_ABS, ABS_MT_POSITION_Y, (int)(ny * tmaxy));
          }
          static int tdown(int s, double u, double v) {
              if (touch_fd < 0 || s < 0 || s >= nslots || slot_on[s]) return 0;
              pe(EV_ABS, ABS_MT_SLOT, devslot(s));
              pe(EV_ABS, ABS_MT_TRACKING_ID, idc);
              idc = idc >= 30000 ? 20000 : idc + 1;
              tpos(u, v);
              if (t_press) pe(EV_ABS, ABS_MT_PRESSURE, press_val);
              if (t_major) pe(EV_ABS, ABS_MT_TOUCH_MAJOR, 6);
              if (ntouch_on == 0) pe(EV_KEY, BTN_TOUCH, 1);
              slot_on[s] = 1; ntouch_on++;
              flush_ev();
              dlog("DOWN s=%d", s);
              return 1;
          }
          static void tmove(int s, double u, double v) {
              if (touch_fd < 0 || s < 0 || s >= nslots || !slot_on[s]) return;
              pe(EV_ABS, ABS_MT_SLOT, devslot(s));
              tpos(u, v);
              flush_ev();
          }
          static void tup(int s) {
              if (touch_fd < 0 || s < 0 || s >= nslots || !slot_on[s]) return;
              pe(EV_ABS, ABS_MT_SLOT, devslot(s));
              pe(EV_ABS, ABS_MT_TRACKING_ID, -1);
              slot_on[s] = 0; ntouch_on--;
              if (ntouch_on <= 0) { ntouch_on = 0; pe(EV_KEY, BTN_TOUCH, 0); }
              flush_ev();
              dlog("UP s=%d", s);
          }
          /* map <-> slot: satu map memegang tepat satu slot selama jarinya turun; slot dilepas saat jari naik. */
          static int mdown(Map *m, double u, double v) {
              int s;
              if (m->slot >= 0 && slot_on[m->slot]) return 1;
              s = slot_alloc();
              if (s < 0) { noslot++; dlog("NOSLOT type=%d", m->type); return 0; }
              if (!tdown(s, u, v)) return 0;
              m->slot = s;
              return 1;
          }
          static void mup(Map *m) {
              if (m->slot >= 0) tup(m->slot);
              m->slot = -1;
          }
          static void pdown(double u, double v) {
              if (ptr_s >= 0) return;
              ptr_s = slot_alloc();
              if (ptr_s < 0) { noslot++; return; }
              if (!tdown(ptr_s, u, v)) ptr_s = -1;
          }
          static void pmove(double u, double v) { if (ptr_s >= 0) tmove(ptr_s, u, v); }
          static void pup(void) { if (ptr_s >= 0) { tup(ptr_s); ptr_s = -1; } }
          static void wheel_end(void) { if (wh_s >= 0) { tup(wh_s); wh_s = -1; } }
          /* Angkat semua jari. Hanya untuk ganti mode/berhenti; untuk Reset View dan mode kursor pakai release_cam(). */
          static void release_all(void) {
              int i;
              for (i = 0; i < nmap; i++) { mup(&maps[i]); maps[i].down = 0; }
              pup();
              wheel_end();
          }
          /* Hanya jari kamera, kursor, dan scroll. Analog (WASD/stik) dan tombol tap tidak disentuh. */
          static void release_cam(void) {
              int i;
              for (i = 0; i < nmap; i++) if (maps[i].type == M_CAM || maps[i].type == M_PADCAM) mup(&maps[i]);
              pup();
              wheel_end();
          }
          /* Perangkat sentuh hilang: lupakan semua keadaan jari supaya tidak ada map yang menunggu jari yang sudah tidak ada. */
          static void forget_touches(void) {
              int i;
              touch_fd = -1;
              memset(slot_on, 0, sizeof slot_on);
              ntouch_on = 0; ptr_s = -1; wh_s = -1;
              for (i = 0; i < nmap; i++) maps[i].slot = -1;
          }
          static void emit_dev(void) {
              int i, k = 0, m = 0, p = 0, t = 0;
              for (i = 0; i < ndev; i++) {
                  if (devs[i].type == T_KBD) k++; else if (devs[i].type == T_MOUSE) m++;
                  else if (devs[i].type == T_PAD) p++; else t++;
              }
              printf("EV DEV %d %d %d %d\n", k, m, p, t);
          }
          static void grab_dev(Dev *d, int g) {
              if (d->type == T_TOUCH) return;
              if (d->grabbed != g) { if (ioctl(d->fd, EVIOCGRAB, (void *)(long)g) == 0) d->grabbed = g; }
          }
          static void resync_all(void);
          static void set_mode(int m) {
              int i;
              if (m != 1) {
                  ref_held = 0;
                  if (susp) { susp = 0; lockc = 1; printf("EV SUSP 0\n"); }
                  release_all();
              }
              if (m != mode) dlog("MODE %d->%d", mode, m);
              mode = m;
              for (i = 0; i < ndev; i++) grab_dev(&devs[i], m == 1 ? 1 : 0);
              if (m == 1) resync_all();
          }
          static int classify(int fd) {
              unsigned char evb[8], keyb[(KEY_MAX + 8) / 8], relb[8], absb[(ABS_MAX + 8) / 8], prop[8];
              memset(evb, 0, sizeof evb); memset(keyb, 0, sizeof keyb); memset(relb, 0, sizeof relb);
              memset(absb, 0, sizeof absb); memset(prop, 0, sizeof prop);
              if (ioctl(fd, EVIOCGBIT(0, sizeof evb), evb) < 0) return -1;
              if (tb(evb, EV_ABS)) {
                  ioctl(fd, EVIOCGBIT(EV_ABS, sizeof absb), absb);
                  if (tb(absb, ABS_MT_POSITION_X) && tb(absb, ABS_MT_POSITION_Y)) {
                      if (ioctl(fd, EVIOCGPROP(sizeof prop), prop) >= 0 && !tb(prop, INPUT_PROP_DIRECT)) return -1;
                      return T_TOUCH;
                  }
              }
              if (tb(evb, EV_KEY)) ioctl(fd, EVIOCGBIT(EV_KEY, sizeof keyb), keyb);
              if (tb(evb, EV_REL)) {
                  ioctl(fd, EVIOCGBIT(EV_REL, sizeof relb), relb);
                  if (tb(relb, REL_X) && tb(relb, REL_Y) && tb(keyb, BTN_LEFT)) return T_MOUSE;
              }
              if (tb(evb, EV_KEY) && tb(keyb, KEY_A) && tb(keyb, KEY_W) && tb(keyb, KEY_SPACE)) return T_KBD;
              if (tb(evb, EV_ABS) && tb(absb, ABS_X) && tb(absb, ABS_Y) && (tb(keyb, BTN_SOUTH) || tb(keyb, BTN_TRIGGER))) return T_PAD;
              return -1;
          }
          static void calc_nslots(void) {
              int tot = tslotmax + 1;
              nslots = tot >= 10 ? tot - 2 : (tot > 3 ? tot - 1 : tot);
              if (nslots > NSMAX) nslots = NSMAX;
              if (nslots < 1) nslots = 1;
          }
          static void setup_touch(int fd) {
              struct input_absinfo ai;
              unsigned char absb[(ABS_MAX + 8) / 8];
              memset(absb, 0, sizeof absb);
              ioctl(fd, EVIOCGBIT(EV_ABS, sizeof absb), absb);
              if (ioctl(fd, EVIOCGABS(ABS_MT_POSITION_X), &ai) == 0) tmaxx = ai.maximum > 0 ? ai.maximum : 1;
              if (ioctl(fd, EVIOCGABS(ABS_MT_POSITION_Y), &ai) == 0) tmaxy = ai.maximum > 0 ? ai.maximum : 1;
              tslotmax = 9;
              if (ioctl(fd, EVIOCGABS(ABS_MT_SLOT), &ai) == 0) tslotmax = ai.maximum;
              if (tslotmax < 0) tslotmax = 0;
              calc_nslots();
              t_press = tb(absb, ABS_MT_PRESSURE);
              t_major = tb(absb, ABS_MT_TOUCH_MAJOR);
              press_val = 1;
              if (t_press && ioctl(fd, EVIOCGABS(ABS_MT_PRESSURE), &ai) == 0) { press_val = ai.maximum / 4; if (press_val < 1) press_val = 1; }
              dlog("TOUCH max=%dx%d slotmax=%d nslots=%d", tmaxx, tmaxy, tslotmax, nslots);
          }
          static void setup_pad(Dev *d) {
              struct input_absinfo ai;
              unsigned char absb[(ABS_MAX + 8) / 8];
              int a;
              memset(absb, 0, sizeof absb);
              ioctl(d->fd, EVIOCGBIT(EV_ABS, sizeof absb), absb);
              for (a = 0; a < 24; a++) {
                  d->amin[a] = 0; d->amax[a] = 255;
                  if (tb(absb, a) && ioctl(d->fd, EVIOCGABS(a), &ai) == 0) { d->amin[a] = ai.minimum; d->amax[a] = ai.maximum; }
              }
              /* Layout Xbox: stik kanan RX/RY, trigger Z/RZ. Layout PS: stik kanan Z/RZ, trigger RX/RY. */
              if (tb(absb, ABS_RX) && tb(absb, ABS_RY) && (!tb(absb, ABS_Z) || d->amin[ABS_Z] == 0)) {
                  d->rsx = ABS_RX; d->rsy = ABS_RY; d->ltr = tb(absb, ABS_Z) ? ABS_Z : ABS_BRAKE; d->rtr = tb(absb, ABS_RZ) ? ABS_RZ : ABS_GAS;
              } else {
                  d->rsx = ABS_Z; d->rsy = ABS_RZ; d->ltr = ABS_RX; d->rtr = ABS_RY;
              }
          }
          static void scan(void) {
              int i, j;
              char path[48];
              for (i = 0; i < 64; i++) {
                  int have = 0, fd, t;
                  for (j = 0; j < ndev; j++) if (devs[j].num == i) have = 1;
                  if (have) continue;
                  snprintf(path, sizeof path, "/dev/input/event%d", i);
                  fd = open(path, O_RDWR | O_NONBLOCK);
                  if (fd < 0) { rejected[i] = 0; continue; }
                  if (rejected[i]) { close(fd); continue; }
                  t = classify(fd);
                  if (t < 0 || ndev >= MAXDEV || (t == T_TOUCH && touch_fd >= 0)) { rejected[i] = 1; close(fd); continue; }
                  memset(&devs[ndev], 0, sizeof(Dev));
                  devs[ndev].fd = fd; devs[ndev].type = t; devs[ndev].num = i;
                  if (t == T_TOUCH) { touch_fd = fd; setup_touch(fd); }
                  if (t == T_PAD) setup_pad(&devs[ndev]);
                  grab_dev(&devs[ndev], mode == 1 ? 1 : 0);
                  ndev++;
                  emit_dev();
              }
          }
          static void on_key(int code, int down);
          /* Perangkat input dicabut: semua tombol/stik yang tercatat "ditekan" dilepas, supaya analog/tombol tidak nyangkut. */
          static void padjoy_update(void);
          static void clear_keys(void) {
              int c;
              for (c = 0; c < KDSZ; c++) if (kd[c]) { kd[c] = 0; on_key(c, 0); }
              memset(pad_ax, 0, sizeof pad_ax);
              padjoy_update();
          }
          static void remove_dev(int idx) {
              int type = devs[idx].type;
              dlog("REMOVE dev type=%d", type);
              if (devs[idx].fd == touch_fd) forget_touches();
              close(devs[idx].fd);
              rejected[devs[idx].num] = 0;
              devs[idx] = devs[ndev - 1];
              ndev--;
              if (type != T_TOUCH) clear_keys();
              emit_dev();
          }
          static void joy_update(Map *m) {
              double dx = (kd[m->key[3]] ? 1 : 0) - (kd[m->key[1]] ? 1 : 0);
              double dy = (kd[m->key[2]] ? 1 : 0) - (kd[m->key[0]] ? 1 : 0);
              double l, u, v;
              if (dx == 0 && dy == 0) { m->down = 0; mup(m); return; }
              l = sqrt(dx * dx + dy * dy); dx /= l; dy /= l;
              u = m->u + dx * m->r * vh / vw; v = m->v + dy * m->r;
              m->down = 1;
              if (m->slot < 0 && !mdown(m, m->u, m->v)) return;
              tmove(m->slot, u, v);
          }
          /*
           * Kamera mouse. Jari kamera tidak lagi dibiarkan keluar layar: bila keluar dari lingkaran kamera (radius m->r x tinggi layar)
           * atau mendekati tepi layar, jari diangkat dan dipasang ulang di titik awal ("loop kamera"), lalu gerakan berlanjut dari situ.
           */
          static void cam_apply(double dx, double dy) {
              int i;
              for (i = 0; i < nmap; i++) {
                  Map *m = &maps[i];
                  double rr, du, dv, stepu, stepv;
                  if (m->type != M_CAM) continue;
                  if (m->slot < 0) {
                      cam_u = m->u; cam_v = m->v;
                      if (!mdown(m, cam_u, cam_v)) return;
                  }
                  stepu = dx * sensx * 0.1 / vw;
                  stepv = dy * sensy * 0.1 / vh;
                  cam_u += stepu; cam_v += stepv;
                  rr = (m->r > 0.02 ? m->r : CAM_DEF_R) * vh;
                  du = (cam_u - m->u) * vw; dv = (cam_v - m->v) * vh;
                  if (du * du + dv * dv > rr * rr || cam_u < 0.01 || cam_u > 0.99 || cam_v < 0.01 || cam_v > 0.99) {
                      mup(m);
                      cam_u = m->u; cam_v = m->v;
                      if (!mdown(m, cam_u, cam_v)) return;
                      cam_u += stepu; cam_v += stepv;
                      cam_loops++;
                  }
                  tmove(m->slot, cam_u, cam_v);
                  cam_last = now_ms();
                  break;
              }
          }
          static void vkey(int code, int down) {
              if (code < 0 || code >= KDSZ) return;
              if (kd[code] != (down ? 1 : 0)) { kd[code] = down ? 1 : 0; on_key(code, down); }
          }
          static void pulse(int code) {
              int i;
              vkey(code, 1);
              for (i = 0; i < 8; i++) if (pend[i].code == 0) { pend[i].code = code; pend[i].due = now_ms() + 45; return; }
              vkey(code, 0);
          }
          /* Analog gamepad kiri -> jari analog. Dipanggil saat sumbu berubah dan saat resync. */
          static void padjoy_update(void) {
              int i;
              double lx = pad_ax[ABS_X], ly = pad_ax[ABS_Y], l = sqrt(lx * lx + ly * ly);
              for (i = 0; i < nmap; i++) {
                  Map *m = &maps[i];
                  double u, w;
                  if (m->type != M_PADJOY) continue;
                  if (mode != 1 || l < 0.2) { m->down = 0; mup(m); continue; }
                  u = m->u + lx * m->r * vh / vw; w = m->v + ly * m->r;
                  m->down = 1;
                  if (m->slot < 0 && !mdown(m, m->u, m->v)) continue;
                  tmove(m->slot, u, w);
              }
          }
          static void pad_abs(Dev *d, int a, int raw) {
              double mid, half, v;
              if (a < 0 || a >= 24) return;
              mid = (d->amin[a] + d->amax[a]) / 2.0; half = (d->amax[a] - d->amin[a]) / 2.0;
              if (half < 1) half = 1;
              if (a == ABS_HAT0X) { vkey(11001, raw < 0); vkey(11002, raw > 0); return; }
              if (a == ABS_HAT0Y) { vkey(11003, raw < 0); vkey(11004, raw > 0); return; }
              if (a == d->ltr || a == d->rtr) {
                  v = (raw - d->amin[a]) / (double)(d->amax[a] - d->amin[a] > 0 ? d->amax[a] - d->amin[a] : 1);
                  vkey(a == d->ltr ? 11005 : 11006, v > 0.5);
                  return;
              }
              v = (raw - mid) / half;
              if (v > 1) v = 1; if (v < -1) v = -1;
              if (a == ABS_X || a == ABS_Y) pad_ax[a] = v;
              else if (a == d->rsx) pad_ax[3] = v;
              else if (a == d->rsy) pad_ax[4] = v;
              if (a == ABS_X || a == ABS_Y) padjoy_update();
          }
          static void pad_cam_tick(double dt) {
              int i;
              double rx = pad_ax[3], ry = pad_ax[4];
              for (i = 0; i < nmap; i++) {
                  Map *m = &maps[i];
                  if (m->type != M_PADCAM || mode != 1) continue;
                  if (fabs(rx) < 0.2 && fabs(ry) < 0.2) { mup(m); continue; }
                  if (m->slot < 0) {
                      pcam_u = m->u; pcam_v = m->v;
                      if (!mdown(m, pcam_u, pcam_v)) continue;
                  }
                  pcam_u += rx * m->r * dt * (sensx / 20.0);
                  pcam_v += ry * m->r * dt * (sensy / 20.0) * (vw / vh);
                  if (pcam_u < 0.04 || pcam_u > 0.96 || pcam_v < 0.04 || pcam_v > 0.96) mup(m);
                  else tmove(m->slot, pcam_u, pcam_v);
              }
          }
          /*
           * Setelah sesuatu mengangkat jari (ganti mode, kirim ulang config, mode kursor), pasang kembali jari untuk tombol/stik
           * yang MASIH ditahan, berdasarkan keadaan tombol nyata (kd[]). Tanpa ini analog "mati" sampai tombolnya ditekan ulang.
           */
          static void resync_all(void) {
              int i;
              if (mode != 1) return;
              for (i = 0; i < nmap; i++) {
                  Map *m = &maps[i];
                  if (m->type == M_JOY) {
                      joy_update(m);
                  } else if (m->type == M_TAP || m->type == M_RAPID) {
                      int k = m->key[0];
                      int held = k > 0 && k < KDSZ && kd[k];
                      if (!lockc && k == BTN_LEFT) held = 0;
                      m->down = held;
                      if (!held) mup(m);
                      else if (m->type == M_TAP) { if (m->slot < 0) mdown(m, m->u, m->v); }
                      else m->next = 0;
                  }
              }
              padjoy_update();
          }
          static void emit_ptr(void) {
              long n = now_ms();
              if (n - last_ptr >= 12) { printf("EV PTR %.4f %.4f\n", pu, pv); last_ptr = n; }
          }
          static void emit_ptr_now(void) { printf("EV PTR %.4f %.4f\n", pu, pv); last_ptr = now_ms(); }
          static void ptr_center(void) { pu = 0.5; pv = 0.5; }
          /*
           * Reset View (GGMP "Suspend Twice"): ketuk = jari kamera dilepas dan dipasang ulang + kursor berkedip di titik awal kamera.
           * Hanya kamera/kursor yang di-reset; analog dan tombol tap tetap berjalan. Pemicu ganda dalam 250 ms dianggap satu aksi.
           */
          static void ref_reset(void) {
              int d2;
              long n = now_ms();
              if (n - ref_last < 250) { dlog("REFRESH dup ignored"); return; }
              ref_last = n;
              release_cam(); cam_last = 0; mdx = 0; mdy = 0;
              ptr_center();
              if (mode == 1) for (d2 = 0; d2 < ndev; d2++) if (devs[d2].type == T_MOUSE) { grab_dev(&devs[d2], 0); grab_dev(&devs[d2], 1); }
              dlog("REFRESH");
              printf("EV BLINK 0.5000 0.5000\n");
          }
          /* Tahan: kursor muncul di tengah layar selama tombol ditahan, lepas = kembali ke mode kamera. */
          static void susp_start(void) {
              if (!lockc || susp) return;
              susp = 1; lockc = 0; release_cam(); ptr_center();
              dlog("SUSP start");
              printf("EV SUSP 1\n");
              emit_ptr_now();
          }
          static void susp_end(void) {
              if (!susp) return;
              susp = 0; lockc = 1; release_cam();
              dlog("SUSP end");
              printf("EV SUSP 0\n");
          }
          /* ---- uinput: tombol Back dan penerusan tombol Win ---- */
          static void uinput_open(void) {
              struct uinput_user_dev uud;
              int fd;
              if (ufd >= 0) return;
              fd = open("/dev/uinput", O_WRONLY | O_NONBLOCK);
              if (fd < 0) fd = open("/dev/input/uinput", O_WRONLY | O_NONBLOCK);
              if (fd < 0) { dlog("uinput unavailable errno=%d", errno); return; }
              ioctl(fd, UI_SET_EVBIT, EV_KEY);
              ioctl(fd, UI_SET_KEYBIT, KEY_BACK);
              ioctl(fd, UI_SET_KEYBIT, KEY_LEFTMETA);
              ioctl(fd, UI_SET_KEYBIT, KEY_RIGHTMETA);
              memset(&uud, 0, sizeof uud);
              snprintf(uud.name, UINPUT_MAX_NAME_SIZE, "OpenLauncher Virtual Keys");
              uud.id.bustype = BUS_VIRTUAL; uud.id.vendor = 0x1; uud.id.product = 0x1; uud.id.version = 1;
              if (write(fd, &uud, sizeof uud) != (ssize_t)sizeof uud || ioctl(fd, UI_DEV_CREATE) < 0) {
                  dlog("uinput create failed errno=%d", errno);
                  close(fd);
                  return;
              }
              ufd = fd;
              dlog("uinput ready");
          }
          static int ukey(int code, int val) {
              struct input_event e[2];
              ssize_t w;
              if (ufd < 0) return 0;
              memset(e, 0, sizeof e);
              e[0].type = EV_KEY; e[0].code = code; e[0].value = val;
              e[1].type = EV_SYN; e[1].code = SYN_REPORT;
              w = write(ufd, e, sizeof e);
              return w == (ssize_t)sizeof e;
          }
          static int is_back_key(int code) {
              int i;
              for (i = 0; i < back_n; i++) if (back_k[i] == code) return 1;
              return 0;
          }
          static void inject_back(void) {
              if (ukey(KEY_BACK, 1)) { ukey(KEY_BACK, 0); dlog("BACK uinput"); }
              else { dlog("BACK via host"); printf("EV HK back\n"); }
          }
          static int wheel_mapped(void) {
              int i;
              for (i = 0; i < nmap; i++) {
                  if ((maps[i].type == M_TAP || maps[i].type == M_RAPID) && (maps[i].key[0] == 10001 || maps[i].key[0] == 10002)) return 1;
              }
              return 0;
          }
          static void wheel_notch(int dir) {
              if (wh_s < 0) {
                  wh_s = slot_alloc();
                  if (wh_s < 0) return;
                  wh_u = pu; wh_v = pv; wh_cur = 0; wh_tgt = 0;
                  if (!tdown(wh_s, wh_u, wh_v)) { wh_s = -1; return; }
              }
              wh_tgt += dir > 0 ? 0.06 : -0.06; /* roda ke atas = jari turun = konten bergulir ke atas */
              wh_t = now_ms();
          }
          static void wheel_tick(long n) {
              if (wh_s < 0) return;
              if (fabs(wh_tgt - wh_cur) > 0.001) {
                  double d = wh_tgt - wh_cur, st = 0.025, vv;
                  if (d > st) d = st; else if (d < -st) d = -st;
                  wh_cur += d;
                  vv = wh_v + wh_cur;
                  if (vv < 0.02) vv = 0.02;
                  if (vv > 0.98) vv = 0.98;
                  tmove(wh_s, wh_u, vv);
                  wh_t = n;
              } else if (n - wh_t > 90) {
                  tup(wh_s); wh_s = -1;
              }
          }
          static void on_key(int code, int down) {
              int i, j;
              dlog("K %d %d m=%d", code, down, mode);
              if (cap) {
                  if (down) {
                      int dup = 0;
                      for (i = 0; i < cap_n; i++) if (cap_keys[i] == code) dup = 1;
                      if (!dup && cap_n < 8) cap_keys[cap_n++] = code;
                  } else if (cap_n > 0) {
                      printf("EV COMBO");
                      for (i = 0; i < cap_n; i++) printf("%c%d", i ? '+' : ' ', cap_keys[i]);
                      printf("\n");
                      cap = 0; cap_n = 0;
                  }
                  return;
              }
              if (down) {
                  for (i = 0; i < 4; i++) {
                      int all = hks[i].n > 0, has = 0;
                      for (j = 0; j < hks[i].n; j++) {
                          if (hks[i].k[j] == code) has = 1;
                          if (hks[i].k[j] >= KDSZ || !kd[hks[i].k[j]]) all = 0;
                      }
                      if (all && has) {
                          if (i == 3) {
                              susp = 0; lockc = !lockc; release_cam();
                              if (!lockc) ptr_center();
                              printf("EV PTRMODE %d\n", lockc);
                              if (!lockc) emit_ptr_now();
                              resync_all();
                          }
                          else if (i == 2) { if (mode == 1 && !ref_held) { ref_held = 1; ref_t = now_ms(); } }
                          else printf("EV HK %s\n", hk_name[i]);
                      }
                  }
                  if (mode == 1 && back_on && is_back_key(code)) inject_back();
              }
              if (!down && ref_held) {
                  for (j = 0; j < hks[2].n; j++) {
                      if (hks[2].k[j] == code) {
                          ref_held = 0;
                          if (susp) susp_end();
                          else if (now_ms() - ref_t < 300) ref_reset();
                          break;
                      }
                  }
              }
              if (mode != 1) return;
              if (!lockc && code == BTN_LEFT) {
                  if (down) pdown(pu, pv); else pup();
                  return;
              }
              for (i = 0; i < nmap; i++) {
                  Map *m = &maps[i];
                  if (m->type == M_JOY) {
                      for (j = 0; j < 4; j++) if (m->key[j] == code) { joy_update(m); break; }
                  } else if (m->type == M_TAP && m->key[0] == code) {
                      if (down) { m->down = 1; if (m->slot < 0) mdown(m, m->u, m->v); }
                      else { m->down = 0; mup(m); }
                  } else if (m->type == M_RAPID && m->key[0] == code) {
                      if (down) { m->down = 1; m->next = 0; }
                      else { m->down = 0; mup(m); }
                  }
              }
          }
          static void motion_flush(void) {
              if (mode != 1) { mdx = 0; mdy = 0; return; }
              if (!mdx && !mdy) return;
              if (lockc) {
                  double tn = (double)now_ms(), dt = last_mv ? tn - (double)last_mv : 8.0, g = 1.0;
                  if (dt < 1.0) dt = 1.0; if (dt > 50.0) dt = 50.0;
                  if (cacc > 0) g = 1.0 / (1.0 + (cacc / 100.0) * (sqrt((double)mdx * mdx + (double)mdy * mdy) / dt) * 0.2);
                  cam_apply(mdx * g, mdy * g);
              } else {
                  pu += mdx * psens * 0.1 / vw; pv += mdy * psens * 0.1 / vh;
                  if (pu < 0) pu = 0; if (pu > 1) pu = 1; if (pv < 0) pv = 0; if (pv > 1) pv = 1;
                  pmove(pu, pv);
                  emit_ptr();
              }
              mdx = 0; mdy = 0; last_mv = now_ms();
          }
          static void handle(Dev *d, struct input_event *e) {
              if (d->type == T_TOUCH) return;
              if (e->type == EV_KEY && e->code < NKEY) {
                  if (e->value == 2) return;
                  /* Tombol Win: bila tidak dipakai untuk Back, diteruskan ke Android lewat uinput (perilaku normal sistem). */
                  if (mode == 1 && d->type == T_KBD && (e->code == KEY_LEFTMETA || e->code == KEY_RIGHTMETA) && !(back_on && is_back_key(e->code))) {
                      uinput_open();
                      ukey(e->code, e->value ? 1 : 0);
                  }
                  kd[e->code] = e->value ? 1 : 0;
                  on_key(e->code, e->value ? 1 : 0);
              } else if (e->type == EV_ABS && d->type == T_PAD) {
                  pad_abs(d, e->code, e->value);
              } else if (e->type == EV_REL && d->type == T_MOUSE) {
                  if (e->code == REL_X) mdx += e->value;
                  else if (e->code == REL_Y) mdy += e->value;
                  else if (e->code == REL_WHEEL && e->value != 0) {
                      /* Kursor terbuka (Lock Cursor OFF) dan roda tidak dipetakan: scroll asli disuntik sebagai geseran jari. */
                      if (mode == 1 && !lockc && !wheel_mapped()) wheel_notch(e->value > 0 ? 1 : -1);
                      else pulse(e->value > 0 ? 10001 : 10002);
                  }
              } else if (e->type == EV_SYN && e->code == SYN_REPORT && d->type == T_MOUSE) {
                  if (mode != 1) { mdx = 0; mdy = 0; }
                  else if ((mdx || mdy) && now_ms() - last_mv >= 8) motion_flush();
              }
          }
          static double opt_size(char **tok, int n, int from, double def) {
              int i;
              for (i = from; i < n; i++) {
                  if (tok[i][0] == 's' && tok[i][1] == '=') {
                      double v = atof(tok[i] + 2);
                      if (v < 0.05) v = 0.05; if (v > 0.5) v = 0.5;
                      return v;
                  }
              }
              return def;
          }
          static void add_map(int type, double u, double v, double r, int k0, int k1, int k2, int k3) {
              Map *m; int q;
              if (nmap >= MAXMAP) return;
              m = &maps[nmap++];
              memset(m, 0, sizeof *m);
              m->type = type; m->u = u; m->v = v; m->r = r;
              m->key[0] = k0; m->key[1] = k1; m->key[2] = k2; m->key[3] = k3;
              m->slot = -1; /* slot sentuh dipilih saat jari turun */
              for (q = 0; q < 4; q++) if (m->key[q] < 0 || m->key[q] >= KDSZ) m->key[q] = 0;
          }
