                      MapStore.setCam(act, g.pkg, v / 10f, MapStore.camY(act, g.pkg))
                      MapperService.instance?.sendSens()
                  }, ui.lp(MATCH, WRAP, 10))
                  m.addView(slider(1000, (MapStore.camY(act, g.pkg) * 10f).toInt(), { v -> "camY: " + String.format(Locale.US, "%.1f", v / 10f) + " / 100.0" }) { v ->
                      MapStore.setCam(act, g.pkg, MapStore.camX(act, g.pkg), v / 10f)
                      MapperService.instance?.sendSens()
