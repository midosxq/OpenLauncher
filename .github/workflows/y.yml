          /** Intro 5 detik (app-startup.mp4 dari branding.zip). Jika tidak ada atau gagal diputar, langsung lanjut. */
          class IntroView(private val act: MainActivity, private val onDone: () -> Unit) : FrameLayout(act) {
              private var finished = false
              private val h = Handler(Looper.getMainLooper())
              private val guard = Runnable { done() }
              private var vv: VideoView? = null
              private var vidW = 0
              private var vidH = 0

              /** Fit: seluruh video terlihat, rasio asli terjaga, sisa ruang tetap hitam. Tidak stretch, tidak crop. */
              private fun fit() {
                  val v = vv ?: return
                  if (vidW <= 0 || vidH <= 0 || width <= 0 || height <= 0) return
                  val s = minOf(width.toFloat() / vidW, height.toFloat() / vidH)
                  val lp = FrameLayout.LayoutParams(maxOf(1, (vidW * s).toInt()), maxOf(1, (vidH * s).toInt()))
                  lp.gravity = Gravity.CENTER
                  v.layoutParams = lp
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  super.onSizeChanged(w, h, ow, oh)
                  fit()
              }

              private fun done() {
                  if (finished) return
                  finished = true
                  h.removeCallbacks(guard)
                  onDone()
              }

              init {
                  setBackgroundColor(Pal.BG)
                  val resId = act.resources.getIdentifier("app_startup", "raw", act.packageName)
                  if (resId == 0) {
                      post { done() }
                  } else {
                      val v = VideoView(act)
                      vv = v
                      v.setVideoURI(Uri.parse("android.resource://" + act.packageName + "/" + resId))
                      v.setOnPreparedListener { mp ->
                          mp.isLooping = false
                          mp.setVideoScalingMode(android.media.MediaPlayer.VIDEO_SCALING_MODE_SCALE_TO_FIT)
                          vidW = mp.videoWidth
                          vidH = mp.videoHeight
                          fit()
                          v.start()
                      }
                      v.setOnCompletionListener { done() }
                      v.setOnErrorListener { _, _, _ -> done(); true }
                      val lp = FrameLayout.LayoutParams(MATCH, MATCH)
                      lp.gravity = Gravity.CENTER
                      addView(v, lp)
                      h.postDelayed(guard, 6500)
                  }
              }

              override fun onDetachedFromWindow() {
                  h.removeCallbacks(guard)
                  super.onDetachedFromWindow()
              }
          }

