                      c.addView(ui.tv(L.s("No games in the library yet", "Belum ada game di pustaka"), 15f, Pal.AMBER, true))
                      c.addView(ui.line(L.s("Add a game in Game Library first.", "Tambahkan game di Pustaka Game dulu."), Pal.TEXT, 13f, 8))
                      col.addView(c, ui.lp(MATCH, WRAP, 16))
                  } else {
                      val hs = HorizontalScrollView(act)
                      hs.isHorizontalScrollBarEnabled = false
                      val chips = LinearLayout(act)
                      chips.orientation = LinearLayout.HORIZONTAL
                      for (g in games) {
                          chips.addView(ui.pill(g.label, sel?.pkg == g.pkg) {
                              sel = g
                              act.selectedGame = g
                              build()
                          }, ui.lp(WRAP, WRAP, 0, 8))
                      }
                      hs.addView(chips)
                      col.addView(hs, ui.lp(MATCH, WRAP, 14))
                      val g = sel
                      if (g != null) addGame(col, g)
                  }
                  sv.addView(col)
                  root.addView(sv, FrameLayout.LayoutParams(MATCH, MATCH))
