          cat > 'app/src/main/java/com/midosxq/oplx/Dif.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.content.Context
          import android.hardware.input.InputManager
          import android.view.Gravity
          import android.view.InputDevice
          import android.view.MotionEvent
          import android.view.View
          import android.widget.LinearLayout
          import android.widget.TextView

          /**
           * Dynamic Input Footer (DIF): petunjuk input global di kanan bawah.
           * - Selalu tampil selama layar utama aktif. Tidak pernah disembunyikan; sentuhan layar tidak mengubah atau menutupnya.
           * - Isinya mengikuti perangkat input yang terakhir dipakai: keyboard/mouse, gamepad PlayStation, gamepad Xbox/umum, atau sentuh.
           * - Hanya menampilkan aksi yang benar-benar bekerja di launcher (Navigate, Select, Back).
           */
          class DynamicInputFooter(ctx: Context) : LinearLayout(ctx) {
              enum class Mode { TOUCH, KBM, XBOX, PLAYSTATION }

              private val ui = Ui(ctx)
              private var mode: Mode? = null

              init {
                  orientation = HORIZONTAL
                  gravity = Gravity.CENTER_VERTICAL
                  background = rounded(0xE6000000.toInt(), 10f, ui.dens, Pal.SEP, 1f)
                  setPadding(ui.dp(12), ui.dp(7), ui.dp(12), ui.dp(7))
                  // Murni informasi: tidak menerima sentuhan dan tidak mengambil fokus navigasi.
                  isClickable = false
                  isFocusable = false
                  setMode(initialMode(ctx))
              }

              private fun initialMode(ctx: Context): Mode {
                  val im = ctx.getSystemService(Context.INPUT_SERVICE) as InputManager
                  var kbm = false
                  for (id in im.inputDeviceIds) {
                      val d = im.getInputDevice(id) ?: continue
                      if (d.isVirtual) continue
                      val m = modeOf(d)
                      if (m == Mode.PLAYSTATION || m == Mode.XBOX) return m
                      if (m == Mode.KBM) kbm = true
                  }
                  return if (kbm) Mode.KBM else Mode.TOUCH
              }

              /** Mode untuk satu perangkat; null bila perangkat itu bukan sumber yang mengubah mode (mis. layar sentuh). */
              private fun modeOf(d: InputDevice): Mode? {
                  val s = d.sources
                  val pad = (s and InputDevice.SOURCE_GAMEPAD) == InputDevice.SOURCE_GAMEPAD ||
                      (s and InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK
                  if (pad) return if (isSony(d)) Mode.PLAYSTATION else Mode.XBOX
                  if ((s and InputDevice.SOURCE_MOUSE) == InputDevice.SOURCE_MOUSE) return Mode.KBM
                  if ((s and InputDevice.SOURCE_KEYBOARD) == InputDevice.SOURCE_KEYBOARD && d.keyboardType == InputDevice.KEYBOARD_TYPE_ALPHABETIC) return Mode.KBM
                  return null
              }

              private fun isSony(d: InputDevice): Boolean {
                  if (d.vendorId == 0x054c) return true
                  val n = d.name.lowercase()
                  return n.contains("dualshock") || n.contains("dualsense") || n.contains("playstation")
              }

              /** Dipanggil dari dispatchKeyEvent. */
              fun onKey(d: InputDevice?) {
                  val m = if (d == null) null else modeOf(d)
                  if (m != null) setMode(m)
              }

              /** Dipanggil dari dispatchGenericMotionEvent: hover mouse, atau stik gamepad yang benar-benar digerakkan. */
              fun onMotion(ev: MotionEvent) {
                  val d = ev.device ?: return
                  if ((ev.source and InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK) {
                      // Abaikan drift stik saat diam supaya mode tidak bolak-balik.
                      val axes = intArrayOf(MotionEvent.AXIS_X, MotionEvent.AXIS_Y, MotionEvent.AXIS_Z, MotionEvent.AXIS_RZ, MotionEvent.AXIS_HAT_X, MotionEvent.AXIS_HAT_Y)
                      var moved = false
                      for (a in axes) if (Math.abs(ev.getAxisValue(a)) > 0.35f) moved = true
                      if (!moved) return
                  }
                  val m = modeOf(d)
                  if (m != null) setMode(m)
              }

              /** Dipanggil dari dispatchTouchEvent. Sentuhan layar diabaikan; hanya klik mouse yang mengubah mode. */
              fun onTouch(ev: MotionEvent) {
                  if (ev.pointerCount > 0 && ev.getToolType(0) == MotionEvent.TOOL_TYPE_MOUSE) setMode(Mode.KBM)
              }

              private fun setMode(m: Mode) {
                  if (m == mode) return
                  mode = m
                  removeAllViews()
                  when (m) {
                      Mode.TOUCH -> {
                          item(key("Tap"), L.s("Select", "Pilih"))
                      }
                      Mode.KBM -> {
                          item(key("←↑↓→"), L.s("Navigate", "Navigasi"))
                          item(key("Enter"), L.s("Select", "Pilih"))
                          item(key("Esc"), L.s("Back", "Kembali"))
                      }
                      Mode.XBOX -> {
                          item(key("D-pad"), L.s("Navigate", "Navigasi"))
                          item(badge("A"), L.s("Select", "Pilih"))
                          item(badge("B"), L.s("Back", "Kembali"))
                      }
                      Mode.PLAYSTATION -> {
                          item(key("D-pad"), L.s("Navigate", "Navigasi"))
                          item(badge("✕"), L.s("Select", "Pilih"))
                          item(badge("○"), L.s("Back", "Kembali"))
                      }
                  }
              }

              private fun item(glyph: View, label: String) {
                  val first = childCount == 0
                  addView(glyph, ui.lp(WRAP, WRAP, 0, if (first) 0 else 14))
                  val t = ui.tv(label, 12f, Pal.TEXT)
                  addView(t, ui.lp(WRAP, WRAP, 0, 6))
              }

              private fun key(text: String): TextView {
                  val t = ui.tv(text, 11f, Pal.PURPLE_LIGHT, true)
                  t.gravity = Gravity.CENTER
                  t.setPadding(ui.dp(7), ui.dp(2), ui.dp(7), ui.dp(2))
                  t.background = rounded(0, 5f, ui.dens, Pal.PURPLE, 1f)
                  return t
              }

              private fun badge(text: String): TextView {
                  val t = ui.tv(text, 12f, Pal.TEXT, true)
                  t.gravity = Gravity.CENTER
                  t.minWidth = ui.dp(24)
                  t.minHeight = ui.dp(24)
                  t.background = rounded(0, 12f, ui.dens, Pal.PURPLE, 1.5f)
                  return t
              }
          }
