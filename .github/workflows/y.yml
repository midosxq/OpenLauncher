                      slider(39, (MapStore.crazyHz(act, g.pkg) - 1f).toInt(), { v -> L.s("Crazy Tap rate: ", "Kecepatan Crazy Tap: ") + (v + 1) + L.s(" taps/s (applies to newly added Crazy Taps)", " tap/dtk (untuk Crazy Tap yang baru ditambah)") }) { v ->
                          MapStore.setCrazyHz(act, g.pkg, (v + 1).toFloat())
