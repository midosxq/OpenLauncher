              private fun setLanguage(code: String) {
                  if (L.lang == code) return
                  L.set(this, code)
                  recreate()
              }

              private fun colorRow(current: Int, onPick: (Int) -> Unit): View {
                  val r = LinearLayout(this)
                  r.orientation = LinearLayout.HORIZONTAL
                  for ((i, pr) in Theme.presets.withIndex()) {
                      val dot = android.widget.TextView(this)
                      dot.text = if (pr.second == current) "\u2713" else ""
                      dot.setTextColor(Color.WHITE)
                      dot.gravity = Gravity.CENTER
                      val g = android.graphics.drawable.GradientDrawable()
                      g.shape = android.graphics.drawable.GradientDrawable.OVAL
                      g.setColor(pr.second)
                      g.setStroke(maxOf(1, ui.dp(1)), Color.WHITE)
                      dot.background = g
                      dot.setOnClickListener { onPick(pr.second) }
                      r.addView(dot, ui.lp(ui.dp(32), ui.dp(32), 0, if (i == 0) 0 else 8))
                  }
                  return r
              }

              private fun themeCard(): View {
                  val c = ui.card()
                  c.addView(ui.tv(L.s("Appearance", "Tampilan"), 15f, Pal.PURPLE_LIGHT, true))
                  c.addView(ui.line(L.s("Accent color (buttons, borders, highlights)", "Warna aksen (tombol, border, sorotan)"), Pal.MUTED, 12f, 8))
                  c.addView(colorRow(Theme.accent) { Theme.setAccent(this, it); recreate() }, ui.lp(WRAP, WRAP, 8))
                  c.addView(ui.line(L.s("Purple Wave color (separate from accent)", "Warna Purple Wave (terpisah dari aksen)"), Pal.MUTED, 12f, 14))
                  c.addView(colorRow(Theme.wave) { Theme.setWave(this, it); recreate() }, ui.lp(WRAP, WRAP, 8))
                  c.addView(ui.line(L.s("Panel transparency", "Transparansi panel"), Pal.MUTED, 12f, 14))
                  val sb = android.widget.SeekBar(this)
                  sb.max = 175
                  sb.progress = 255 - Theme.panelAlpha
                  sb.setOnSeekBarChangeListener(object : android.widget.SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: android.widget.SeekBar?, v: Int, fromUser: Boolean) {}
                      override fun onStartTrackingTouch(s: android.widget.SeekBar?) {}
                      override fun onStopTrackingTouch(s: android.widget.SeekBar?) {
                          Theme.setPanelAlpha(this@MainActivity, 255 - (s?.progress ?: 0))
