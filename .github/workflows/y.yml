                  t.isFocusable = true
                  val base = if (filled) Pal.PURPLE else 0
                  val sld = StateListDrawable()
                  sld.addState(intArrayOf(android.R.attr.state_pressed), rounded(base, 8f, dens, Pal.PURPLE_LIGHT, 2f))
                  sld.addState(intArrayOf(android.R.attr.state_hovered), rounded(base, 8f, dens, Pal.PURPLE_LIGHT, 2f))
                  sld.addState(intArrayOf(android.R.attr.state_focused), rounded(base, 8f, dens, Pal.PURPLE_LIGHT, 2f))
                  sld.addState(intArrayOf(), rounded(base, 8f, dens, Pal.BORDER, 1f))
                  t.background = sld
                  t.setOnClickListener { onClick() }
                  return t
              }
          }

          /** Kartu cover 16:9. Gambar di-crop hanya di lapisan tampilan; file asli tidak diubah. */
