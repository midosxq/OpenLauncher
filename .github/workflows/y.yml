              /** Tangkap kombinasi tombol fisik lewat KeyEvent (scancode = kode evdev). Tidak butuh root. */
              private fun captureKeys(title: String, cb: (String) -> Unit) {
                  val keys = ArrayList<Int>()
                  val tv = ui.tv(L.s("Press the key combination now...", "Tekan kombinasi tombol sekarang..."), 15f, Pal.TEXT)
                  tv.setPadding(ui.dp(24), ui.dp(20), ui.dp(24), ui.dp(20))
                  val dlg = AlertDialog.Builder(act).setTitle(title).setView(tv).setNegativeButton(L.s("Cancel", "Batal"), null).create()
                  dlg.setOnKeyListener { d, code, ev ->
                      if (code == KeyEvent.KEYCODE_BACK) {
                          false
                      } else {
                          if (ev.action == KeyEvent.ACTION_DOWN && ev.repeatCount == 0) {
                              if (ev.scanCode > 0 && !keys.contains(ev.scanCode)) keys.add(ev.scanCode)
                              tv.text = Keys.combo(keys.joinToString(","))
                          } else if (ev.action == KeyEvent.ACTION_UP && keys.isNotEmpty()) {
                              val s = keys.joinToString(",")
                              d.dismiss()
                              cb(s)
                          }
                          true
                      }
                  }
                  dlg.show()
              }

              private fun exportKeymap(g: GameEntry) {
                  pendingExport = g
                  val clean = g.label.replace(Regex("[^A-Za-z0-9]"), "")
                  val i = Intent(Intent.ACTION_CREATE_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "application/octet-stream"
                  i.putExtra(Intent.EXTRA_TITLE, "OpenLauncher(" + clean + "Keymap).xpp")
                  try { act.startActivityForResult(i, 41) } catch (e: Exception) {
                      Toast.makeText(act, L.s("No file picker found", "Pemilih file tidak ditemukan"), Toast.LENGTH_LONG).show()
                  }
              }

              fun onExportPicked(uri: Uri) {
                  val g = pendingExport ?: return
                  try {
                      val text = MapStore.export(act, g.pkg, g.label)
                      val os = act.contentResolver.openOutputStream(uri)
                      if (os == null) throw Exception("no stream")
                      os.use { it.write(text.toByteArray(Charsets.UTF_8)) }
                      Toast.makeText(act, L.s("Keymap exported", "Keymap diekspor"), Toast.LENGTH_LONG).show()
                  } catch (e: Exception) {
                      Toast.makeText(act, L.s("Export failed: ", "Ekspor gagal: ") + e.message, Toast.LENGTH_LONG).show()
                  }
              }

              private fun importKeymap(g: GameEntry) {
                  pendingImport = g
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "*/*"
                  try { act.startActivityForResult(i, 42) } catch (e: Exception) {
                      Toast.makeText(act, L.s("No file picker found", "Pemilih file tidak ditemukan"), Toast.LENGTH_LONG).show()
                  }
              }

              fun onImportPicked(uri: Uri) {
                  val g = pendingImport ?: return
                  val text = try {
                      val ins = act.contentResolver.openInputStream(uri)
                      if (ins == null) null else ins.use { String(it.readBytes().take(1024 * 1024).toByteArray(), Charsets.UTF_8) }
                  } catch (e: Exception) {
                      null
                  }
                  val p = if (text == null) null else MapStore.parse(text)
                  if (p == null) {
                      Toast.makeText(act, L.s("This is not a valid OpenLauncher keymap file.", "Ini bukan file keymap OpenLauncher yang valid."), Toast.LENGTH_LONG).show()
                      return
                  }
                  if (p.pkg != g.pkg) {
                      AlertDialog.Builder(act)
                          .setTitle(L.s("Import blocked", "Impor diblokir"))
                          .setMessage(L.s("This keymap is for ", "Keymap ini untuk ") + p.pkg + L.s(", not ", ", bukan ") + g.pkg + ".")
                          .setPositiveButton("OK", null)
                          .show()
                      return
                  }
                  val n = p.maps.split("\n").count { it.isNotBlank() }
                  AlertDialog.Builder(act)
                      .setTitle(L.s("Replace keymap?", "Ganti keymap?"))
                      .setMessage(
                          g.label + "\n" + n + L.s(" mappings, camX ", " pemetaan, camX ") + String.format(Locale.US, "%.1f", p.camX) +
                              ", camY " + String.format(Locale.US, "%.1f", p.camY) + "\n" + L.s("A backup of the current keymap is saved first.", "Cadangan keymap saat ini disimpan lebih dulu.")
                      )
                      .setPositiveButton(L.s("Replace", "Ganti")) { _, _ ->
                          MapStore.apply(act, p)
                          MapperService.instance?.sendConfig()
                          build()
                      }
                      .setNegativeButton(L.s("Cancel", "Batal"), null)
                      .show()
              }
          }
