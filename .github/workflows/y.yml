                      for (j = 0; j < hks[i].n; j++) {
                          if (hks[i].k[j] == code) has = 1;
                          if (hks[i].k[j] >= KDSZ || !kd[hks[i].k[j]]) all = 0;
                      }
                      if (all && has) {
                          if (i == 3) { lockc = !lockc; release_all(); printf("EV PTRMODE %d\n", lockc); }
                          else if (i == 2) {
                              int d2;
