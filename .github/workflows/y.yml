          }
          static void command(char *line) {
              char *tok[16]; int n = 0, i;
              char *p = strtok(line, " \r\n");
              while (p && n < 16) { tok[n++] = p; p = strtok(NULL, " \r\n"); }
              if (n == 0) return;
              if (!strcmp(tok[0], "CLR")) { release_all(); nmap = 0; }
              else if (!strcmp(tok[0], "JOY") && n >= 8) add_map(M_JOY, atof(tok[1]), atof(tok[2]), atof(tok[3]), atoi(tok[4]), atoi(tok[5]), atoi(tok[6]), atoi(tok[7]));
              else if (!strcmp(tok[0], "CAM") && n >= 3) add_map(M_CAM, atof(tok[1]), atof(tok[2]), opt_size(tok, n, 3, CAM_DEF_R), 0, 0, 0, 0);
              else if (!strcmp(tok[0], "TAP") && n >= 4) add_map(M_TAP, atof(tok[2]), atof(tok[3]), 0, atoi(tok[1]), 0, 0, 0);
              else if (!strcmp(tok[0], "RAPID") && n >= 5) {
                  int b4 = nmap;
                  add_map(M_RAPID, atof(tok[2]), atof(tok[3]), atof(tok[4]), atoi(tok[1]), 0, 0, 0);
                  if (nmap > b4 && n >= 6 && tok[5][0] != 's') maps[nmap - 1].hold = atoi(tok[5]);
              }
              else if (!strcmp(tok[0], "PADJOY") && n >= 4) add_map(M_PADJOY, atof(tok[1]), atof(tok[2]), atof(tok[3]), 0, 0, 0, 0);
              else if (!strcmp(tok[0], "PADCAM") && n >= 4) add_map(M_PADCAM, atof(tok[1]), atof(tok[2]), atof(tok[3]), 0, 0, 0, 0);
              else if (!strcmp(tok[0], "PSENS") && n >= 2) { psens = atof(tok[1]); if (psens < 0) psens = 0; if (psens > 100) psens = 100; }
              else if (!strcmp(tok[0], "CACC") && n >= 2) { cacc = atof(tok[1]); if (cacc < 0) cacc = 0; if (cacc > 100) cacc = 100; }
              else if (!strcmp(tok[0], "SENS") && n >= 3) { sensx = atof(tok[1]); sensy = atof(tok[2]); if (sensx < 0) sensx = 0; if (sensy < 0) sensy = 0; if (sensx > 100) sensx = 100; if (sensy > 100) sensy = 100; }
              else if (!strcmp(tok[0], "LOCK") && n >= 2) {
                  susp = 0; lockc = atoi(tok[1]) ? 1 : 0; release_cam();
                  if (!lockc) ptr_center();
                  /* LOCK adalah baris terakhir config: pasang ulang jari untuk tombol yang masih ditahan (CLR mengangkat semuanya). */
                  resync_all();
              }
              else if (!strcmp(tok[0], "HK") && n >= 2) {
                  int h = !strcmp(tok[1], "edit") ? 0 : !strcmp(tok[1], "tog") ? 1 : !strcmp(tok[1], "ref") ? 2 : !strcmp(tok[1], "ptr") ? 3 : -1;
                  if (h >= 0) { hks[h].n = 0; for (i = 2; i < n && hks[h].n < 6; i++) hks[h].k[hks[h].n++] = atoi(tok[i]); }
              }
              else if (!strcmp(tok[0], "BACK") && n >= 2) {
                  back_on = atoi(tok[1]) ? 1 : 0;
                  back_n = 0;
                  for (i = 2; i < n && back_n < 4; i++) back_k[back_n++] = atoi(tok[i]);
                  if (back_on) uinput_open();
                  dlog("BACK cfg on=%d n=%d", back_on, back_n);
              }
              else if (!strcmp(tok[0], "VIEW") && n >= 4) {
                  rot = atoi(tok[1]) & 3; vw = atof(tok[2]); vh = atof(tok[3]); if (vw < 1) vw = 1; if (vh < 1) vh = 1;
                  if (n >= 6) { pw_r = atof(tok[4]); ph_r = atof(tok[5]); } else { pw_r = 0; ph_r = 0; }
                  dlog("VIEW rot=%d %.0fx%.0f phys=%.0fx%.0f", rot, vw, vh, pw_r, ph_r);
              }
              else if (!strcmp(tok[0], "FRAME") && n >= 2) {
                  if (n >= 7 && atof(tok[3]) > atof(tok[1]) && atof(tok[4]) > atof(tok[2]) && atof(tok[5]) > 0 && atof(tok[6]) > 0) {
                      fr_l = atof(tok[1]); fr_t = atof(tok[2]); fr_r = atof(tok[3]); fr_b = atof(tok[4]); fr_dw = atof(tok[5]); fr_dh = atof(tok[6]);
                      frame_ok = 1;
                  } else frame_ok = 0;
                  dlog("FRAME ok=%d", frame_ok);
              }
              else if (!strcmp(tok[0], "MODE") && n >= 2) set_mode(tok[1][0] == 'G' ? 1 : tok[1][0] == 'T' ? 2 : 0);
              else if (!strcmp(tok[0], "REFRESH")) {
                  ref_reset();
              }
              else if (!strcmp(tok[0], "DIAG")) dump_diag();
              else if (!strcmp(tok[0], "CAP")) { cap = 1; cap_n = 0; }
              else if (!strcmp(tok[0], "QUIT")) { set_mode(0); exit(0); }
              fflush(stdout);
          }
          static void tick(void) {
              long n = now_ms();
              int i;
              double dt = last_tick ? (n - last_tick) / 1000.0 : 0.02;
              last_tick = n;
              if (dt > 0.1) dt = 0.1;
              if ((mdx || mdy) && n - last_mv >= 8) motion_flush();
              if (ref_held && !susp && mode == 1 && n - ref_t >= 300) susp_start();
              for (i = 0; i < 8; i++) if (pend[i].code && n >= pend[i].due) { int c = pend[i].code; pend[i].code = 0; vkey(c, 0); }
              for (i = 0; i < nmap; i++) {
                  Map *m = &maps[i];
                  if (mode != 1) break;
                  if (m->type == M_RAPID && m->down && n >= m->next) {
                      double hz = m->r < 1 ? 1 : (m->r > 40 ? 40 : m->r);
                      long period = (long)(1000.0 / hz), hold = m->hold >= 5 ? m->hold : 25;
                      if (period < hold + 10) period = hold + 10;
                      if (m->slot < 0) { if (mdown(m, m->u, m->v)) m->next = n + hold; else m->next = n + 20; }
                      else { mup(m); m->next = n + (period - hold); }
                  }
                  /* tombol tap yang tadinya tidak kebagian slot: coba lagi selama masih ditahan, tanpa kehilangan penekanan */
                  if (m->type == M_TAP && m->down && m->slot < 0) mdown(m, m->u, m->v);
              }
              pad_cam_tick(dt);
              wheel_tick(n);
          }
          static int need_fast(void) {
              int i;
              if (mdx || mdy) return 1;
              if (ref_held && !susp) return 1;
              if (wh_s >= 0) return 1;
              for (i = 0; i < 8; i++) if (pend[i].code) return 1;
              for (i = 0; i < nmap; i++) {
                  if (maps[i].type == M_RAPID && maps[i].down) return 1;
                  if (maps[i].type == M_TAP && maps[i].down && maps[i].slot < 0) return 1;
                  if (maps[i].type == M_PADCAM && maps[i].slot >= 0) return 1;
                  if (maps[i].type == M_PADCAM && (fabs(pad_ax[3]) >= 0.2 || fabs(pad_ax[4]) >= 0.2)) return 1;
              }
              return 0;
          }
          int main(void) {
              char ibuf[4096]; int ilen = 0; long last_scan = 0;
              signal(SIGPIPE, SIG_IGN);
              setvbuf(stdout, NULL, _IOLBF, 0);
              printf("EV READY\n");
              scan(); last_scan = now_ms();
              for (;;) {
                  struct pollfd p[MAXDEV + 1];
                  int i, n = 0, to;
                  p[n].fd = 0; p[n].events = POLLIN; n++;
                  for (i = 0; i < ndev; i++) { p[n].fd = devs[i].fd; p[n].events = POLLIN; n++; }
                  to = need_fast() ? 16 : 500;
                  if (poll(p, n, to) < 0 && errno != EINTR) break;
                  if (p[0].revents & (POLLIN | POLLHUP)) {
                      int r = read(0, ibuf + ilen, sizeof(ibuf) - ilen - 1);
                      if (r <= 0) break;
                      ilen += r; ibuf[ilen] = 0;
                      for (;;) {
                          char *nl = memchr(ibuf, '\n', ilen); int ll;
                          if (!nl) break;
                          *nl = 0; command(ibuf);
                          ll = (int)(nl - ibuf) + 1;
                          memmove(ibuf, ibuf + ll, ilen - ll); ilen -= ll;
                      }
                      if (ilen >= (int)sizeof(ibuf) - 1) ilen = 0;
                  }
                  for (i = 1; i < n; i++) {
                      if (p[i].revents & (POLLIN | POLLERR | POLLHUP)) {
                          struct input_event evs[64];
                          int r = read(p[i].fd, evs, sizeof evs), k;
                          if (r < 0 && errno != EAGAIN) { remove_dev(i - 1); break; }
                          if (r > 0) for (k = 0; k < r / (int)sizeof(evs[0]); k++) handle(&devs[i - 1], &evs[k]);
                      }
                  }
                  tick();
                  if (now_ms() - last_scan > 1000) { scan(); last_scan = now_ms(); }
              }
              set_mode(0);
              return 0;
          }
