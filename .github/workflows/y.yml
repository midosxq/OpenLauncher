                          "Needs on-device testing: input reading and touch injection, gamepad axes, typing detection, and the intro on your device.",
                          "Perlu diuji di perangkat: pembacaan input dan penyuntikan sentuhan, sumbu gamepad, deteksi mengetik, dan intro di perangkat kamu."
                      ),
                      L.s(
                          "Not built yet: Highlights (recorder), custom cursor import, Shizuku/ADB mapper routes, UI Sound.",
                          "Belum ada: Highlights (perekam), impor cursor kustom, jalur mapper Shizuku/ADB, UI Sound."
                      )
                  )
                  for (l in lines) c.addView(ui.line(l, Pal.TEXT, 13f, 8))
                  return c
              }
          }
