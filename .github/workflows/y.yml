          cat > 'app/src/main/java/com/midosxq/oplx/LibraryView.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ArrayAdapter
          import android.widget.BaseAdapter
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.GridView
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.PopupMenu
          import android.widget.ScrollView
          import android.widget.Toast
          import java.io.File
          import java.text.DateFormat
          import java.util.Date

          class LibraryView(private val act: MainActivity) {
              private val ui = Ui(act)
              private val store = Store(act)
              private val root = FrameLayout(act)
              private var games: List<GameEntry> = emptyList()
              private var loaded = false
              private var loading = false
              private var detail: GameEntry? = null

              fun view(): View {
                  if (!loaded && !loading) refresh()
                  return root
              }

              fun back(): Boolean {
                  if (detail != null) {
                      detail = null
                      showGrid()
                      return true
                  }
                  return false
              }

              fun refresh() {
                  loading = true
                  root.removeAllViews()
                  val t = ui.tv(L.s("Loading games...", "Memuat daftar game..."), 15f, Pal.MUTED)
                  t.setPadding(ui.dp(36), ui.dp(30), ui.dp(36), 0)
                  root.addView(t)
                  Thread {
                      val g = detect()
                      act.runOnUiThread {
                          games = g
                          loaded = true
                          loading = false
                          detail = null
                          showGrid()
                      }
                  }.start()
              }

              private fun detect(): List<GameEntry> = Games.detect(act)

              private fun showGrid() {
                  root.removeAllViews()
                  val col = LinearLayout(act)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(ui.dp(32), ui.dp(24), ui.dp(32), 0)

                  val head = LinearLayout(act)
                  head.orientation = LinearLayout.HORIZONTAL
                  head.gravity = Gravity.CENTER_VERTICAL
                  head.addView(ui.tv(L.s("Game Library", "Pustaka Game"), 28f, Pal.TEXT, true), LinearLayout.LayoutParams(0, WRAP, 1f))
                  head.addView(ui.pill(L.s("Refresh", "Segarkan"), false) { refresh() }, ui.lp(WRAP, WRAP))
                  head.addView(ui.pill(L.s("Add Manually", "Tambah Manual"), true) { addManually() }, ui.lp(WRAP, WRAP, 0, 10))
                  col.addView(head)

                  val hiddenCount = store.hidden().size
                  if (hiddenCount > 0) {
                      val h = ui.tv(
                          hiddenCount.toString() + L.s(" games hidden. Tap to show them again.", " game disembunyikan. Ketuk untuk menampilkan lagi."),
                          12f, Pal.PURPLE_LIGHT
                      )
                      h.isClickable = true
                      h.setOnClickListener {
                          store.clearHidden()
                          refresh()
                      }
                      col.addView(h, ui.lp(WRAP, WRAP, 6))
                  }
                  col.addView(ui.tv(games.size.toString() + L.s(" games", " game"), 12f, Pal.MUTED), ui.lp(WRAP, WRAP, 4))

                  if (games.isEmpty()) {
                      val c = ui.card()
                      c.addView(ui.tv(L.s("No games detected yet", "Belum ada game terdeteksi"), 15f, Pal.AMBER, true))
                      c.addView(
                          ui.line(
                              L.s(
                                  "Android only lets apps be marked as games if they declare it. Use Add Manually to add any app.",
                                  "Android hanya menandai app sebagai game bila app itu mendeklarasikannya. Gunakan Tambah Manual untuk menambahkan app apa pun."
                              ), Pal.TEXT, 13f, 8
                          )
                      )
                      col.addView(c, ui.lp(MATCH, WRAP, 16))
                  } else {
                      val grid = GridView(act)
                      grid.numColumns = GridView.AUTO_FIT
                      grid.columnWidth = ui.dp(220)
                      grid.stretchMode = GridView.STRETCH_COLUMN_WIDTH
                      grid.horizontalSpacing = ui.dp(16)
                      grid.verticalSpacing = ui.dp(16)
                      grid.isVerticalScrollBarEnabled = false
                      grid.setPadding(0, ui.dp(14), 0, ui.dp(24))
                      grid.clipToPadding = false
                      grid.setDrawSelectorOnTop(true)
                      grid.selector = rounded(0, 10f, ui.dens, Pal.PURPLE, 2f)
                      grid.adapter = object : BaseAdapter() {
                          override fun getCount(): Int = games.size
                          override fun getItem(position: Int): Any = games[position]
                          override fun getItemId(position: Int): Long = position.toLong()
                          override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                              val card = (convertView as? GameCard) ?: GameCard(act, ui, store)
                              card.bind(games[position], 480, true)
                              return card
                          }
                      }
                      grid.setOnItemClickListener { _, _, pos, _ -> showDetail(games[pos]) }
                      col.addView(grid, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  }
                  root.addView(col, FrameLayout.LayoutParams(MATCH, MATCH))
              }

              private fun typeName(t: String): String =
                  if (t == "mapper") L.s("Launch with Mapper Services", "Luncurkan dengan Mapper Services")
                  else L.s("Launch Only", "Luncurkan Saja")

              /** Halaman game bergaya Steam: hero art, bar aksi dengan tombol PLAY di kiri, lalu info. */
              private fun showDetail(g: GameEntry) {
                  detail = g
                  root.removeAllViews()
                  val sv = ScrollView(act)
                  val col = LinearLayout(act)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(ui.dp(32), ui.dp(18), ui.dp(32), ui.dp(28))

                  // Baris atas: kembali, judul, package
                  val top = LinearLayout(act)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.gravity = Gravity.CENTER_VERTICAL
                  top.addView(ui.pill("<  " + L.s("Library", "Pustaka"), false) { back() }, ui.lp(WRAP, WRAP))
                  top.addView(ui.tv(g.label, 20f, Pal.TEXT, true), ui.lp(WRAP, WRAP, 0, 14))
                  val sp = View(act)
                  top.addView(sp, LinearLayout.LayoutParams(0, 1, 1f))
                  val pk = ui.tv(g.pkg, 11f, Pal.MUTED)
                  pk.typeface = Typeface.MONOSPACE
                  top.addView(pk)
                  col.addView(top)

                  // Hero art lebar (di-crop hanya saat tampil, tidak diregangkan)
                  val hero = GameCard(act, ui, store, 7f / 16f)
                  hero.bind(g, 960, false)
                  col.addView(hero, ui.lp(MATCH, WRAP, 14))

                  // Bar aksi
                  val bar = LinearLayout(act)
                  bar.orientation = LinearLayout.HORIZONTAL
                  bar.gravity = Gravity.CENTER_VERTICAL
                  bar.background = rounded(Pal.BG, 10f, ui.dens, Pal.BORDER, 1f)
                  bar.setPadding(ui.dp(12), ui.dp(10), ui.dp(12), ui.dp(10))

                  val play = LinearLayout(act)
                  play.orientation = LinearLayout.HORIZONTAL
                  play.gravity = Gravity.CENTER_VERTICAL
                  play.background = rounded(Pal.PURPLE, 6f, ui.dens)
                  val playTxt = ui.tv("\u25B6  " + L.s("PLAY", "MAIN"), 18f, Color.WHITE, true)
                  playTxt.setPadding(ui.dp(26), ui.dp(12), ui.dp(20), ui.dp(12))
                  playTxt.isClickable = true
                  playTxt.isFocusable = true
                  playTxt.setOnClickListener { burst(playTxt); launchGame(g) }
                  play.addView(playTxt)
                  val divider = View(act)
                  divider.setBackgroundColor(0x66FFFFFF)
                  play.addView(divider, LinearLayout.LayoutParams(maxOf(1, ui.dp(1)), ui.dp(26)))
                  val arrow = ui.tv("\u25BE", 18f, Color.WHITE, true)
                  arrow.setPadding(ui.dp(14), ui.dp(12), ui.dp(14), ui.dp(12))
                  arrow.isClickable = true
                  arrow.isFocusable = true
                  arrow.setOnClickListener {
                      val pm = PopupMenu(act, arrow)
                      val cur = store.launchType(g.pkg)
                      pm.menu.add(0, 1, 0, (if (cur != "mapper") "\u2713  " else "     ") + typeName("only"))
                      pm.menu.add(0, 2, 1, (if (cur == "mapper") "\u2713  " else "     ") + typeName("mapper"))
                      pm.setOnMenuItemClickListener { item ->
                          store.setLaunchType(g.pkg, if (item.itemId == 2) "mapper" else "only")
                          showDetail(g)
                          true
                      }
                      pm.show()
                  }
                  play.addView(arrow)
                  bar.addView(play, ui.lp(WRAP, WRAP))

                  fun stat(label: String, value: String, color: Int): LinearLayout {
                      val c = LinearLayout(act)
                      c.orientation = LinearLayout.VERTICAL
                      val l = ui.tv(label, 10f, Pal.MUTED, true)
                      l.letterSpacing = 0.08f
                      c.addView(l)
                      c.addView(ui.line(value, color, 14f, 2))
                      return c
                  }
                  val last = store.lastLaunch(g.pkg)
                  val lastTxt = if (last == 0L) L.s("Never", "Belum pernah")
                  else DateFormat.getDateTimeInstance(DateFormat.MEDIUM, DateFormat.SHORT).format(Date(last))
                  bar.addView(stat(L.s("LAUNCH TYPE", "TIPE LUNCUR"), typeName(store.launchType(g.pkg)), Pal.TEXT), ui.lp(WRAP, WRAP, 0, 24))
                  bar.addView(stat(L.s("LAST LAUNCHED", "TERAKHIR DIBUKA"), lastTxt, Pal.TEXT), ui.lp(WRAP, WRAP, 0, 24))
                  val isMapper = store.launchType(g.pkg) == "mapper"
                  val mapperTxt: String
                  val mapperColor: Int
                  if (!isMapper) {
                      mapperTxt = L.s("Off (Launch Only)", "Mati (Luncurkan Saja)"); mapperColor = Pal.MUTED
                  } else if (MapperService.state == 1 && MapperService.gamePkg == g.pkg) {
                      mapperTxt = L.s("Running", "Berjalan"); mapperColor = Pal.GREEN
                  } else if (!AccessMgr.activated(act)) {
                      mapperTxt = L.s("Needs activation", "Perlu aktivasi"); mapperColor = Pal.AMBER
                  } else {
                      mapperTxt = L.s("Ready", "Siap"); mapperColor = Pal.TEXT
                  }
                  bar.addView(stat("MAPPER", mapperTxt, mapperColor), ui.lp(WRAP, WRAP, 0, 24))
                  val spacer = View(act)
                  bar.addView(spacer, LinearLayout.LayoutParams(0, 1, 1f))
                  bar.addView(ui.pill(L.s("Game Configuration", "Konfigurasi Game"), false) { act.openConfig(g) }, ui.lp(WRAP, WRAP))
                  col.addView(bar, ui.lp(MATCH, WRAP, 12))

                  if (isMapper && !AccessMgr.activated(act)) {
                      col.addView(
                          ui.line(
                              L.s(
                                  "Mapper Services need root activation. Open Activation to enable it; until then the game opens without the mapper.",
                                  "Mapper Services memerlukan aktivasi root. Buka Aktivasi untuk mengaktifkannya; sampai saat itu game dibuka tanpa mapper."
                              ), Pal.AMBER, 12f, 8
                          )
                      )
                  }

                  // Tentang game (hanya untuk game yang dikenali)
                  val info = GameInfo.forCover(Covers.bundledFor(g.pkg, g.appLabel))
                  if (info != null) {
                      val c = ui.card()
                      c.addView(ui.tv(L.s("About this game", "Tentang game ini"), 14f, Pal.PURPLE_LIGHT, true))
                      c.addView(ui.line(L.s(info.en, info.id), Pal.TEXT, 14f, 8))
                      c.addView(ui.line(L.s("Developer: ", "Pengembang: ") + info.dev, Pal.MUTED, 12f, 10))
                      col.addView(c, ui.lp(MATCH, WRAP, 14))
                  }

                  // Kelola
                  val r = LinearLayout(act)
                  r.orientation = LinearLayout.HORIZONTAL
                  val danger = if (g.manual) {
                      ui.pill(L.s("Remove from Library", "Hapus dari Pustaka"), false) {
                          store.removeManual(g.pkg)
                          games = games.filter { it.pkg != g.pkg }
                          back()
                          refresh()
                      }
                  } else {
                      ui.pill(L.s("Hide", "Sembunyikan"), false) {
                          store.hide(g.pkg)
                          games = games.filter { it.pkg != g.pkg }
                          back()
                          refresh()
                      }
                  }
                  r.addView(danger, ui.lp(WRAP, WRAP))
                  col.addView(r, ui.lp(WRAP, WRAP, 14))

                  sv.addView(col)
                  root.addView(sv, FrameLayout.LayoutParams(MATCH, MATCH))
              }

              private fun launchGame(g: GameEntry) {
                  Launch.go(act, g.pkg, false)
              }

              private fun burst(v: View) {
                  if (!Perf.particles(act)) return
                  val a = IntArray(2)
                  val b = IntArray(2)
                  v.getLocationInWindow(a)
                  root.getLocationInWindow(b)
                  root.addView(ParticleView(act, (a[0] - b[0] + v.width / 2).toFloat(), (a[1] - b[1] + v.height / 2).toFloat()), FrameLayout.LayoutParams(MATCH, MATCH))
              }

              private fun addManually() {
                  val pm = act.packageManager
                  val shown = games.map { it.pkg }.toSet()
                  val q = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val items = pm.queryIntentActivities(q, 0)
                      .map { Pair(it.loadLabel(pm).toString(), it.activityInfo.packageName) }
                      .filter { it.second != act.packageName && !shown.contains(it.second) }
                      .distinctBy { it.second }
                      .sortedBy { it.first.lowercase() }
                  var cur = items

                  val box = LinearLayout(act)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(ui.dp(16), ui.dp(8), ui.dp(16), 0)
                  val search = EditText(act)
                  search.hint = L.s("Search apps...", "Cari app...")
                  search.setSingleLine(true)
                  box.addView(search, LinearLayout.LayoutParams(MATCH, WRAP))
                  val list = ListView(act)
                  val adapter = ArrayAdapter<String>(act, android.R.layout.simple_list_item_1, ArrayList(items.map { it.first + "\n" + it.second }))
                  list.adapter = adapter
                  box.addView(list, LinearLayout.LayoutParams(MATCH, ui.dp(300)))

                  val dlg = AlertDialog.Builder(act)
                      .setTitle(L.s("Add Manually", "Tambah Manual"))
                      .setView(box)
                      .setNegativeButton(L.s("Cancel", "Batal"), null)
                      .create()

                  search.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                      override fun afterTextChanged(s: Editable?) {
                          val t = s.toString().trim().lowercase()
                          cur = items.filter { t.isEmpty() || it.first.lowercase().contains(t) || it.second.lowercase().contains(t) }
                          adapter.clear()
                          adapter.addAll(cur.map { it.first + "\n" + it.second })
                      }
                  })
                  list.setOnItemClickListener { _, _, pos, _ ->
                      if (pos < cur.size) {
                          val chosen = cur[pos].second
                          store.addManual(chosen)
                          dlg.dismiss()
                          refresh()
                          act.askCover(chosen)
                      }
                  }
                  dlg.show()
              }

              fun onCoverPicked(pkg: String, uri: Uri) {
                  Thread {
                      var ok = false
                      val dir = File(act.filesDir, "covers")
                      dir.mkdirs()
                      val out = File(dir, pkg + "_" + System.currentTimeMillis() + ".img")
                      try {
                          var total = 0L
                          val ins = act.contentResolver.openInputStream(uri)
                          if (ins != null) {
                              ins.use { input ->
                                  out.outputStream().use { os ->
                                      val buf = ByteArray(65536)
                                      while (true) {
                                          val n = input.read(buf)
                                          if (n < 0) break
                                          total += n
                                          if (total > 30L * 1024 * 1024) throw Exception("too large")
                                          os.write(buf, 0, n)
                                      }
                                  }
                              }
                              val o = BitmapFactory.Options()
                              o.inJustDecodeBounds = true
                              BitmapFactory.decodeFile(out.path, o)
                              if (o.outWidth > 0 && o.outHeight > 0) {
                                  val old = store.cover(pkg)
                                  if (old != null) File(old).delete()
                                  store.setCover(pkg, out.path)
                                  ok = true
                              }
                          }
                      } catch (e: Exception) {
                          ok = false
                      }
                      if (!ok) out.delete()
                      act.runOnUiThread {
                          Toast.makeText(
                              act,
                              if (ok) L.s("Cover changed", "Cover diganti") else L.s("Invalid image or too large (max 30 MB)", "Gambar tidak valid atau terlalu besar (maks 30 MB)"),
                              Toast.LENGTH_LONG
                          ).show()
                          val d = detail
                          if (ok && d != null && d.pkg == pkg) showDetail(d)
                      }
                  }.start()
              }
          }
