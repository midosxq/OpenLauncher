              /** Pasang view root dengan padding aman untuk notch dan hide bar sistem. */
              private fun setRoot(v: View) {
                  v.setOnApplyWindowInsetsListener { view, ins ->
                      lastIns = ins
                      val i = ins.getInsets(WindowInsets.Type.displayCutout() or WindowInsets.Type.systemBars())
                      view.setPadding(i.left, i.top, i.right, i.bottom)
                      if (ins.isVisible(WindowInsets.Type.statusBars()) || ins.isVisible(WindowInsets.Type.navigationBars())) {
                          view.removeCallbacks(rehide)
                          view.postDelayed(rehide, 1200)
                      }
                      ins
                  }
                  setContentView(v)
              }

              private fun showWelcome() {
                  setRoot(WelcomeView(this) { showSetup() })
              }

              private fun showSetup() {
                  val s = SetupView(this) {
                      setup = null
                      startMain()
                  }
                  setup = s
                  setRoot(s)
              }

              private fun startMain() {
                  mainStarted = true
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.HORIZONTAL
                  // Latar hitam + Purple Wave yang sama persis dengan Welcome Screen berada di belakang; panel di atasnya semi-transparan.
                  root.setBackgroundColor(0)
                  root.addView(buildSidebar(), LinearLayout.LayoutParams(ui.dp(250), MATCH))
                  val sep = View(this)
                  sep.setBackgroundColor(Pal.BORDER)
                  root.addView(sep, LinearLayout.LayoutParams(maxOf(1, ui.dp(1)), MATCH))
                  content = FrameLayout(this)
                  root.addView(content, LinearLayout.LayoutParams(0, MATCH, 1f))
                  // Dynamic Input Footer: global, kanan bawah, tidak pernah disembunyikan.
                  val frame = FrameLayout(this)
                  frame.setBackgroundColor(Pal.BG)
                  frame.addView(WaveView(this, Perf.animFps(this)), FrameLayout.LayoutParams(MATCH, MATCH))
                  frame.addView(root, FrameLayout.LayoutParams(MATCH, MATCH))
                  val footer = DynamicInputFooter(this)
                  dif = footer
                  val flp = FrameLayout.LayoutParams(WRAP, WRAP, Gravity.BOTTOM or Gravity.END)
                  flp.setMargins(0, 0, ui.dp(16), ui.dp(12))
                  frame.addView(footer, flp)
                  setRoot(frame)
                  library = LibraryView(this)
                  devices = DevicesView(this)
                  activation = ActivationView(this)
                  config = ConfigView(this)
                  AccessMgr.applyStatus(this)
                  refreshStatus()
                  show(current)
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  outState.putString("page", current)
              }

              private fun applyAccess() {
                  AccessMgr.applyStatus(this)
                  setup?.refresh()
                  if (!mainStarted) return
                  refreshStatus()
                  val item = navItems["activation"]
                  if (item != null) item.visibility = if (AccessMgr.activated(this)) View.GONE else View.VISIBLE
                  if (current == "activation") activation.rebuild()
                  if (current == "settings") show("settings")
                  if (current == "config") config.rebuild()
              }

              override fun onDestroy() {
                  AccessMgr.onChange = null
                  MapperService.onChange = null
                  if (mainStarted) devices.stop()
                  super.onDestroy()
              }

              private fun hideBars() {
                  val c = window.insetsController
                  if (c != null) {
                      c.hide(WindowInsets.Type.systemBars())
                      c.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideBars()
              }

              override fun onResume() {
                  super.onResume()
                  hideBars()
                  setup?.refresh()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  setup?.refresh()
              }

              override fun onConfigurationChanged(newConfig: android.content.res.Configuration) {
                  super.onConfigurationChanged(newConfig)
                  hideBars()
                  window.decorView.requestApplyInsets()
              }

              fun openConfig(g: GameEntry) {
                  selectedGame = g
                  show("config")
              }

              fun pickCover(pkg: String) {
                  pendingCoverPkg = pkg
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "image/*"
                  try {
                      startActivityForResult(i, 31)
                  } catch (e: Exception) {
                      Toast.makeText(this, L.s("No image picker found on this device", "Tidak ada pemilih file gambar di perangkat ini"), Toast.LENGTH_LONG).show()
                  }
              }

              /** Cover khusus hanya ditawarkan saat menambah game manual. */
              fun askCover(pkg: String) {
                  AlertDialog.Builder(this)
                      .setTitle(L.s("Cover image", "Gambar cover"))
                      .setMessage(L.s("Choose a cover image for this game? You can skip this.", "Pilih gambar cover untuk game ini? Boleh dilewati."))
                      .setPositiveButton(L.s("Choose image", "Pilih gambar")) { _, _ -> pickCover(pkg) }
                      .setNegativeButton(L.s("Skip", "Lewati"), null)
                      .show()
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (resultCode != RESULT_OK) return
                  val u = data?.data ?: return
                  when (requestCode) {
                      31 -> {
                          val p = pendingCoverPkg
                          if (p != null) library.onCoverPicked(p, u)
                      }
                      41 -> config.onExportPicked(u)
                      42 -> config.onImportPicked(u)
                  }
              }

              /** Kembali lewat Esc / tombol B gamepad. Di Game Library (halaman utama) tidak keluar dari app. */
              private fun navBack(): Boolean {
                  if (!mainStarted) return false
                  return when (current) {
                      "library" -> library.back()
                      "about" -> { show("settings"); true }
                      else -> { show("library"); true }
                  }
              }

              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  dif?.onKey(event.device)
                  val k = event.keyCode
                  if ((k == KeyEvent.KEYCODE_ESCAPE || k == KeyEvent.KEYCODE_BUTTON_B) && mainStarted) {
                      if (event.action == KeyEvent.ACTION_UP) navBack()
                      return true
                  }
                  return super.dispatchKeyEvent(event)
              }

              override fun dispatchGenericMotionEvent(ev: MotionEvent): Boolean {
                  dif?.onMotion(ev)
                  return super.dispatchGenericMotionEvent(ev)
              }

              override fun dispatchTouchEvent(ev: MotionEvent): Boolean {
                  dif?.onTouch(ev)
                  return super.dispatchTouchEvent(ev)
              }

              override fun onBackPressed() {
                  if (mainStarted) {
                      if (current == "library" && library.back()) return
                      if (current == "about") {
                          show("settings")
                          return
                      }
                  }
                  super.onBackPressed()
              }

