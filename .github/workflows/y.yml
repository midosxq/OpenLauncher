          OLEOF
          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/MapStore.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/MapStore.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.content.Context
          import org.json.JSONObject

          /** Konfigurasi mapper per game (package name sebagai kunci) dan hotkey global. */
          object MapStore {
              const val DEF_MAPS = "JOY 0.18 0.70 0.17 17 30 31 32\nCAM 0.72 0.50\nTAP 272 0.88 0.72\nTAP 57 0.93 0.55"
              private val DEF_HK = mapOf("edit" to "67", "ref" to "1", "ptr" to "56")
              const val FORMAT = "OpenLauncher keymap"

              private fun sp(c: Context) = c.applicationContext.getSharedPreferences("ol_mapper", Context.MODE_PRIVATE)

              fun maps(c: Context, pkg: String): String = sp(c).getString("maps_" + pkg, DEF_MAPS) ?: DEF_MAPS
              fun setMaps(c: Context, pkg: String, s: String) { sp(c).edit().putString("maps_" + pkg, s).apply() }
              fun hasCustom(c: Context, pkg: String): Boolean = sp(c).contains("maps_" + pkg)

              private fun clamp(v: Float): Float = Math.round(v.coerceIn(0f, 100f) * 10f) / 10f
              fun camX(c: Context, pkg: String): Float = sp(c).getFloat("camx_" + pkg, 20f)
              fun camY(c: Context, pkg: String): Float = sp(c).getFloat("camy_" + pkg, 20f)
              fun setCam(c: Context, pkg: String, x: Float, y: Float) {
                  sp(c).edit().putFloat("camx_" + pkg, clamp(x)).putFloat("camy_" + pkg, clamp(y)).apply()
              }
              fun lock(c: Context, pkg: String): Boolean = sp(c).getBoolean("lock_" + pkg, true)
              fun setLock(c: Context, pkg: String, v: Boolean) { sp(c).edit().putBoolean("lock_" + pkg, v).apply() }
              /** Sensitivitas kursor; selama belum diatur, mengikuti camX supaya perilaku lama tidak berubah. */
              fun psens(c: Context, pkg: String): Float = sp(c).getFloat("psens_" + pkg, camX(c, pkg))
              fun setPsens(c: Context, pkg: String, v: Float) { sp(c).edit().putFloat("psens_" + pkg, clamp(v)).apply() }
              fun cacc(c: Context, pkg: String): Float = sp(c).getFloat("cacc_" + pkg, 0f)
              fun setCacc(c: Context, pkg: String, v: Float) { sp(c).edit().putFloat("cacc_" + pkg, v.coerceIn(0f, 100f)).apply() }
              fun crazyHz(c: Context, pkg: String): Float = sp(c).getFloat("hz_" + pkg, 15f)
              fun setCrazyHz(c: Context, pkg: String, v: Float) { sp(c).edit().putFloat("hz_" + pkg, v.coerceIn(1f, 40f)).apply() }

              /** Emulate Back Button: salah satu tombol di daftar menekan Android Back. Default: kedua tombol Win (125 = kiri, 126 = kanan). */
              const val DEF_BACK_KEYS = "125,126"
              fun backOn(c: Context): Boolean = sp(c).getBoolean("back_on", true)
              fun setBackOn(c: Context, v: Boolean) { sp(c).edit().putBoolean("back_on", v).apply() }
              fun backKeys(c: Context): String = sp(c).getString("back_keys", DEF_BACK_KEYS) ?: DEF_BACK_KEYS
              fun setBackKeys(c: Context, v: String) { sp(c).edit().putString("back_keys", v).apply() }
              /** Auto Typing: saat keyboard layar/kolom teks game aktif, keyboard fisik mengetik normal dan mapper berhenti sementara. */
              fun autoTyping(c: Context): Boolean = sp(c).getBoolean("auto_typing", true)
              fun setAutoTyping(c: Context, v: Boolean) { sp(c).edit().putBoolean("auto_typing", v).apply() }

              fun hk(c: Context, n: String): String = sp(c).getString("hk_" + n, DEF_HK[n] ?: "") ?: ""
              fun setHk(c: Context, n: String, v: String) { sp(c).edit().putString("hk_" + n, v).apply() }

              fun reset(c: Context, pkg: String) {
                  sp(c).edit().remove("maps_" + pkg).remove("camx_" + pkg).remove("camy_" + pkg).remove("lock_" + pkg).remove("hz_" + pkg).remove("cacc_" + pkg).remove("psens_" + pkg).apply()
              }

              fun summary(c: Context, pkg: String): String {
                  var joy = 0; var cam = 0; var key = 0; var rapid = 0; var pad = 0
                  for (l in maps(c, pkg).split("\n")) {
                      when (l.trim().split(" ")[0]) {
                          "JOY" -> joy++
                          "CAM" -> cam++
                          "TAP" -> key++
                          "RAPID" -> rapid++
                          "PADJOY", "PADCAM" -> pad++
                      }
                  }
                  return L.s("Joystick: ", "Joystick: ") + joy + " | " + L.s("Camera: ", "Kamera: ") + cam + " | " +
                      L.s("Keys/buttons: ", "Tombol: ") + key + " | Crazy Tap: " + rapid + " | Pad: " + pad
              }

              /** Ekspor ke format .xpp (JSON). */
              fun export(c: Context, pkg: String, game: String): String {
                  val o = JSONObject()
                  o.put("format", FORMAT)
                  o.put("version", 1)
                  o.put("package", pkg)
                  o.put("game", game)
                  o.put("camX", camX(c, pkg).toDouble())
                  o.put("camY", camY(c, pkg).toDouble())
                  o.put("lockCursor", lock(c, pkg))
                  o.put("crazyHz", crazyHz(c, pkg).toDouble())
                  o.put("counterAcceleration", cacc(c, pkg).toDouble())
                  o.put("cursorSens", psens(c, pkg).toDouble())
                  o.put("maps", maps(c, pkg))
                  return o.toString(2)
              }

              class Parsed(val pkg: String, val game: String, val camX: Float, val camY: Float, val lock: Boolean, val hz: Float, val maps: String, val cacc: Float = 0f, val psens: Float = -1f)

              /** Parse dan validasi; mengembalikan null bila bukan file keymap OpenLauncher yang valid. */
              fun parse(text: String): Parsed? = try {
                  val o = JSONObject(text)
                  if (o.optString("format") != FORMAT || o.optInt("version", 0) != 1) null
                  else {
                      val maps = o.getString("maps")
                      val ok = maps.split("\n").all { l -> l.isBlank() || l.trim().split(" ")[0] in listOf("JOY", "CAM", "TAP", "RAPID", "PADJOY", "PADCAM") }
                      if (!ok) null
                      else Parsed(
                          o.getString("package"), o.optString("game"),
                          o.optDouble("camX", 20.0).toFloat(), o.optDouble("camY", 20.0).toFloat(),
                          o.optBoolean("lockCursor", true), o.optDouble("crazyHz", 15.0).toFloat(), maps,
                          o.optDouble("counterAcceleration", 0.0).toFloat(),
                          if (o.has("cursorSens")) o.optDouble("cursorSens", 20.0).toFloat() else -1f
                      )
                  }
              } catch (e: Exception) {
                  null
              }

              /** Simpan cadangan sebelum Replace. */
              fun backup(c: Context, pkg: String) {
                  sp(c).edit().putString("backup_" + pkg, export(c, pkg, pkg)).apply()
              }

              fun apply(c: Context, p: Parsed) {
                  backup(c, p.pkg)
                  setMaps(c, p.pkg, p.maps)
                  setCam(c, p.pkg, p.camX, p.camY)
                  setLock(c, p.pkg, p.lock)
                  setCrazyHz(c, p.pkg, p.hz)
                  setCacc(c, p.pkg, p.cacc)
                  if (p.psens >= 0f) setPsens(c, p.pkg, p.psens) else sp(c).edit().remove("psens_" + p.pkg).apply()
              }
          }
          OLEOF
          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/MapperService.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/MapperService.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Point
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock
          import android.provider.Settings
          import android.util.Log
          import android.view.WindowManager
          import android.widget.Toast
          import java.io.OutputStreamWriter
          import java.util.Locale

          /**
           * Mapper Service: hanya berjalan untuk game dengan Launch Type "Launch with Mapper Services".
           * Membutuhkan root: mesin native membaca keyboard/mouse/gamepad dan menyuntik sentuhan.
           */
          class MapperService : Service() {
              companion object {
                  private const val TAG = "OL/Mapper"
                  @Volatile var state = 0 // 0 berhenti, 1 berjalan, 2 error
                  @Volatile var message = ""
                  @Volatile var gamePkg = ""
                  @Volatile var instance: MapperService? = null
                  @Volatile var onChange: (() -> Unit)? = null

                  fun start(c: Context, pkg: String, edit: Boolean) {
                      val i = Intent(c, MapperService::class.java)
                      i.putExtra("pkg", pkg)
                      i.putExtra("edit", edit)
                      c.startForegroundService(i)
                  }

                  fun stop(c: Context) {
                      c.stopService(Intent(c, MapperService::class.java))
                  }
              }

              private val main = Handler(Looper.getMainLooper())
              private val shell = RootShell()
              private var engine: Process? = null
              private var eout: OutputStreamWriter? = null
              private var running = false
              @Volatile private var alive = false
              @Volatile private var fg = ""
              @Volatile private var typing = false
              @Volatile private var ready = false
              @Volatile private var suspended = false
              private var blinkGen = 0
              @Volatile private var warnedEngine = false
              private var lastHk = 0L
              @Volatile private var panelOpen = false
              @Volatile private var lastMode = ""
              @Volatile private var lastView = ""
              private var viewKey = ""
              private var frameStr = ""
              @Volatile private var capCb: ((String) -> Unit)? = null
              @Volatile private var pendingEdit = false
              private var seenGame = false
              private var lastGameSeen = 0L
              private var startedAt = 0L
              private var devK = 0
              private var devM = 0
              private var devP = 0
              private var panel: MapperPanel? = null
              private var pointer: PointerOverlay? = null
              private var lastBlinkAt = 0L
              private val diagLines = ArrayList<String>()
              @Volatile private var diagCb: ((String) -> Unit)? = null
              @Volatile private var exiting = false

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  Theme.load(this)
                  instance = this
              }

              fun runMain(f: () -> Unit) { main.post { f() } }

              private fun toast(s: String) { main.post { Toast.makeText(this, s, Toast.LENGTH_SHORT).show() } }

              private fun setState(s: Int, msg: String) {
                  state = s
                  message = msg
                  onChange?.invoke()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "stop") {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val pkg = intent?.getStringExtra("pkg")
                  if (pkg == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel("mapper", "Mapper Services", NotificationManager.IMPORTANCE_LOW))
                  val stopPi = PendingIntent.getService(this, 1, Intent(this, MapperService::class.java).setAction("stop"), PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  val n = Notification.Builder(this, "mapper")
                      .setContentTitle(L.s("Mapper Services running", "Mapper Services berjalan"))
                      .setContentText(pkg)
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .addAction(Notification.Action.Builder(android.graphics.drawable.Icon.createWithResource(this, android.R.drawable.ic_delete), L.s("Stop", "Hentikan"), stopPi).build())
                      .build()
                  startForeground(1, n)
                  Log.i(TAG, "service start, pkg=" + pkg)

                  if (intent?.getBooleanExtra("edit", false) == true) pendingEdit = true
                  if (running) {
                      if (gamePkg != pkg) {
                          gamePkg = pkg
                          seenGame = false
                          startedAt = SystemClock.elapsedRealtime()
                          sendConfig()
                      }
                      return START_NOT_STICKY
                  }
                  gamePkg = pkg
                  running = true
                  alive = true
                  ready = false
                  warnedEngine = false
                  lastHk = 0L
                  seenGame = false
                  startedAt = SystemClock.elapsedRealtime()
                  Thread { boot() }.start()
                  return START_NOT_STICKY
              }

              private fun boot() {
                  setState(0, L.s("Checking root...", "Memeriksa root..."))
                  if (!shell.run("id").contains("uid=0")) {
                      val why = if (shell.lastError.isNotEmpty()) " (" + shell.lastError + ")" else ""
                      Log.e(TAG, "root check failed" + why)
                      setState(2, L.s("Root access is not available. Activate root first.", "Akses root tidak tersedia. Aktifkan root dulu.") + why)
                      toast(L.s("Mapper: root access failed", "Mapper: akses root gagal") + why)
                      stopLater()
                      return
                  }
                  Log.i(TAG, "root verified (uid=0)")
                  shell.run("appops set " + packageName + " SYSTEM_ALERT_WINDOW allow")
                  val lib = applicationInfo.nativeLibraryDir + "/libxeng.so"
                  shell.run("cp '" + lib + "' /data/local/tmp/ol_eng && chmod 755 /data/local/tmp/ol_eng")
                  if (!shell.run("[ -x /data/local/tmp/ol_eng ] && echo ENGOK").contains("ENGOK")) {
                      Log.e(TAG, "engine binary could not be prepared from " + lib)
                      setState(2, L.s("The mapper engine could not be prepared.", "Mesin mapper tidak bisa disiapkan."))
                      toast(L.s("Mapper: engine could not be prepared", "Mapper: mesin tidak bisa disiapkan"))
                      stopLater()
                      return
                  }
                  try {
                      val p = ProcessBuilder("su").redirectErrorStream(true).start()
                      engine = p
                      eout = OutputStreamWriter(p.outputStream)
                      send("exec /data/local/tmp/ol_eng")
                  } catch (e: Exception) {
                      Log.e(TAG, "engine start failed: " + e.message)
                      setState(2, L.s("Engine failed to start: ", "Engine gagal dimulai: ") + e.message)
                      stopLater()
                      return
                  }
                  Thread {
                      try {
                          val r = engine!!.inputStream.bufferedReader()
                          while (true) {
                              val l = r.readLine() ?: break
                              onEngine(l.trim())
                          }
                      } catch (e: Exception) {
                      }
                      if (alive) {
                          Log.e(TAG, "engine output ended unexpectedly")
                          setState(2, L.s("The engine stopped unexpectedly.", "Engine berhenti tiba-tiba."))
                          stopLater()
                      }
                  }.start()
                  Thread.sleep(400)
                  sendConfig()
                  while (alive) {
                      try { poll() } catch (e: Exception) { }
                      try { Thread.sleep(Perf.pollMs(this)) } catch (e: Exception) { }
                  }
              }

              private fun stopLater() { main.postDelayed({ stopSelf() }, 4000) }

              @Synchronized
              private fun send(s: String) {
                  try {
                      eout?.write(s + "\n")
                      eout?.flush()
                  } catch (e: Exception) {
                  }
              }

              private fun f1(v: Float): String = String.format(Locale.US, "%.1f", v)

              fun sendSens() {
                  send("SENS " + f1(MapStore.camX(this, gamePkg)) + " " + f1(MapStore.camY(this, gamePkg)))
                  send("CACC " + f1(MapStore.cacc(this, gamePkg)))
                  send("PSENS " + f1(MapStore.psens(this, gamePkg)))
              }

              fun applyLock() {
                  send("LOCK " + (if (MapStore.lock(this, gamePkg)) 1 else 0))
                  main.post { updatePointer() }
              }

              fun refreshCursor() { send("REFRESH") }

              fun sendBack() {
                  send("BACK " + (if (MapStore.backOn(this)) 1 else 0) + " " + MapStore.backKeys(this).replace(',', ' '))
              }

              fun sendConfig() {
                  send("CLR")
                  for (l in MapStore.maps(this, gamePkg).split("\n")) if (l.isNotBlank()) send(l.trim())
                  sendSens()
                  send("LOCK " + (if (MapStore.lock(this, gamePkg)) 1 else 0))
                  for (n in listOf("edit", "ref", "ptr")) send("HK " + n + " " + MapStore.hk(this, n).replace(',', ' '))
                  sendBack()
                  lastMode = ""
                  lastView = ""
              }

              /** Minta catatan diagnostik dari mesin (event input berstempel waktu, status slot, viewport). Hasil dikirim ke cb di thread utama. */
              fun requestDiag(cb: (String) -> Unit) {
                  synchronized(diagLines) { diagLines.clear() }
                  diagCb = cb
                  send("DIAG")
                  main.postDelayed({
                      val c = diagCb
                      if (c != null) {
                          diagCb = null
                          c(L.s("(engine did not answer the diagnostics request)", "(mesin tidak menjawab permintaan diagnostik)"))
                      }
                  }, 4000L)
              }

              /**
               * Exit Game: tutup game, baru hentikan Mapper Services, lalu kembali ke OpenLauncher.
               * Hanya `am force-stop` pada package game (menutup proses). Tidak ada penghapusan atau perubahan data, cache, OBB, atau sesi game.
               */
              fun exitGame() {
                  val pkg = gamePkg
                  if (exiting) return
                  if (!Regex("^[A-Za-z0-9._]+$").matches(pkg)) {
                      toast(L.s("Exit Game: invalid package name", "Exit Game: nama package tidak valid"))
                      return
                  }
                  exiting = true
                  main.post { panel?.close(); pointer?.hide() }
                  send("MODE O")
                  lastMode = "O"
                  Thread {
                      try {
                          shell.run("am force-stop " + pkg)
                          var waited = 0
                          while (waited < 25 && shell.run("pidof " + pkg).trim().isNotEmpty()) {
                              try { Thread.sleep(200) } catch (e: Exception) {}
                              waited++
                          }
                          val closed = shell.run("pidof " + pkg).trim().isEmpty()
                          Log.i(TAG, "exit game " + pkg + " closed=" + closed)
                          val cn = packageManager.getLaunchIntentForPackage(packageName)?.component?.flattenToShortString()
                          if (cn != null) shell.run("am start -n " + cn)
                          if (!closed) toast(L.s("The game did not close; the mapper was stopped anyway.", "Game belum tertutup; mapper tetap dihentikan."))
                      } catch (e: Exception) {
                          Log.e(TAG, "exit game failed: " + e.message)
                      }
                      main.post { stopSelf() }
                  }.start()
              }

              fun capture(cb: (String) -> Unit) {
                  capCb = cb
                  send("CAP")
              }

              private fun onEngine(l: String) {
                  val p = l.split(" ")
                  if (p.size < 2 || p[0] != "EV") return
                  when (p[1]) {
                      "READY" -> {
                          ready = true
                          Log.i(TAG, "engine ready")
                          setState(1, "")
                      }
                      "DEV" -> if (p.size >= 5) {
                          devK = p[2].toIntOrNull() ?: 0
                          devM = p[3].toIntOrNull() ?: 0
                          devP = p[4].toIntOrNull() ?: 0
                          Log.i(TAG, "devices kbd=" + devK + " mouse=" + devM + " pad=" + devP)
                      }
                      "HK" -> if (p.size >= 3) {
                          when (p[2]) {
                              "edit" -> main.post { onEditHotkey() }
                              // Cadangan: perangkat uinput tidak tersedia di kernel ini, jadi Back dikirim lewat `input keyevent`.
                              "back" -> Thread {
                                  try { Runtime.getRuntime().exec(arrayOf("su", "-c", "input keyevent 4")).waitFor() } catch (e: Exception) {}
                              }.start()
                          }
                      }
                      "DIAG" -> {
                          val body = if (l.length > 8) l.substring(8) else ""
                          synchronized(diagLines) {
                              if (body == "end") {
                                  val cb = diagCb
                                  diagCb = null
                                  val txt = diagLines.joinToString("\n")
                                  diagLines.clear()
                                  if (cb != null) main.post { cb(txt) }
                              } else if (diagLines.size < 400) {
                                  diagLines.add(body)
                              }
                          }
                      }
                      "SUSP" -> if (p.size >= 3) {
                          suspended = p[2] == "1"
                          main.post { updatePointer() }
                      }
                      "BLINK" -> if (p.size >= 4) {
                          val u = p[2].toFloatOrNull()
                          val v = p[3].toFloatOrNull()
                          if (u != null && v != null) main.post { blinkCursor(u, v) }
                      }
                      "PTRMODE" -> if (p.size >= 3) {
                          MapStore.setLock(this, gamePkg, p[2] == "1")
                          main.post { updatePointer() }
                      }
                      "PTR" -> if (p.size >= 4) {
                          val u = p[2].toFloatOrNull()
                          val v = p[3].toFloatOrNull()
                          if (u != null && v != null) main.post { pointer?.move(u, v) }
                      }
                      "COMBO" -> if (p.size >= 3) {
                          val cb = capCb
                          capCb = null
                          cb?.invoke(p[2])
                      }
                  }
              }

              /**
               * Reset View: satu aksi = satu kedip (kursor tampil singkat di titik awal kamera, lalu kembali ke keadaan semula).
               * Sebelumnya animasi berisi dua denyut (tampil-hilang-tampil-hilang), sehingga satu tekan selalu terlihat berkedip dua kali.
               * Event BLINK ganda dalam 250 ms dianggap satu aksi yang sama.
               */
              private fun blinkCursor(u: Float, v: Float) {
                  if (lastMode != "G" || !Settings.canDrawOverlays(this)) return
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastBlinkAt < 250L) return
                  lastBlinkAt = now
                  val pt = pointer ?: PointerOverlay(this).also { pointer = it }
                  blinkGen++
                  val gen = blinkGen
                  pt.show()
                  pt.move(u, v)
                  main.postDelayed({ if (gen == blinkGen) pt.hide() }, 160L)
                  main.postDelayed({ if (gen == blinkGen) updatePointer() }, 200L)
              }

              private fun updatePointer() {
                  val want = lastMode == "G" && (!MapStore.lock(this, gamePkg) || suspended) && Settings.canDrawOverlays(this)
                  if (want) {
                      if (pointer == null) pointer = PointerOverlay(this)
                      pointer?.show()
                  } else {
                      pointer?.hide()
                      if (lastMode == "G" && Settings.canDrawOverlays(this)) {
                          if (pointer == null) pointer = PointerOverlay(this)
                          pointer?.warm()
                      }
                  }
              }

              private fun poll() {
                  val out = shell.run("dumpsys window | grep -E 'mCurrentFocus|mFocusedApp'; dumpsys input_method | grep -E 'mInputShown|mShowRequested'")
                  val rx = Regex("u\\d+ ([\\w.]+)/")
                  var pkg = ""
                  for (l in out.split("\n")) {
                      if (l.contains("mCurrentFocus")) {
                          val m = rx.find(l)
                          if (m != null) { pkg = m.groupValues[1]; break }
                      }
                  }
                  if (pkg.isEmpty()) {
                      for (l in out.split("\n")) {
                          if (l.contains("mFocusedApp")) {
                              val m = rx.find(l)
                              if (m != null) { pkg = m.groupValues[1]; break }
                          }
                      }
                  }
                  if (pkg.isEmpty()) {
                      val o2 = shell.run("dumpsys activity activities | grep -E 'topResumedActivity|mResumedActivity'")
                      for (l in o2.split("\n")) {
                          val m = rx.find(l)
                          if (m != null) { pkg = m.groupValues[1]; break }
                      }
                  }
                  if (pkg.isNotEmpty()) {
                      if (pkg != fg) Log.d(TAG, "foreground app: " + pkg)
                      fg = pkg
                  }
                  // Auto Typing: mInputShown adalah penanda paling akurat; mShowRequested hanya dipakai bila mInputShown tidak ada di dump
                  // (sebelumnya mShowRequested=true yang basi bisa menahan mapper di mode ketik). Bisa dimatikan dari menu mapper bila deteksi tidak cocok dengan sebuah game.
                  val shown = Regex("mInputShown=(true|false)").find(out)?.groupValues?.get(1)
                  typing = if (!MapStore.autoTyping(this)) false
                  else if (shown != null) shown == "true"
                  else out.contains("mShowRequested=true")

                  val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val rot = wm.defaultDisplay.rotation
                  val pt = Point()
                  wm.defaultDisplay.getRealSize(pt)
                  var pw = pt.x
                  var ph = pt.y
                  try {
                      val md = wm.defaultDisplay.mode
                      pw = md.physicalWidth
                      ph = md.physicalHeight
                      if ((pw > ph) != (pt.x > pt.y)) { val t = pw; pw = ph; ph = t }
                  } catch (e: Exception) {
                      pw = pt.x
                      ph = pt.y
                  }
                  val key = rot.toString() + " " + pt.x + " " + pt.y
                  if (key != viewKey) {
                      viewKey = key
                      frameStr = readFrame(rot, pt.x, pt.y)
                  }
                  val view = "VIEW " + key + " " + pw + " " + ph
                  if (view != lastView) {
                      lastView = view
                      send(view)
                      send(if (frameStr.isEmpty()) "FRAME 0" else "FRAME " + frameStr)
                      Log.i(TAG, "view " + key + " physical=" + pw + "x" + ph + " frame=" + (if (frameStr.isEmpty()) "(computed)" else frameStr))
                  }

                  val now = SystemClock.elapsedRealtime()
                  if (!ready && !warnedEngine && now - startedAt > 8000L) {
                      warnedEngine = true
                      Log.e(TAG, "engine did not report READY within 8s")
                      setState(2, L.s("The mapper engine did not respond.", "Mesin mapper tidak merespons."))
                      toast(L.s("Mapper: the engine did not respond", "Mapper: mesin tidak merespons"))
                  }
                  val inGame = fg == gamePkg
                  if (inGame) {
                      seenGame = true
                      lastGameSeen = now
                      if (pendingEdit && Settings.canDrawOverlays(this)) {
                          pendingEdit = false
                          main.post { togglePanel() }
                      }
                  }
                  val mode = when {
                      panelOpen || !inGame -> "O"
                      typing -> "T"
                      else -> "G"
                  }
                  if (mode != lastMode) {
                      lastMode = mode
                      send("MODE " + mode)
                      main.post { updatePointer() }
                  }

                  if (!seenGame && now - startedAt > 90000L) {
                      main.post { stopSelf() }
                  } else if (seenGame && !inGame) {
                      val limit = if (fg == packageName) 90000L else 20000L
                      if (now - lastGameSeen > limit) main.post { stopSelf() }
                  }
              }

              /**
               * Frame viewport asli dari sistem input (dumpsys input): posisi layar logis di dalam panel fisik,
               * termasuk letterbox akibat "wm size". Format hasil: "l t r b deviceW deviceH" atau kosong bila tidak terbaca.
               */
              private fun readFrame(rot: Int, realW: Int, realH: Int): String {
                  val o = shell.run("dumpsys input | grep physicalFrame")
                  val rf = Regex("physicalFrame=\\[(\\d+), ?(\\d+), ?(\\d+), ?(\\d+)\\]")
                  val rd = Regex("deviceSize=\\[(\\d+), ?(\\d+)\\]")
                  val ro = Regex("orientation=(\\d)")
                  val rid = Regex("displayId=(\\d+)")
                  val rk = Regex("Viewport (\\w+)")
                  for (l in o.split("\n")) {
                      val f = rf.find(l) ?: continue
                      val d = rd.find(l) ?: continue
                      // Hanya viewport layar utama. Sebelumnya baris pertama yang cocok dipakai begitu saja, termasuk viewport display lain
                      // (virtual/eksternal), sehingga skala bisa salah (contoh 720x1560 terbaca sebagai 720x1366).
                      val disp = rid.find(l)?.groupValues?.get(1)?.toIntOrNull()
                      if (disp != null && disp != 0) continue
                      val kind = rk.find(l)?.groupValues?.get(1)
                      if (kind != null && kind != "INTERNAL") continue
                      val orn = ro.find(l)?.groupValues?.get(1)?.toIntOrNull()
                      if (orn != null && orn != rot) continue
                      val fw = f.groupValues[3].toDouble() - f.groupValues[1].toDouble()
                      val fh = f.groupValues[4].toDouble() - f.groupValues[2].toDouble()
                      if (fw <= 0.0 || fh <= 0.0 || realW <= 0 || realH <= 0) continue
                      // Validasi silang: rasio frame harus sama dengan rasio layar logis (boleh tertukar karena rotasi).
                      val ra = realW.toDouble() / realH
                      val fa = fw / fh
                      val okAspect = Math.abs(fa / ra - 1.0) < 0.03 || Math.abs((1.0 / fa) / ra - 1.0) < 0.03
                      if (!okAspect) {
                          Log.w(TAG, "viewport frame ignored (aspect mismatch): " + l.trim())
                          continue
                      }
                      return f.groupValues[1] + " " + f.groupValues[2] + " " + f.groupValues[3] + " " + f.groupValues[4] + " " + d.groupValues[1] + " " + d.groupValues[2]
                  }
                  return ""
              }

              private fun togglePanel() {
                  val p = panel
                  if (p != null && p.showing) {
                      p.close()
                      return
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      Log.w(TAG, "overlay permission missing")
                      toast(L.s("Overlay permission is missing. Enable \"Display over other apps\" for OpenLauncher.", "Izin tampil di atas app lain belum ada. Aktifkan \"Tampil di atas app lain\" untuk OpenLauncher."))
                      return
                  }
                  var label = gamePkg
                  try { label = packageManager.getApplicationLabel(packageManager.getApplicationInfo(gamePkg, 0)).toString() } catch (e: Exception) {}
                  panelOpen = true
                  send("MODE O")
                  lastMode = "O"
                  pointer?.hide()
                  val np = MapperPanel(this, gamePkg, label) {
                      panelOpen = false
                      lastMode = ""
                  }
                  panel = np
                  np.show()
                  if (!np.showing) {
                      panelOpen = false
                      lastMode = ""
                      Log.e(TAG, "panel could not be shown: " + np.error)
                      toast(L.s("The mapper panel could not be shown: ", "Panel mapper tidak bisa ditampilkan: ") + np.error)
                  } else {
                      Log.i(TAG, "panel shown")
                  }
              }

              /** Shortcut buka panel dari engine. Debounce supaya tidak toggle berulang. */
              private fun onEditHotkey() {
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastHk < 350L) return
                  lastHk = now
                  Log.i(TAG, "open-panel shortcut received, foreground=" + fg)
                  if (fg.isNotEmpty() && fg != gamePkg) {
                      toast(L.s("Open the game first, then press the shortcut.", "Buka game dulu, lalu tekan shortcut."))
                      return
                  }
                  togglePanel()
              }

              override fun onDestroy() {
                  Log.i(TAG, "service stop")
                  alive = false
                  running = false
                  try { send("QUIT") } catch (e: Exception) {}
                  try { engine?.destroy() } catch (e: Exception) {}
                  try { panel?.close() } catch (e: Exception) {}
                  try { pointer?.destroy() } catch (e: Exception) {}
                  shell.close()
                  state = 0
                  message = ""
                  instance = null
                  onChange?.invoke()
                  super.onDestroy()
              }
          }
