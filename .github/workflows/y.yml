          package com.midosxq.oplx

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory

          /** Aset branding yang dibundel dari branding.zip (assets/branding/). Isi file dibaca saat runtime. */
          object Brand {
              const val SLOGAN = "Your Games. Your Control."

              fun readText(ctx: Context, path: String): String? = try {
                  ctx.assets.open(path).bufferedReader().use { it.readText() }
              } catch (e: Exception) {
                  null
              }

              /** Memuat gambar dengan mendeteksi format sebenarnya (mis. developer.png yang isinya JPEG). */
              fun bitmap(ctx: Context, path: String, reqW: Int): Bitmap? = try {
                  val o = BitmapFactory.Options()
                  o.inJustDecodeBounds = true
                  ctx.assets.open(path).use { BitmapFactory.decodeStream(it, null, o) }
                  var s = 1
                  while (o.outWidth > 0 && o.outWidth / (s * 2) >= reqW) s *= 2
                  val o2 = BitmapFactory.Options()
                  o2.inSampleSize = s
                  ctx.assets.open(path).use { BitmapFactory.decodeStream(it, null, o2) }
              } catch (e: Exception) {
                  null
              }

              class Dev(val name: String, val user: String, val role: String, val project: String, val desc: String)

              fun dev(ctx: Context): Dev? {
                  val t = readText(ctx, "branding/developer-info.txt") ?: return null
                  val f = HashMap<String, String>()
                  val desc = StringBuilder()
                  var inDesc = false
                  for (raw in t.split("\n")) {
                      val l = raw.trimEnd('\r')
                      if (inDesc) {
                          desc.append(l).append('\n')
                          continue
                      }
                      val i = l.indexOf(':')
                      if (i <= 0) continue
                      val k = l.substring(0, i).trim()
                      val v = l.substring(i + 1).trim()
                      if (k == "Developer Description") inDesc = true else f[k] = v
                  }
                  return Dev(
                      f["Developer Name"] ?: "", f["Developer Username"] ?: "", f["Developer Role"] ?: "",
                      f["Project"] ?: "", desc.toString().trim()
                  )
              }

              /** url == null berarti tautan tidak tersedia; problem menjelaskan alasannya. */
              class Link(val label: String, val url: String?, val problem: String?)

              fun links(ctx: Context): List<Link> {
                  val found = HashMap<String, String>()
                  val t = readText(ctx, "branding/social-links.txt") ?: ""
                  for (raw in t.split("\n")) {
                      val l = raw.trim()
                      val i = l.indexOf(':')
                      if (i <= 0) continue
                      val key = l.substring(0, i).trim().lowercase().replace(" ", "")
                      val v = l.substring(i + 1).trim()
                      if (v.isNotEmpty()) found[key] = v
                  }
                  fun get(vararg keys: String): String? {
                      for (k in keys) if (found.containsKey(k)) return found[k]
                      return null
                  }
                  fun ok(u: String?): Boolean = u != null && (u.startsWith("https://") || u.startsWith("http://"))
                  val out = ArrayList<Link>()
                  val none = L.s("Link not provided", "Tautan belum disediakan")
                  val gh = get("github")
                  out.add(Link("GitHub", if (ok(gh)) gh else null, if (ok(gh)) null else none))
                  val dc = get("discord")
                  out.add(Link("Discord", if (ok(dc)) dc else null, if (ok(dc)) null else none))
                  val tk = get("tiktok")
                  out.add(Link("TikTok", if (ok(tk)) tk else null, if (ok(tk)) null else none))
                  val wa = get("whatsappchannel", "whatsapp")
                  val waOk = ok(wa) && wa!!.contains("whatsapp.com/channel/")
                  out.add(
                      Link(
                          "WhatsApp Channel", if (waOk) wa else null,
                          if (waOk) null else if (wa == null) none else L.s("Not a WhatsApp Channel link", "Bukan tautan WhatsApp Channel")
                      )
                  )
                  return out
              }
          }
