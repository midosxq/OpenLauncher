name: OpenLauncher Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

# Hemat menit Actions: run lama otomatis dibatalkan kalau ada run baru di branch yang sama.
concurrency:
  group: openlauncher-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: assets
          fetch-depth: 1

      - name: Check assets
        run: |
          if [ ! -f assets/source.zip ]; then
            echo "::error::assets/source.zip tidak ada di repo. Upload ke folder assets lalu jalankan ulang."
            exit 1
          fi
          ls -la assets

      - name: Write project source
        run: |
          set -e
          mkdir -p proj
          cd proj
                    mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/RootShell.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/RootShell.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.os.SystemClock
          import android.util.Log
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter

          class RootShell {
              private var proc: Process? = null
              private var out: OutputStreamWriter? = null
              private var inp: BufferedReader? = null

              /** Alasan kegagalan terakhir (su tidak ada, su mati, timeout). Kosong bila tidak ada masalah. */
              @Volatile var lastError: String = ""

              @Synchronized
              fun ensure(): Boolean {
                  if (proc != null) return true
                  return try {
                      val p = ProcessBuilder("su").redirectErrorStream(true).start()
                      proc = p
                      out = OutputStreamWriter(p.outputStream)
                      inp = BufferedReader(InputStreamReader(p.inputStream))
                      true
                  } catch (e: Exception) {
                      proc = null
                      lastError = "su not found"
                      Log.e("OL/Root", "cannot start su: " + e.message)
                      false
                  }
              }

              @Synchronized
              fun run(cmd: String, timeoutMs: Long = 8000L): String {
                  if (!ensure()) return ""
                  val o = out
                  val i = inp
                  val p = proc
                  if (o == null || i == null || p == null) return ""
                  return try {
                      val mark = "XPEND" + System.nanoTime()
                      // "echo" kosong memastikan penanda selalu berada di baris sendiri.
                      o.write(cmd + "\necho\necho " + mark + "\n")
                      o.flush()
                      val sb = StringBuilder()
                      val deadline = SystemClock.elapsedRealtime() + timeoutMs
                      while (true) {
                          if (i.ready()) {
                              val l = i.readLine() ?: break
                              if (l.startsWith(mark)) break
                              sb.append(l).append('\n')
                          } else if (!p.isAlive) {
                              lastError = "su exited (access denied?)"
                              Log.w("OL/Root", "su process ended")
                              close()
                              break
                          } else if (SystemClock.elapsedRealtime() > deadline) {
                              lastError = "root command timeout"
                              Log.w("OL/Root", "timeout")
                              close()
                              break
                          } else {
                              Thread.sleep(15)
                          }
                      }
                      sb.toString()
                  } catch (e: Exception) {
                      close()
                      ""
                  }
              }

              @Synchronized
              fun close() {
                  try { proc?.destroy() } catch (e: Exception) {}
                  proc = null
                  out = null
                  inp = null
              }
          }
          OLEOF
          
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'OLEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OpenLauncher"
          include ':app'
          OLEOF
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'OLEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          OLEOF
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'OLEOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          org.gradle.caching=true
          org.gradle.parallel=true
          OLEOF
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'OLEOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.midosxq.oplx'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.midosxq.oplx'
                  minSdk 30
                  targetSdk 34
                  versionCode 8
                  versionName '0.5.1'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          OLEOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'OLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <application
                  android:label="OpenLauncher"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:extractNativeLibs="true"
                  android:theme="@style/OpenLauncherTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|screenLayout|keyboard|keyboardHidden|navigation|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".MapperService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Keyboard, mouse, and gamepad mapping for the selected game" />
                  </service>
                  <service
                      android:name=".MonitorService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="On-screen FPS and system metrics overlay" />
                  </service>
                  <service
                      android:name=".HighlightsService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
                  <activity
                      android:name=".CaptureActivity"
                      android:exported="false"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar" />
              </application>
          </manifest>
          OLEOF
          mkdir -p "$(dirname 'app/src/main/res/values/colors.xml')"
          cat > 'app/src/main/res/values/colors.xml' <<'OLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#000000</color>
          </resources>
          OLEOF
          mkdir -p "$(dirname 'app/src/main/res/values/themes.xml')"
          cat > 'app/src/main/res/values/themes.xml' <<'OLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="OpenLauncherTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">always</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
              </style>
          </resources>
          OLEOF
          mkdir -p "$(dirname 'app/src/main/res/mipmap-anydpi/ic_launcher.xml')"
          cat > 'app/src/main/res/mipmap-anydpi/ic_launcher.xml' <<'OLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          OLEOF
          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/Access.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/Access.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.content.Context
          import android.provider.Settings
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.util.concurrent.TimeUnit

          class AccessInfo(
              val rootState: Int,
              val rootDetail: String,
              val manager: String,
              val evidence: String,
              val shizukuVersion: String?,
              val adbUsb: Boolean,
              val adbWifi: Boolean
          ) {
              val rootGranted: Boolean get() = rootState == ROOT_GRANTED

              companion object {
                  const val ROOT_UNCHECKED = 0
                  const val ROOT_MISSING = 1
                  const val ROOT_DENIED = 2
                  const val ROOT_GRANTED = 3
              }
          }

          /**
           * Fase 3: evaluasi jalur akses. Hanya root yang benar-benar diverifikasi (su mengembalikan uid=0).
           * Shizuku dan ADB hanya dideteksi (terpasang / diaktifkan), integrasinya belum ada.
           * Root manager tidak pernah ditebak: kalau bukti tidak jelas atau bertentangan, hasilnya "Unknown".
           */
          object AccessMgr {
              private const val PKG_SHIZUKU = "moe.shizuku.privileged.api"
              private const val PKG_MAGISK = "com.topjohnwu.magisk"
              private const val PKG_KSU = "me.weishu.kernelsu"
              private const val PKG_KSUN = "com.rifsxd.ksunext"
              private const val PKG_APATCH = "me.bmax.apatch"

              @Volatile var info: AccessInfo = AccessInfo(AccessInfo.ROOT_UNCHECKED, "", "", "", null, false, false)
              @Volatile var revoked: Boolean = false
              @Volatile var busy: Boolean = false
              @Volatile var onChange: (() -> Unit)? = null

              private fun sp(c: Context) = c.applicationContext.getSharedPreferences("ol_access", Context.MODE_PRIVATE)

              fun activated(c: Context): Boolean = sp(c).getBoolean("activated", false)

              fun methodLabel(manager: String): String {
                  val m = if (manager == "Unknown") L.s("Unknown", "Tidak diketahui") else manager
                  return L.s("Rooted Mode (", "Mode Root (") + m + ")"
              }

              /** Teks detail hasil pemeriksaan root, mengikuti bahasa yang sedang dipilih. */
              fun detailText(code: String): String = when (code) {
                  "MISSING" -> L.s("The su binary was not found. This device does not appear to be rooted.", "Binary su tidak ditemukan. Perangkat ini tampaknya tidak di-root.")
                  "TIMEOUT" -> L.s("The root manager did not answer (timeout). Allow the root request and try again.", "Root manager tidak menjawab (timeout). Izinkan permintaan root lalu coba lagi.")
                  "DENIED" -> L.s("Root access was denied or is not valid.", "Akses root ditolak atau tidak valid.")
                  "OK" -> L.s("Root access verified (uid=0).", "Akses root terverifikasi (uid=0).")
                  else -> ""
              }

              private fun pkgVersion(c: Context, pkg: String): String? = try {
                  c.packageManager.getPackageInfo(pkg, 0).versionName ?: "?"
              } catch (e: Exception) {
                  null
              }

              private fun exec(args: List<String>, timeoutSec: Long): Pair<Int, String>? {
                  return try {
                      val p = ProcessBuilder(args).redirectErrorStream(true).start()
                      val out = StringBuilder()
                      val t = Thread {
                          try {
                              BufferedReader(InputStreamReader(p.inputStream)).use { r ->
                                  while (true) {
                                      val l = r.readLine() ?: break
                                      out.append(l).append('\n')
                                  }
                              }
                          } catch (e: Exception) {
                          }
                      }
                      t.start()
                      if (!p.waitFor(timeoutSec, TimeUnit.SECONDS)) {
                          p.destroy()
                          return Pair(-2, out.toString())
                      }
                      t.join(500)
                      Pair(p.exitValue(), out.toString())
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun passive(c: Context, rootState: Int, detail: String, manager: String, evidence: String): AccessInfo {
                  val cr = c.contentResolver
                  val usb = try { Settings.Global.getInt(cr, Settings.Global.ADB_ENABLED, 0) == 1 } catch (e: Exception) { false }
                  val wifi = try { Settings.Global.getInt(cr, "adb_wifi_enabled", 0) == 1 } catch (e: Exception) { false }
                  return AccessInfo(rootState, detail, manager, evidence, pkgVersion(c, PKG_SHIZUKU), usb, wifi)
              }

              /** Pemeriksaan pasif tanpa meminta root (tidak memunculkan dialog izin). */
              fun refreshPassive(c: Context) {
                  Thread {
                      val cur = info
                      info = passive(c, cur.rootState, cur.rootDetail, cur.manager, cur.evidence)
                      onChange?.invoke()
                  }.start()
              }

              private fun verifyRoot(c: Context): AccessInfo {
                  val r = exec(listOf("su", "-c", "id"), 25)
                      ?: return passive(c, AccessInfo.ROOT_MISSING, "MISSING", "", "")
                  if (r.first == -2) {
                      return passive(c, AccessInfo.ROOT_DENIED, "TIMEOUT", "", "")
                  }
                  if (!r.second.contains("uid=0")) {
                      return passive(c, AccessInfo.ROOT_DENIED, "DENIED", "", r.second.trim())
                  }
                  val suv = exec(listOf("su", "-v"), 5)?.second?.trim() ?: ""
                  val dirsOut = exec(listOf("su", "-c", "ls -d /data/adb/magisk /data/adb/ksu /data/adb/ksud /data/adb/ap /data/adb/apd 2>/dev/null"), 5)?.second ?: ""
                  val dirs = dirsOut.split("\n").map { it.trim() }.filter { it.isNotEmpty() }.toSet()
                  val sl = suv.lowercase()
                  val vMagisk = pkgVersion(c, PKG_MAGISK) != null
                  val vKsu = pkgVersion(c, PKG_KSU) != null
                  val vKsun = pkgVersion(c, PKG_KSUN) != null
                  val vAp = pkgVersion(c, PKG_APATCH) != null

                  val found = ArrayList<String>()
                  if (sl.contains("magisk") || dirs.contains("/data/adb/magisk") || vMagisk) found.add("MagiskSU")
                  val ksuFamily = sl.contains("kernelsu") || dirs.contains("/data/adb/ksu") || dirs.contains("/data/adb/ksud") || vKsu || vKsun
                  if (ksuFamily) {
                      if (vKsun && !vKsu) found.add("KernelSU Next")
                      else if (vKsu && !vKsun) found.add("KernelSU")
                      else found.add("?")
                  }
                  if (dirs.contains("/data/adb/ap") || dirs.contains("/data/adb/apd") || vAp) found.add("APatch")
                  val manager = if (found.size == 1 && found[0] != "?") found[0] else "Unknown"

                  val variant = if (sl.contains("kitsune")) "Kitsune Mask" else ""
                  val ev = (if (variant.isEmpty()) "" else "variant: " + variant + " | ") + "su -v: " + (if (suv.isEmpty()) "(kosong)" else suv) +
                      " | folder: " + (if (dirs.isEmpty()) "-" else dirs.joinToString(",")) +
                      " | app manager: " + listOf(
                          if (vMagisk) "Magisk" else "", if (vKsu) "KernelSU" else "",
                          if (vKsun) "KernelSU Next" else "", if (vAp) "APatch" else ""
                      ).filter { it.isNotEmpty() }.joinToString(",").ifEmpty { "-" }
                  return passive(c, AccessInfo.ROOT_GRANTED, "OK", manager, ev)
              }

              /** Dipanggil saat app dibuka: validasi ulang akses yang pernah aktif; tidak meminta root bila belum pernah aktif. */
              fun startup(c: Context) {
                  if (busy) return
                  busy = true
                  Thread {
                      if (activated(c)) {
                          val res = verifyRoot(c)
                          info = res
                          if (res.rootGranted) {
                              revoked = false
                          } else {
                              sp(c).edit().putBoolean("activated", false).apply()
                              revoked = true
                          }
                      } else {
                          val cur = info
                          info = passive(c, cur.rootState, cur.rootDetail, cur.manager, cur.evidence)
                      }
                      busy = false
                      onChange?.invoke()
                  }.start()
              }

              /** Aktivasi lewat root: memicu permintaan izin dari root manager dan memverifikasi hasilnya. */
              fun activateRoot(c: Context) {
                  if (busy) return
                  busy = true
                  onChange?.invoke()
                  Thread {
                      val res = verifyRoot(c)
                      info = res
                      if (res.rootGranted) {
                          sp(c).edit().putBoolean("activated", true).apply()
                          revoked = false
                      }
                      busy = false
                      onChange?.invoke()
                  }.start()
              }

              fun deactivate(c: Context) {
                  sp(c).edit().putBoolean("activated", false).apply()
                  revoked = false
                  onChange?.invoke()
              }

              /** Memperbarui StatusModel dari keadaan nyata. Mapper Service belum ada di Fase 3, jadi tidak pernah RUNNING. */
              fun applyStatus(c: Context) {
                  if (MapperService.state == 1) {
                      StatusModel.svc = Svc.RUNNING
                      StatusModel.method = if (info.rootGranted) methodLabel(info.manager) else L.s("Root", "Root")
                  } else if (MapperService.state == 2) {
                      StatusModel.svc = Svc.ERROR
                      StatusModel.method = MapperService.message
                  } else if (busy && activated(c) && !info.rootGranted) {
                      StatusModel.svc = Svc.NOT_ACTIVATED
                      StatusModel.method = L.s("Checking access...", "Memeriksa akses...")
                  } else if (activated(c) && info.rootGranted) {
                      StatusModel.svc = Svc.STOPPED
                      StatusModel.method = methodLabel(info.manager)
                  } else {
                      StatusModel.svc = Svc.NOT_ACTIVATED
                      StatusModel.method = L.s("Not Activated", "Belum Aktif")
                  }
              }
          }
          OLEOF
          mkdir -p "$(dirname 'app/src/main/java/com/midosxq/oplx/ActivationView.kt')"
          cat > 'app/src/main/java/com/midosxq/oplx/ActivationView.kt' <<'OLEOF'
          package com.midosxq.oplx

          import android.view.View
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView

          /** Evaluasi jalur akses dan alur aktivasi. Hanya root yang benar-benar bisa diaktifkan. */
          class ActivationView(private val act: MainActivity) {
              private val ui = Ui(act)
              private val root = FrameLayout(act)

              fun view(): View {
                  build()
                  return root
              }

              fun rebuild() {
                  build()
              }

              private fun build() {
                  root.removeAllViews()
                  val i = AccessMgr.info
                  val activated = AccessMgr.activated(act)
                  val sv = ScrollView(act)
                  val col = LinearLayout(act)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(ui.dp(32), ui.dp(24), ui.dp(32), ui.dp(24))
                  col.addView(ui.tv(L.s("Activation", "Aktivasi"), 28f, Pal.TEXT, true))

                  // Status ringkas
                  val st = ui.card()
                  st.addView(ui.tv("Status", 13f, Pal.PURPLE_LIGHT, true))
                  if (activated && i.rootGranted) {
                      st.addView(ui.line(L.s("Active: ", "Aktif: ") + AccessMgr.methodLabel(i.manager), Pal.GREEN, 15f, 8))
                      st.addView(
                          ui.line(
                              L.s(
                                  "The Mapper Service is not built yet, so the service status stays STOPPED. Access alone does not mean the mapper is running.",
                                  "Mapper Service belum ada, jadi status service tetap BERHENTI. Akses saja bukan bukti mapper berjalan."
                              ), Pal.MUTED, 12f, 6
                          )
                      )
                  } else if (AccessMgr.revoked) {
                      st.addView(ui.line(L.s("Previous access is no longer valid", "Akses sebelumnya tidak lagi valid"), Pal.RED, 15f, 8))
                      st.addView(ui.line(AccessMgr.detailText(i.rootDetail) + L.s(" Activate again with the button below.", " Aktifkan ulang lewat tombol di bawah."), Pal.TEXT, 13f, 6))
                  } else if (AccessMgr.busy) {
                      st.addView(ui.line(L.s("Checking access... If the root manager asks, choose Allow.", "Memeriksa akses... Jika muncul permintaan dari root manager, pilih Izinkan."), Pal.AMBER, 14f, 8))
                  } else {
                      st.addView(ui.line(L.s("Not activated yet", "Belum diaktifkan"), Pal.AMBER, 15f, 8))
                  }
                  col.addView(st, ui.lp(MATCH, WRAP, 16))

                  // Root
                  val rc = ui.card()
                  rc.addView(ui.tv("Root", 16f, Pal.TEXT, true))
                  val rootText = when (i.rootState) {
                      AccessInfo.ROOT_GRANTED -> L.s("Verified (uid=0)", "Terverifikasi (uid=0)")
                      AccessInfo.ROOT_MISSING -> L.s("Not available", "Tidak tersedia")
                      AccessInfo.ROOT_DENIED -> L.s("Denied or not valid", "Ditolak atau tidak valid")
                      else -> L.s("Not checked yet", "Belum diperiksa")
                  }
                  val rootColor = when (i.rootState) {
                      AccessInfo.ROOT_GRANTED -> Pal.GREEN
                      AccessInfo.ROOT_MISSING, AccessInfo.ROOT_DENIED -> Pal.RED
                      else -> Pal.MUTED
                  }
                  rc.addView(ui.line("Status: " + rootText, rootColor, 13f, 6))
                  if (i.rootState != AccessInfo.ROOT_UNCHECKED) rc.addView(ui.line(AccessMgr.detailText(i.rootDetail), Pal.TEXT, 13f, 4))
                  if (i.rootGranted) {
                      val mgr = if (i.manager == "Unknown") L.s("Cannot be identified with certainty (not guessed)", "Tidak dapat diidentifikasi dengan pasti (tidak ditebak)") else i.manager
                      rc.addView(ui.line("Root manager: " + mgr, Pal.PURPLE_LIGHT, 13f, 4))
                      rc.addView(ui.line(L.s("Running Method label: ", "Label Running Method: ") + AccessMgr.methodLabel(i.manager), Pal.TEXT, 13f, 4))
                      rc.addView(ui.line(L.s("Evidence: ", "Bukti: ") + i.evidence, Pal.MUTED, 11f, 4))
                  }
                  rc.addView(
                      ui.line(
                          L.s(
                              "Capability: reading raw input devices and injecting touches (to be used by the Mapper Service later). Not used in this version.",
                              "Kemampuan: membaca perangkat input mentah dan menyuntik sentuhan (akan dipakai Mapper Service nanti). Belum dipakai di versi ini."
                          ), Pal.MUTED, 12f, 6
                      )
                  )
                  val btnRow = LinearLayout(act)
                  btnRow.orientation = LinearLayout.HORIZONTAL
                  val label = if (activated) L.s("Re-check root access", "Periksa ulang akses root") else L.s("Activate via Root", "Aktifkan via Root")
                  btnRow.addView(ui.pill(label, true) { AccessMgr.activateRoot(act) }, ui.lp(WRAP, WRAP))
                  btnRow.addView(ui.pill(L.s("Re-check (no root)", "Periksa ulang (tanpa root)"), false) { AccessMgr.refreshPassive(act) }, ui.lp(WRAP, WRAP, 0, 10))
                  if (activated) {
                      btnRow.addView(ui.pill(L.s("Deactivate", "Nonaktifkan"), false) { AccessMgr.deactivate(act) }, ui.lp(WRAP, WRAP, 0, 10))
                  }
                  rc.addView(btnRow, ui.lp(WRAP, WRAP, 12))
                  col.addView(rc, ui.lp(MATCH, WRAP, 16))

                  // Shizuku
                  val sc = ui.card()
                  sc.addView(ui.tv("Shizuku API", 16f, Pal.TEXT, true))
                  if (i.shizukuVersion != null) {
                      sc.addView(ui.line(L.s("Shizuku app installed (version ", "Aplikasi Shizuku terpasang (versi ") + i.shizukuVersion + ")", Pal.GREEN, 13f, 6))
                  } else {
                      sc.addView(ui.line(L.s("Shizuku app not detected", "Aplikasi Shizuku tidak terdeteksi"), Pal.MUTED, 13f, 6))
                  }
                  sc.addView(
                      ui.line(
                          L.s(
