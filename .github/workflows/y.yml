              private fun typeName(t: String): String =
                  if (t == "mapper") L.s("Launch with Mapper Services", "Luncurkan dengan Mapper Services") else L.s("Launch Only", "Luncurkan Saja")

              private fun slider(max: Int, progress: Int, text: (Int) -> String, onChange: (Int) -> Unit): LinearLayout {
                  val c = LinearLayout(act)
