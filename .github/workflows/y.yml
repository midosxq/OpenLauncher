              fun setStyle(c: Context, v: String) { sp(c).edit().putString("style", v).apply() }
              fun metrics(c: Context): Set<String> {
                  val s = sp(c).getString("metrics", "FPS,CPU load,GPU load,RAM") ?: ""
                  return s.split(",").map { it.trim() }.filter { it in ALL }.toSet()
              }
              fun setMetrics(c: Context, v: Set<String>) { sp(c).edit().putString("metrics", ALL.filter { it in v }.joinToString(",")).apply() }
              fun cols(c: Context) = sp(c).getInt("cols", 1)
              fun setCols(c: Context, v: Int) { sp(c).edit().putInt("cols", v).apply() }
              fun scale(c: Context) = sp(c).getFloat("scale", 1f)
              fun setScale(c: Context, v: Float) { sp(c).edit().putFloat("scale", v.coerceIn(0.6f, 2.5f)).apply() }
              fun x(c: Context) = sp(c).getInt("x", 24)
              fun y(c: Context) = sp(c).getInt("y", 24)
              fun setPos(c: Context, x: Int, y: Int) { sp(c).edit().putInt("x", x).putInt("y", y).apply() }
              /** Terkunci = tidak menerima sentuhan, jadi tidak menghalangi game. */
              fun locked(c: Context) = sp(c).getBoolean("locked", true)
              fun setLocked(c: Context, v: Boolean) { sp(c).edit().putBoolean("locked", v).apply() }
          }

          /** Satu pembacaan metrik. null = tidak tersedia di perangkat/akses ini, ditampilkan sebagai "N/A". Tidak ada nilai karangan. */
          class Sample(
              val fps: Double?, val ramUsedMb: Long?, val ramTotalMb: Long?, val swapUsedMb: Long?, val swapTotalMb: Long?,
              val cpuLoad: Int?, val cpuMhz: Int?, val gpuLoad: Int?, val gpuMhz: Int?, val cpuTemp: Double?, val gpuTemp: Double?
          )

          /**
           * Pembaca metrik nyata dari file sistem (/proc, /sys) dan, bila root tersedia, SurfaceFlinger.
           * Semua nilai terukur; bila sumbernya tidak bisa dibaca hasilnya null (N/A).
           */
          class Sampler(private val root: RootShell?) {
              private var rootOk: Boolean? = null
              private var lastStat: LongArray? = null
              private var focusPkg = ""
              private var focusAt = 0L
              private var layer = ""
              private var layerFor = ""
              private var lastPresent = 0L

              private fun rd(path: String): String? = try {
                  val f = File(path)
                  if (f.canRead()) f.readText().trim() else null
              } catch (e: Exception) {
                  null
              }

              private fun rootRun(cmd: String): String? {
                  val r = root ?: return null
                  if (rootOk == false) return null
                  val out = r.run(cmd, 3000L)
                  if (rootOk == null) rootOk = r.lastError.isEmpty()
                  return out
              }

              private fun readAny(path: String): String? = rd(path) ?: rootRun("cat " + path + " 2>/dev/null")?.trim()?.ifEmpty { null }

              private fun mem(): LongArray? {
                  val t = rd("/proc/meminfo") ?: return null
                  var tot = -1L; var av = -1L; var st = 0L; var sf = 0L
                  for (l in t.lines()) {
                      val p = l.split(Regex("\\s+"))
                      if (p.size < 2) continue
                      val kb = p[1].toLongOrNull() ?: continue
                      when (p[0]) {
                          "MemTotal:" -> tot = kb
                          "MemAvailable:" -> av = kb
                          "SwapTotal:" -> st = kb
                          "SwapFree:" -> sf = kb
                      }
                  }
                  if (tot < 0 || av < 0) return null
                  return longArrayOf((tot - av) / 1024, tot / 1024, (st - sf) / 1024, st / 1024)
              }

              private fun cpuLoad(): Int? {
                  val t = readAny("/proc/stat") ?: return null
                  val l = t.lines().firstOrNull { it.startsWith("cpu ") } ?: return null
                  val v = l.split(Regex("\\s+")).drop(1).mapNotNull { it.toLongOrNull() }
                  if (v.size < 5) return null
                  val idle = v[3] + v[4]
                  val total = v.sum()
                  val prev = lastStat
                  lastStat = longArrayOf(idle, total)
                  if (prev == null) return null
                  val dt = total - prev[1]
                  val di = idle - prev[0]
                  if (dt <= 0) return null
                  return (100L * (dt - di) / dt).toInt().coerceIn(0, 100)
              }

              private fun cpuMhz(): Int? {
                  var best = -1L
                  for (i in 0 until 16) {
                      val s = readAny("/sys/devices/system/cpu/cpu" + i + "/cpufreq/scaling_cur_freq") ?: continue
                      val k = s.toLongOrNull() ?: continue
                      if (k > best) best = k
                  }
                  return if (best < 0) null else (best / 1000).toInt()
              }

              private fun gpuLoad(): Int? {
                  rd("/sys/class/kgsl/kgsl-3d0/gpu_busy_percentage")?.let { s ->
                      s.replace("%", "").trim().toIntOrNull()?.let { return it.coerceIn(0, 100) }
                  }
                  rd("/sys/class/kgsl/kgsl-3d0/gpubusy")?.let { s ->
                      val p = s.split(Regex("\\s+")).mapNotNull { it.toLongOrNull() }
                      if (p.size >= 2 && p[1] > 0) return (100L * p[0] / p[1]).toInt().coerceIn(0, 100)
                  }
                  return null
              }

              private fun gpuMhz(): Int? {
                  rd("/sys/class/kgsl/kgsl-3d0/devfreq/cur_freq")?.toLongOrNull()?.let { return (it / 1000000L).toInt() }
                  try {
                      val dirs = File("/sys/class/devfreq").listFiles() ?: return null
                      for (d in dirs) {
                          val n = d.name.lowercase(Locale.US)
                          if (n.contains("gpu") || n.contains("mali") || n.contains("kgsl")) {
                              val f = rd(d.path + "/cur_freq")?.toLongOrNull() ?: continue
                              return (if (f > 100000000L) f / 1000000L else f / 1000L).toInt()
                          }
                      }
                  } catch (e: Exception) {
                  }
                  return null
              }

              private fun temp(match: Regex): Double? {
                  var best: Double? = null
                  for (i in 0 until 60) {
                      val type = rd("/sys/class/thermal/thermal_zone" + i + "/type") ?: continue
                      if (!match.containsMatchIn(type.lowercase(Locale.US))) continue
                      val raw = rd("/sys/class/thermal/thermal_zone" + i + "/temp")?.toDoubleOrNull() ?: continue
                      val c = if (raw > 1000) raw / 1000.0 else raw
                      if (c in 1.0..130.0 && (best == null || c > best)) best = c
                  }
                  return best
              }

              /** FPS dari timestamp present SurfaceFlinger layer aplikasi di depan. Hanya bila root ada; selain itu null. */
              private fun fps(): Double? {
                  if (root == null || rootOk == false) return null
                  val now = android.os.SystemClock.elapsedRealtime()
                  if (now - focusAt > 3000) {
                      focusAt = now
                      val w = rootRun("dumpsys window | grep -E 'mCurrentFocus' | head -1") ?: return null
                      val m = Regex("([A-Za-z0-9._]+)/[A-Za-z0-9._$]+").find(w)
                      focusPkg = m?.groupValues?.get(1) ?: ""
                  }
                  if (focusPkg.isEmpty() || focusPkg == "com.midosxq.oplx") return null
                  if (layerFor != focusPkg) {
                      val l = rootRun("dumpsys SurfaceFlinger --list") ?: return null
                      val c = l.lines().map { it.trim() }.filter { it.contains(focusPkg) && !it.contains("Background") }
                      layer = c.firstOrNull { it.startsWith("SurfaceView") } ?: c.firstOrNull() ?: ""
                      layerFor = focusPkg
                  }
                  if (layer.isEmpty()) return null
                  val out = rootRun("dumpsys SurfaceFlinger --latency \"" + layer + "\"") ?: return null
                  val ts = ArrayList<Long>()
                  for ((i, line) in out.lines().withIndex()) {
                      if (i == 0) continue
                      val p = line.trim().split(Regex("\\s+"))
                      if (p.size < 3) continue
                      val v = p[1].toLongOrNull() ?: continue
                      if (v > 0 && v < Long.MAX_VALUE / 2) ts.add(v)
                  }
                  if (ts.size < 2) return null
                  val last = ts.max()
                  if (last == lastPresent) return 0.0 // tidak ada frame baru sejak pembacaan terakhir
                  lastPresent = last
                  val n = ts.count { it > last - 1_000_000_000L }
                  return n.toDouble()
              }

              fun read(): Sample {
                  val m = mem()
                  return Sample(
                      fps(), m?.get(0), m?.get(1), m?.get(2), m?.get(3),
                      cpuLoad(), cpuMhz(), gpuLoad(), gpuMhz(),
                      temp(Regex("cpu|soc|tsens|big|little|mtktscpu")), temp(Regex("gpu|kgsl|mali"))
                  )
              }
          }

          /** Overlay FPS Monitor. Dua gaya: MSI Afterburner Style (panel metrik) dan BlueStacks Style (hanya FPS, minimal). */
          class MonitorOverlay(private val ctx: Context) {
              private val ui = Ui(ctx)
              private val wm = ctx.getSystemService(Context.WINDOW_SERVICE) as WindowManager
              private var root: FrameLayout? = null
              private var lp: WindowManager.LayoutParams? = null
              private var cells: LinkedHashMap<String, TextView> = LinkedHashMap()
              private var style = "msi"

              private fun na(v: String?) = v ?: "N/A"

              private fun text(k: String, s: Sample): String = when (k) {
                  "FPS" -> "FPS " + na(s.fps?.let { String.format(Locale.US, "%.0f", it) })
                  "RAM" -> "RAM " + (if (s.ramUsedMb != null && s.ramTotalMb != null) String.format(Locale.US, "%.1f/%.1f GB", s.ramUsedMb / 1024.0, s.ramTotalMb / 1024.0) else "N/A")
                  "Swap" -> "SWAP " + (if (s.swapUsedMb != null && s.swapTotalMb != null && s.swapTotalMb > 0) String.format(Locale.US, "%.1f/%.1f GB", s.swapUsedMb / 1024.0, s.swapTotalMb / 1024.0) else "N/A")
                  "CPU load" -> "CPU " + na(s.cpuLoad?.let { it.toString() + "%" })
                  "CPU clock" -> "CPU CLK " + na(s.cpuMhz?.let { it.toString() + " MHz" })
                  "GPU load" -> "GPU " + na(s.gpuLoad?.let { it.toString() + "%" })
                  "GPU clock" -> "GPU CLK " + na(s.gpuMhz?.let { it.toString() + " MHz" })
                  "CPU temp" -> "CPU TEMP " + na(s.cpuTemp?.let { String.format(Locale.US, "%.0f°C", it) })
                  "GPU temp" -> "GPU TEMP " + na(s.gpuTemp?.let { String.format(Locale.US, "%.0f°C", it) })
                  else -> k
              }

              fun show() {
                  hide()
                  style = MonSettings.style(ctx)
                  val scale = MonSettings.scale(ctx)
                  val box = LinearLayout(ctx)
                  box.orientation = LinearLayout.VERTICAL
                  val textSize = 11f * scale
                  cells = LinkedHashMap()
                  if (style == "bs") {
                      // BlueStacks Style: hanya FPS, pil kecil.
                      box.setPadding(ui.dp(8), ui.dp(3), ui.dp(8), ui.dp(3))
                      box.background = rounded(0x99000000.toInt(), 12f, ui.dens, 0, 0f)
                      val t = TextView(ctx)
                      t.textSize = textSize + 2f
                      t.typeface = Typeface.DEFAULT_BOLD
                      t.setTextColor(Pal.GREEN)
                      t.text = "FPS N/A"
                      box.addView(t)
                      cells["FPS"] = t
                  } else {
                      box.setPadding(ui.dp(8), ui.dp(6), ui.dp(8), ui.dp(6))
                      box.background = rounded(0x8C000000.toInt(), 4f, ui.dens, 0, 0f)
                      val keys = MonSettings.ALL.filter { it in MonSettings.metrics(ctx) }
                      val cols = MonSettings.cols(ctx).coerceIn(1, 2)
                      var rowBox: LinearLayout? = null
                      for ((i, k) in keys.withIndex()) {
                          if (i % cols == 0) {
                              rowBox = LinearLayout(ctx)
                              rowBox.orientation = LinearLayout.HORIZONTAL
                              box.addView(rowBox)
                          }
                          val t = TextView(ctx)
                          t.textSize = textSize
                          t.typeface = Typeface.MONOSPACE
                          t.setTextColor(if (k == "FPS") Pal.GREEN else Color.WHITE)
                          t.text = k + " ..."
                          t.setPadding(0, 0, ui.dp(10), 0)
                          t.minWidth = if (cols == 2) (ui.dp(78) * scale).toInt() else 0
                          rowBox?.addView(t)
                          cells[k] = t
                      }
                      if (keys.isEmpty()) {
                          val t = TextView(ctx)
                          t.textSize = textSize
                          t.setTextColor(Pal.MUTED)
                          t.text = L.s("No metric selected", "Tidak ada metrik dipilih")
                          box.addView(t)
                      }
                  }
                  val fl = FrameLayout(ctx)
                  fl.addView(box, FrameLayout.LayoutParams(WRAP, WRAP))
                  val locked = MonSettings.locked(ctx)
                  var flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  if (locked) flags = flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  val p = WindowManager.LayoutParams(WRAP, WRAP, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, flags, PixelFormat.TRANSLUCENT)
                  p.gravity = Gravity.TOP or Gravity.START
                  p.x = MonSettings.x(ctx)
                  p.y = MonSettings.y(ctx)
                  lp = p
                  if (!locked) {
                      // Geser untuk memindahkan; posisi disimpan saat jari diangkat.
                      var dx = 0f; var dy = 0f; var x0 = 0; var y0 = 0
                      fl.setOnTouchListener { _, e ->
                          when (e.actionMasked) {
                              MotionEvent.ACTION_DOWN -> { dx = e.rawX; dy = e.rawY; x0 = p.x; y0 = p.y }
                              MotionEvent.ACTION_MOVE -> {
                                  p.x = x0 + (e.rawX - dx).toInt()
                                  p.y = y0 + (e.rawY - dy).toInt()
                                  try { wm.updateViewLayout(fl, p) } catch (ex: Exception) {}
                              }
                              MotionEvent.ACTION_UP -> MonSettings.setPos(ctx, p.x, p.y)
                          }
                          true
                      }
                  }
                  try {
                      wm.addView(fl, p)
                      root = fl
                  } catch (e: Exception) {
                      root = null
                  }
              }

              fun update(s: Sample) {
                  for ((k, t) in cells) {
                      t.text = text(k, s)
                      if (style == "bs") t.text = text("FPS", s)
                  }
              }

              fun hide() {
                  val r = root ?: return
                  try { wm.removeView(r) } catch (e: Exception) {}
                  root = null
                  cells = LinkedHashMap()
              }
          }

          /** Service foreground untuk FPS Monitor. Berdiri sendiri: tidak memerlukan Mapper Services. */
          class MonitorService : Service() {
              private val h = Handler(Looper.getMainLooper())
              private var overlay: MonitorOverlay? = null
              private var sampler: Sampler? = null
              private var thread: Thread? = null
              @Volatile private var alive = false
              private var rootShell: RootShell? = null

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "stop") {
                      MonSettings.setEnabled(this, false)
                      shutdown()
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel("monitor", "FPS Monitor", NotificationManager.IMPORTANCE_LOW))
                  val stopPi = PendingIntent.getService(this, 2, Intent(this, MonitorService::class.java).setAction("stop"), PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  val n = Notification.Builder(this, "monitor")
                      .setContentTitle("FPS Monitor")
                      .setContentText(L.s("Overlay monitoring is on", "Overlay pemantauan aktif"))
                      .setSmallIcon(android.R.drawable.ic_menu_info_details)
                      .addAction(Notification.Action.Builder(android.graphics.drawable.Icon.createWithResource(this, android.R.drawable.ic_delete), L.s("Stop", "Hentikan"), stopPi).build())
                      .build()
                  startForeground(3, n)
                  if (alive) {
                      // Pengaturan berubah: bangun ulang overlay.
                      h.post { overlay?.show() }
                      return START_STICKY
                  }
                  alive = true
                  // Root dipakai hanya untuk FPS/metrik yang tidak bisa dibaca biasa; bila su tidak ada, metrik itu N/A.
                  rootShell = RootShell()
                  sampler = Sampler(rootShell)
                  overlay = MonitorOverlay(this)
                  overlay?.show()
                  thread = Thread {
                      while (alive) {
                          val s = try { sampler?.read() } catch (e: Exception) { null }
                          if (s != null) h.post { overlay?.update(s) }
                          try { Thread.sleep(1000) } catch (e: InterruptedException) { break }
                      }
                  }
                  thread?.start()
                  return START_STICKY
              }

              private fun shutdown() {
                  alive = false
                  thread?.interrupt()
                  h.post { overlay?.hide() }
                  try { rootShell?.close() } catch (e: Exception) {}
              }

              override fun onDestroy() {
                  shutdown()
                  super.onDestroy()
              }

              companion object {
                  fun start(c: Context) {
                      c.startForegroundService(Intent(c, MonitorService::class.java))
                  }
                  fun stop(c: Context) {
                      c.startService(Intent(c, MonitorService::class.java).setAction("stop"))
                  }
              }
          }
