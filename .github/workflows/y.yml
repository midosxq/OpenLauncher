              /** Pasang view root dengan padding aman untuk notch dan hide bar sistem. */
              private fun setRoot(v: View) {
                  v.setOnApplyWindowInsetsListener { view, ins ->
                      lastIns = ins
                      val i = ins.getInsets(WindowInsets.Type.displayCutout() or WindowInsets.Type.systemBars())
                      view.setPadding(i.left, i.top, i.right, i.bottom)
                      if (ins.isVisible(WindowInsets.Type.statusBars()) || ins.isVisible(WindowInsets.Type.navigationBars())) {
                          view.removeCallbacks(rehide)
                          view.postDelayed(rehide, 1200)
                      }
                      ins
                  }
                  setContentView(v)
              }

              private fun showWelcome() {
                  setRoot(WelcomeView(this) { showSetup() })
              }

              private fun showSetup() {
                  val s = SetupView(this) {
                      setup = null
                      startMain()
                  }
                  setup = s
                  setRoot(s)
              }

              private fun startMain() {
                  mainStarted = true
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.HORIZONTAL
                  root.setBackgroundColor(Pal.BG)
                  root.addView(buildSidebar(), LinearLayout.LayoutParams(ui.dp(250), MATCH))
                  val sep = View(this)
                  sep.setBackgroundColor(Pal.BORDER)
                  root.addView(sep, LinearLayout.LayoutParams(maxOf(1, ui.dp(1)), MATCH))
                  content = FrameLayout(this)
                  root.addView(content, LinearLayout.LayoutParams(0, MATCH, 1f))
                  setRoot(root)
                  library = LibraryView(this)
                  devices = DevicesView(this)
                  activation = ActivationView(this)
                  config = ConfigView(this)
                  AccessMgr.applyStatus(this)
                  refreshStatus()
                  show(current)
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  outState.putString("page", current)
              }

              private fun applyAccess() {
                  AccessMgr.applyStatus(this)
                  setup?.refresh()
                  if (!mainStarted) return
                  refreshStatus()
                  val item = navItems["activation"]
                  if (item != null) item.visibility = if (AccessMgr.activated(this)) View.GONE else View.VISIBLE
                  if (current == "activation") activation.rebuild()
                  if (current == "settings") show("settings")
                  if (current == "config") config.rebuild()
              }

              override fun onDestroy() {
                  AccessMgr.onChange = null
                  MapperService.onChange = null
                  if (mainStarted) devices.stop()
                  super.onDestroy()
              }

              private fun hideBars() {
                  val c = window.insetsController
                  if (c != null) {
                      c.hide(WindowInsets.Type.systemBars())
                      c.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideBars()
              }

              override fun onResume() {
                  super.onResume()
                  hideBars()
                  setup?.refresh()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  setup?.refresh()
              }

              override fun onConfigurationChanged(newConfig: android.content.res.Configuration) {
                  super.onConfigurationChanged(newConfig)
                  hideBars()
                  window.decorView.requestApplyInsets()
              }

