                      val t = LinearLayout(act)
                      t.orientation = LinearLayout.VERTICAL
                      t.addView(ui.tv(title, 14f, Pal.TEXT, true))
                      t.addView(ui.line(Keys.combo(MapStore.hk(act, key)), Pal.MUTED, 12f, 2))
                      r.addView(t, LinearLayout.LayoutParams(0, WRAP, 1f))
                      r.addView(ui.pill(L.s("Change", "Ubah"), false) {
