              private fun overlayCard(): View {
                  val c = ui.card()
                  c.addView(ui.tv("Overlay", 15f, Pal.PURPLE_LIGHT, true))
                  c.addView(ui.line("Selected UI for Monitoring", Pal.MUTED, 12f, 6))
                  val st = MonSettings.style(this)
                  val r = LinearLayout(this)
                  r.orientation = LinearLayout.HORIZONTAL
                  r.addView(ui.pill("MSI Afterburner Style", st == "msi") { MonSettings.setStyle(this, "msi"); applyMonitor(); show("settings") }, ui.lp(WRAP, WRAP))
                  r.addView(ui.pill("BlueStacks Style", st == "bs") { MonSettings.setStyle(this, "bs"); applyMonitor(); show("settings") }, ui.lp(WRAP, WRAP, 0, 8))
                  c.addView(r, ui.lp(WRAP, WRAP, 8))
                  val on = MonSettings.enabled(this)
                  c.addView(ui.pill(if (on) L.s("Monitoring: ON (tap to stop)", "Pemantauan: ON (ketuk untuk berhenti)") else L.s("Monitoring: OFF (tap to start)", "Pemantauan: OFF (ketuk untuk mulai)"), on) {
                      if (!android.provider.Settings.canDrawOverlays(this)) {
                          HlNotify.show(this, L.s("Overlay permission needed", "Butuh izin overlay"), "", true)
                      } else {
                          MonSettings.setEnabled(this, !on)
                          if (!on) MonitorService.start(this) else MonitorService.stop(this)
                          show("settings")
                      }
                  }, ui.lp(WRAP, WRAP, 12))
                  if (st == "msi") {
                      c.addView(ui.line(L.s("Metrics", "Metrik"), Pal.MUTED, 12f, 12))
                      val cur = MonSettings.metrics(this)
                      val flow = LinearLayout(this)
                      flow.orientation = LinearLayout.VERTICAL
                      var row: LinearLayout? = null
                      for ((i, k) in MonSettings.ALL.withIndex()) {
                          if (i % 3 == 0) { row = LinearLayout(this); row.orientation = LinearLayout.HORIZONTAL; flow.addView(row, ui.lp(WRAP, WRAP, 6)) }
                          row?.addView(ui.pill(k, k in cur) {
                              val n = cur.toMutableSet()
                              if (k in n) n.remove(k) else n.add(k)
                              MonSettings.setMetrics(this, n); applyMonitor(); show("settings")
                          }, ui.lp(WRAP, WRAP, 0, if (i % 3 == 0) 0 else 6))
                      }
                      c.addView(flow, ui.lp(WRAP, WRAP, 2))
                      val o = LinearLayout(this)
                      o.orientation = LinearLayout.HORIZONTAL
                      o.addView(ui.pill(L.s("1 column", "1 kolom"), MonSettings.cols(this) == 1) { MonSettings.setCols(this, 1); applyMonitor(); show("settings") }, ui.lp(WRAP, WRAP))
                      o.addView(ui.pill(L.s("2 columns", "2 kolom"), MonSettings.cols(this) == 2) { MonSettings.setCols(this, 2); applyMonitor(); show("settings") }, ui.lp(WRAP, WRAP, 0, 8))
                      c.addView(o, ui.lp(WRAP, WRAP, 12))
                  }
                  val o2 = LinearLayout(this)
                  o2.orientation = LinearLayout.HORIZONTAL
                  o2.addView(ui.pill("Size -", false) { MonSettings.setScale(this, MonSettings.scale(this) - 0.15f); applyMonitor() }, ui.lp(WRAP, WRAP))
                  o2.addView(ui.pill("Size +", false) { MonSettings.setScale(this, MonSettings.scale(this) + 0.15f); applyMonitor() }, ui.lp(WRAP, WRAP, 0, 8))
                  o2.addView(ui.pill(if (MonSettings.locked(this)) L.s("Position: locked", "Posisi: terkunci") else L.s("Position: drag to move", "Posisi: geser untuk pindah"), !MonSettings.locked(this)) {
                      MonSettings.setLocked(this, !MonSettings.locked(this)); applyMonitor(); show("settings")
                  }, ui.lp(WRAP, WRAP, 0, 8))
                  c.addView(o2, ui.lp(WRAP, WRAP, 12))
                  c.addView(ui.line(L.s("All values are read from the device; anything unreadable shows N/A. FPS needs root (SurfaceFlinger). Nothing is estimated.", "Semua nilai dibaca dari perangkat; yang tidak terbaca tampil N/A. FPS butuh root (SurfaceFlinger). Tidak ada nilai perkiraan."), Pal.MUTED, 11f, 10))
                  return c
              }

              private fun applyMonitor() {
