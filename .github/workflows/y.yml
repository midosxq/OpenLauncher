                              printf("EV REFRESHED\n");
                          } else printf("EV HK %s\n", hk_name[i]);
                      }
                  }
              }
              if (mode != 1) return;
              if (!lockc && code == BTN_LEFT) {
                  if (down) tdown(PTR_SLOT, pu, pv); else tup(PTR_SLOT);
                  return;
              }
              for (i = 0; i < nmap; i++) {
                  Map *m = &maps[i];
                  if (m->type == M_JOY) {
                      for (j = 0; j < 4; j++) if (m->key[j] == code) { joy_update(m); break; }
                  } else if (m->type == M_TAP && m->key[0] == code) {
                      if (down && !m->down) { tdown(m->slot, m->u, m->v); m->down = 1; }
                      else if (!down && m->down) { tup(m->slot); m->down = 0; }
                  } else if (m->type == M_RAPID && m->key[0] == code) {
                      if (down) { m->down = 1; m->next = 0; }
                      else { m->down = 0; if (m->rf) { tup(m->slot); m->rf = 0; } }
                  }
              }
          }
          static void handle(Dev *d, struct input_event *e) {
              if (d->type == T_TOUCH) return;
              if (e->type == EV_KEY && e->code < NKEY) {
                  if (e->value == 2) return;
                  kd[e->code] = e->value ? 1 : 0;
                  on_key(e->code, e->value ? 1 : 0);
              } else if (e->type == EV_ABS && d->type == T_PAD) {
                  pad_abs(d, e->code, e->value);
              } else if (e->type == EV_REL && d->type == T_MOUSE) {
                  if (e->code == REL_X) mdx += e->value;
                  else if (e->code == REL_Y) mdy += e->value;
                  else if (e->code == REL_WHEEL && e->value != 0) pulse(e->value > 0 ? 10001 : 10002);
              } else if (e->type == EV_SYN && e->code == SYN_REPORT && d->type == T_MOUSE) {
                  if ((mdx || mdy) && mode == 1) {
                      if (lockc) cam_apply(mdx, mdy);
                      else {
                          pu += mdx * sensx * 0.1 / vw; pv += mdy * sensy * 0.1 / vh;
                          if (pu < 0) pu = 0; if (pu > 1) pu = 1; if (pv < 0) pv = 0; if (pv > 1) pv = 1;
                          tmove(PTR_SLOT, pu, pv);
                          emit_ptr();
                      }
                  }
                  mdx = 0; mdy = 0;
              }
          }
          static void add_map(int type, double u, double v, double r, int k0, int k1, int k2, int k3) {
              Map *m; int q;
              if (nmap >= MAXMAP) return;
              m = &maps[nmap++];
              memset(m, 0, sizeof *m);
              m->type = type; m->u = u; m->v = v; m->r = r;
              m->key[0] = k0; m->key[1] = k1; m->key[2] = k2; m->key[3] = k3;
              if (type == M_JOY || type == M_PADJOY) m->slot = 0;
              else if (type == M_CAM || type == M_PADCAM) m->slot = 1;
              else m->slot = 2 + (tapn++ % 5);
              for (q = 0; q < 4; q++) if (m->key[q] < 0 || m->key[q] >= KDSZ) m->key[q] = 0;
          }
          static void command(char *line) {
              char *tok[16]; int n = 0, i;
              char *p = strtok(line, " \r\n");
              while (p && n < 16) { tok[n++] = p; p = strtok(NULL, " \r\n"); }
              if (n == 0) return;
              if (!strcmp(tok[0], "CLR")) { release_all(); nmap = 0; tapn = 0; }
              else if (!strcmp(tok[0], "JOY") && n >= 8) add_map(M_JOY, atof(tok[1]), atof(tok[2]), atof(tok[3]), atoi(tok[4]), atoi(tok[5]), atoi(tok[6]), atoi(tok[7]));
              else if (!strcmp(tok[0], "CAM") && n >= 3) add_map(M_CAM, atof(tok[1]), atof(tok[2]), 0, 0, 0, 0, 0);
              else if (!strcmp(tok[0], "TAP") && n >= 4) add_map(M_TAP, atof(tok[2]), atof(tok[3]), 0, atoi(tok[1]), 0, 0, 0);
              else if (!strcmp(tok[0], "RAPID") && n >= 5) add_map(M_RAPID, atof(tok[2]), atof(tok[3]), atof(tok[4]), atoi(tok[1]), 0, 0, 0);
              else if (!strcmp(tok[0], "PADJOY") && n >= 4) add_map(M_PADJOY, atof(tok[1]), atof(tok[2]), atof(tok[3]), 0, 0, 0, 0);
              else if (!strcmp(tok[0], "PADCAM") && n >= 4) add_map(M_PADCAM, atof(tok[1]), atof(tok[2]), atof(tok[3]), 0, 0, 0, 0);
              else if (!strcmp(tok[0], "SENS") && n >= 3) { sensx = atof(tok[1]); sensy = atof(tok[2]); if (sensx < 0) sensx = 0; if (sensy < 0) sensy = 0; if (sensx > 100) sensx = 100; if (sensy > 100) sensy = 100; }
              else if (!strcmp(tok[0], "LOCK") && n >= 2) { lockc = atoi(tok[1]) ? 1 : 0; release_all(); }
              else if (!strcmp(tok[0], "HK") && n >= 2) {
                  int h = !strcmp(tok[1], "edit") ? 0 : !strcmp(tok[1], "tog") ? 1 : !strcmp(tok[1], "ref") ? 2 : !strcmp(tok[1], "ptr") ? 3 : -1;
                  if (h >= 0) { hks[h].n = 0; for (i = 2; i < n && hks[h].n < 6; i++) hks[h].k[hks[h].n++] = atoi(tok[i]); }
              }
              else if (!strcmp(tok[0], "VIEW") && n >= 4) { rot = atoi(tok[1]) & 3; vw = atof(tok[2]); vh = atof(tok[3]); if (vw < 1) vw = 1; if (vh < 1) vh = 1; }
              else if (!strcmp(tok[0], "MODE") && n >= 2) set_mode(tok[1][0] == 'G' ? 1 : tok[1][0] == 'T' ? 2 : 0);
              else if (!strcmp(tok[0], "REFRESH")) {
                  int d2; release_all();
                  if (mode == 1) for (d2 = 0; d2 < ndev; d2++) { grab_dev(&devs[d2], 0); grab_dev(&devs[d2], 1); }
                  printf("EV REFRESHED\n");
              }
              else if (!strcmp(tok[0], "CAP")) { cap = 1; cap_n = 0; }
              else if (!strcmp(tok[0], "QUIT")) { set_mode(0); exit(0); }
              fflush(stdout);
          }
          static void tick(void) {
              long n = now_ms();
              int i;
              double dt = last_tick ? (n - last_tick) / 1000.0 : 0.02;
              last_tick = n;
              if (dt > 0.1) dt = 0.1;
              for (i = 0; i < 8; i++) if (pend[i].code && n >= pend[i].due) { int c = pend[i].code; pend[i].code = 0; vkey(c, 0); }
              for (i = 0; i < nmap; i++) {
                  Map *m = &maps[i];
                  if (m->type == M_RAPID && m->down && mode == 1 && n >= m->next) {
                      double hz = m->r < 1 ? 1 : (m->r > 40 ? 40 : m->r);
                      long period = (long)(1000.0 / hz), hold = 25;
                      if (period < hold + 10) period = hold + 10;
                      if (!m->rf) { tdown(m->slot, m->u, m->v); m->rf = 1; m->next = n + hold; }
                      else { tup(m->slot); m->rf = 0; m->next = n + (period - hold); }
