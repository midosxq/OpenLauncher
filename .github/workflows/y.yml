          /** Alur peluncuran: pertama kali = Welcome + Setup (tanpa intro); setelah setup = intro tiap peluncuran normal. */
          object Flow {
              private fun sp(c: Context) = c.applicationContext.getSharedPreferences("ol_flow", Context.MODE_PRIVATE)
              fun setupDone(c: Context): Boolean = sp(c).getBoolean("setup_done", false)
              fun setSetupDone(c: Context) { sp(c).edit().putBoolean("setup_done", true).apply() }
          }

